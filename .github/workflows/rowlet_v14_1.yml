
name: Build Rowlet V14.6 Network Probe Display Fix

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore V13.9 tested base
        shell: bash
        env:
          ROWLET_NOTIFY_URL: ${{ secrets.ROWLET_NOTIFY_URL }}
          ROWLET_NOTIFY_TOKEN: ${{ secrets.ROWLET_NOTIFY_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, subprocess, yaml

          filename = '.github/workflows/rowlet_v13_5_gmail_counter.yml'

          for key in ('ROWLET_NOTIFY_URL', 'ROWLET_NOTIFY_TOKEN'):
              if not os.environ.get(key):
                  raise SystemExit('Missing Actions secret ' + key)

          commits = subprocess.check_output(
              ['git', 'log', '--all', '--format=%H', '--', filename],
              text=True
          ).splitlines()

          candidate = None

          for sha in commits:
              item = subprocess.run(
                  ['git', 'show', f'{sha}:{filename}'],
                  capture_output=True, text=True
              )

              if item.returncode:
                  continue

              try:
                  doc = yaml.safe_load(item.stdout)
              except yaml.YAMLError:
                  continue

              if (
                  isinstance(doc, dict)
                  and doc.get('name') ==
                  'Build Rowlet V13.9 Private Memory Gmail Fix'
              ):
                  candidate = doc
                  print('Recovered V13.9 from', sha[:12])
                  break

          if candidate is None:
              raise SystemExit(
                  'V13.9 is not in this file history'
              )

          steps = candidate['jobs']['build']['steps']

          required = (
              'Rebuild V13.8.1 hunting and Gmail source',
              'Enable private memory in plugin header'
          )

          for name in required:
              matches = [
                  step for step in steps
                  if step.get('name') == name
              ]

              if len(matches) != 1:
                  raise SystemExit(
                      'Missing V13.9 build step: ' + name
                  )

              print('Applying', name, flush=True)

              subprocess.run(
                  [
                      'bash', '-e', '-o', 'pipefail',
                      '-c', matches[0]['run']
                  ],
                  check=True,
                  env=os.environ.copy()
              )
          PY

      - name: Add isolated IP and DNS tests
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/v146_patch.py <<'PY'
          from pathlib import Path
          import re

          main = Path('3gx/sources/main.c')
          frame = Path('reader_core/src/gen7/frame.rs')

          m = main.read_text()
          f = frame.read_text()

          def once(s, old, new, label):
              n = s.count(old)

              if n != 1:
                  raise SystemExit(
                      '%s: expected one match, got %d'
                      % (label, n)
                  )

              return s.replace(old, new, 1)

          network_test = r'''
          // V14.6: manual network tests.
          // Never called during normal hunting.

          static volatile u32 v146_stage[2] = {0,0};
          static volatile u32 v146_error[2] = {0,0};
          static volatile u32 v146_http[2] = {0,0};

          static u32 v146_l_held = 0;
          static u32 v146_r_held = 0;

          u32 rowlet_v146_stage(u32 n)
          {
              return n < 2 ? v146_stage[n] : 0;
          }

          u32 rowlet_v146_error(u32 n)
          {
              return n < 2 ? v146_error[n] : 0;
          }

          u32 rowlet_v146_http(u32 n)
          {
              return n < 2 ? v146_http[n] : 0;
          }

          static void rowlet_v146_test(
              u32 n,
              const char *url
          )
          {
              if (n >= 2)
                  return;

              v146_stage[n] = 1;
              v146_error[n] = 0;
              v146_http[n] = 0;

              Result rc = httpcInit(0x1000);

              if (R_FAILED(rc)) {
                  v146_error[n] = (u32)rc;
                  return;
              }

              httpcContext ctx;

              v146_stage[n] = 2;

              rc = httpcOpenContext(
                  &ctx,
                  HTTPC_METHOD_GET,
                  url,
                  1
              );

              if (R_FAILED(rc)) {
                  v146_error[n] = (u32)rc;
                  httpcExit();
                  return;
              }

              v146_stage[n] = 3;

              rc = httpcBeginRequest(&ctx);

              if (R_SUCCEEDED(rc)) {
                  v146_stage[n] = 4;

                  u32 status = 0;

                  rc = httpcGetResponseStatusCode(
                      &ctx,
                      &status
                  );

                  if (R_SUCCEEDED(rc)) {
                      v146_stage[n] = 5;
                      v146_http[n] = status;
                  }
              }

              if (R_FAILED(rc)) {
                  v146_error[n] = (u32)rc;
              }

              httpcCloseContext(&ctx);
              httpcExit();
          }

          static void rowlet_v146_test_tick(u32 keys)
          {
              // Called only in the stopped-mode
              // notification handler.

              u32 l =
                  (keys & (KEY_SELECT | KEY_L)) ==
                  (KEY_SELECT | KEY_L);

              u32 r =
                  (keys & (KEY_SELECT | KEY_R)) ==
                  (KEY_SELECT | KEY_R);

              if (l && !v146_l_held) {
                  rowlet_v146_test(
                      0,
                      "http://1.1.1.1/"
                  );
              }

              if (r && !v146_r_held) {
                  rowlet_v146_test(
                      1,
                      "http://example.com/"
                  );
              }

              v146_l_held = l;
              v146_r_held = r;
          }
          '''

          m = once(
              m,
              'static bool rowlet_v137_send_mail(void)',
              network_test +
              '\nstatic bool rowlet_v137_send_mail(void)',
              'probe insertion'
          )

          # Insert directly into the existing
          # notification function.
          pattern = (
              r'(static\s+void\s+'
              r'rowlet_v137_notify_tick\s*'
              r'\(\s*u32\s+keys\s*\)\s*\{)'
          )

          m, count = re.subn(
              pattern,
              lambda x: (
                  x.group(1) +
                  '\n              rowlet_v146_test_tick(keys);'
              ),
              m,
              count=1
          )

          if count != 1:
              raise SystemExit(
                  'Could not find V13.9 notifier function'
              )

          # Use the existing MAIL display instead
          # of the fragile HTTP display anchor.

          display = '''extern "C" {
                      fn rowlet_v146_stage(i: u32) -> u32;
                      fn rowlet_v146_error(i: u32) -> u32;
                      fn rowlet_v146_http(i: u32) -> u32;
                  }

                  let (i1, e1, h1, i2, e2, h2) =
                      unsafe {
                          (
                              rowlet_v146_stage(0),
                              rowlet_v146_error(0),
                              rowlet_v146_http(0),
                              rowlet_v146_stage(1),
                              rowlet_v146_error(1),
                              rowlet_v146_http(1)
                          )
                      };

                  pnp::println!(
                      "IP:{} E:{:08X} H:{}",
                      i1, e1, h1
                  );

                  pnp::println!(
                      "DNS:{} E:{:08X} H:{}",
                      i2, e2, h2
                  );
                  '''

          f = once(
              f,
              'pnp::println!("{}", mail_text);',
              'pnp::println!("{}", mail_text);\n'
              '                  ' + display,
              'overlay insertion'
          )

          for marker in (
              'if (v13_phase == 4)',
              'rowlet_v137_notify_tick',
              'rowlet_v13_halt();'
          ):
              if marker not in m:
                  raise SystemExit(
                      'Safety marker missing: ' + marker
                  )

          if (
              'rowlet_v13_reset_sent' not in f
              or 'ROWLET: SHINY!' not in f
          ):
              raise SystemExit(
                  'Rust shiny/reset guard missing'
              )

          main.write_text(m)
          frame.write_text(f)

          print('V14.6 diagnostics installed')
          PY

          python3 /tmp/v146_patch.py

      - name: Verify V14.6 source
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq 'UsePrivateMemory: true' \
            3gx/PokeReader.plgInfo

          grep -Fq 'rowlet_v146_test_tick(keys);' \
            3gx/sources/main.c

          grep -Fq 'rowlet_v137_send_mail' \
            3gx/sources/main.c

          grep -Fq 'if (v13_phase == 4)' \
            3gx/sources/main.c

          grep -Fq 'rowlet_v13_reset_sent' \
            reader_core/src/gen7/frame.rs

          grep -Fq 'IP:{} E:{:08X} H:{}' \
            reader_core/src/gen7/frame.rs

          grep -Fq 'DNS:{} E:{:08X} H:{}' \
            reader_core/src/gen7/frame.rs

          echo 'V14.6 checks passed'

      - name: Compile plugin
        shell: bash
        run: |
          set -o pipefail

          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            zaksabeast/devkitarm-rust make \
            2>&1 | tee rowlet_v14_6_compile.log

      - name: Upload plugin
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rowlet-v14-6-network-tests
          path: out/default.3gx
          if-no-files-found: error

      - name: Upload compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rowlet-v14-6-compile-log
          path: rowlet_v14_6_compile.log
          if-no-files-found: warn
