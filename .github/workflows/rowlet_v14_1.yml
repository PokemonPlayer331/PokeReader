
name: Build Rowlet V13.4 Persistent SD Counter

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore original working V13.2
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          path = Path(".github/workflows/rowlet_build.yml")
          if not path.exists():
              raise SystemExit("Original V13.2 workflow missing")

          workflow = yaml.safe_load(path.read_text())
          steps = workflow["jobs"]["build"]["steps"]

          names = [
              "Apply V5 decoded Rowlet watcher",
              "Apply V6 working A-input bridge",
              "Replace V6 test with V12.1 A pulses and shiny-only status",
              "Install V13.1 reset loop",
              "V13.2 nickname keyboard START then A workaround",
              "Fix toolchain linker compatibility",
          ]

          for name in names:
              matches = [
                  step for step in steps
                  if step.get("name") == name
              ]
              if len(matches) != 1:
                  raise SystemExit("Missing V13.2 step: " + name)

              print("Applying:", name, flush=True)
              subprocess.run(
                  [
                      "bash", "-e", "-o", "pipefail",
                      "-c", matches[0]["run"]
                  ],
                  check=True
              )

          print("Original V13.2 restored")
          PY

      - name: Install SD counter with verified reset hook
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/rowlet_v134.py <<'PY'
          from pathlib import Path
          import re

          main = Path("3gx/sources/main.c")
          frame = Path("reader_core/src/gen7/frame.rs")

          m = main.read_text()
          f = frame.read_text()

          def once(s, old, new, label):
              count = s.count(old)
              if count != 1:
                  raise SystemExit(
                      "%s: expected 1 match, found %d"
                      % (label, count)
                  )
              return s.replace(old, new, 1)

          # V13.2 has one original increment.
          # Remove it BEFORE inserting the new one.
          m = once(
              m,
              "v13_resets++;",
              "/* counted before reset sequence */",
              "Original reset increment"
          )

          sd_helpers = r'''
          // Rowlet V13.4 persistent counter.
          // File: SD root /rowlet_resets.dat

          #define ROWLET_SD_MAGIC 0x524C5434u
          #define ROWLET_SD_SALT  0xCA57F00Du

          static const char rowlet_sd_filename[] =
              "/rowlet_resets.dat";

          static bool rowlet_sd_loaded = false;
          static bool rowlet_sd_ready = false;

          static volatile u32 rowlet_sd_status = 0;

          typedef struct {
              u32 magic;
              u32 count;
              u32 checksum;
          } RowletSave;

          u32 rowlet_get_reset_count(void)
          {
              return v13_resets;
          }

          u32 rowlet_get_sd_status(void)
          {
              return rowlet_sd_status;
          }

          static bool rowlet_sd_valid(
              const RowletSave *r
          )
          {
              return
                  r->magic == ROWLET_SD_MAGIC &&
                  r->checksum ==
                  (
                      r->count ^
                      ROWLET_SD_MAGIC ^
                      ROWLET_SD_SALT
                  );
          }

          static void rowlet_sd_load(void)
          {
              if (rowlet_sd_loaded)
                  return;

              rowlet_sd_loaded = true;

              Result rc = fsInit();

              if (R_FAILED(rc)) {
                  rowlet_sd_status = 3;
                  return;
              }

              rowlet_sd_ready = true;
              rowlet_sd_status = 1;

              FS_Path archive =
                  fsMakePath(PATH_EMPTY, "");

              FS_Path file_path =
                  fsMakePath(
                      PATH_ASCII,
                      rowlet_sd_filename
                  );

              Handle file = 0;

              rc = FSUSER_OpenFileDirectly(
                  &file,
                  ARCHIVE_SDMC,
                  archive,
                  file_path,
                  FS_OPEN_READ,
                  0
              );

              // First launch: no file yet.
              if (R_FAILED(rc))
                  return;

              RowletSave record;
              u32 highest = 0;

              for (u32 slot = 0; slot < 2; slot++) {
                  u32 bytes = 0;

                  rc = FSFILE_Read(
                      file,
                      &bytes,
                      slot * sizeof(record),
                      &record,
                      sizeof(record)
                  );

                  if (
                      R_SUCCEEDED(rc) &&
                      bytes == sizeof(record) &&
                      rowlet_sd_valid(&record) &&
                      record.count > highest
                  ) {
                      highest = record.count;
                  }
              }

              FSFILE_Close(file);

              v13_resets = highest;
          }

          static void rowlet_sd_save(void)
          {
              if (!rowlet_sd_ready) {
                  rowlet_sd_status = 3;
                  return;
              }

              FS_Path archive =
                  fsMakePath(PATH_EMPTY, "");

              FS_Path file_path =
                  fsMakePath(
                      PATH_ASCII,
                      rowlet_sd_filename
                  );

              Handle file = 0;

              Result rc = FSUSER_OpenFileDirectly(
                  &file,
                  ARCHIVE_SDMC,
                  archive,
                  file_path,
                  FS_OPEN_WRITE | FS_OPEN_CREATE,
                  0
              );

              if (R_FAILED(rc)) {
                  rowlet_sd_status = 3;
                  return;
              }

              RowletSave record;

              record.magic = ROWLET_SD_MAGIC;
              record.count = v13_resets;

              record.checksum =
                  record.count ^
                  ROWLET_SD_MAGIC ^
                  ROWLET_SD_SALT;

              u32 slot = record.count & 1u;
              u32 bytes = 0;

              rc = FSFILE_Write(
                  file,
                  &bytes,
                  slot * sizeof(record),
                  &record,
                  sizeof(record),
                  FS_WRITE_FLUSH
              );

              FSFILE_Close(file);

              if (
                  R_SUCCEEDED(rc) &&
                  bytes == sizeof(record)
              ) {
                  rowlet_sd_status = 2;
              } else {
                  rowlet_sd_status = 3;
              }
          }
          '''

          m = once(
              m,
              "static void rowlet_v13_tick(void)",
              sd_helpers +
              "\nstatic void rowlet_v13_tick(void)",
              "SD helper insertion"
          )

          # Load once when running Ultra Sun.
          m = once(
              m,
              "if (get_title_id() != ROWLET_V13_TITLE) return;",
              (
                  "if (get_title_id() != ROWLET_V13_TITLE) return;\n"
                  "              rowlet_sd_load();"
              ),
              "SD loading"
          )

          # Attach to the verified non-shiny branch.
          # Match only the branch inside the hunter.
          pattern = (
              r"if\s*\(\s*v13_phase\s*==\s*4\s*\)"
              r"\s*\{\s*"
              r"rowlet_try_release_a_frame\s*\(\s*\)\s*;"
          )

          def install_save(match):
              original = match.group(0)
              return re.sub(
                  r"rowlet_try_release_a_frame\s*\(\s*\)\s*;",
                  (
                      "v13_resets++;\n"
                      "                      rowlet_sd_save();\n"
                      "                      rowlet_try_release_a_frame();"
                  ),
                  original,
                  count=1
              )

          m, count = re.subn(
              pattern,
              install_save,
              m,
              count=1
          )

          if count != 1:
              raise SystemExit(
                  "Verified non-shiny reset branch not found"
              )

          # Add two display lines without changing
          # the existing shiny detection or reset guard.
          display = '''pnp::println!("{}", label);

                  extern "C" {
                      fn rowlet_get_reset_count() -> u32;
                      fn rowlet_get_sd_status() -> u32;
                  }

                  let resets = unsafe {
                      rowlet_get_reset_count()
                  };

                  let sd = unsafe {
                      rowlet_get_sd_status()
                  };

                  pnp::println!("RESETS: {}", resets);

                  let sd_message = match sd {
                      0 => "SD: STARTING",
                      1 => "SD: READY",
                      2 => "SD: SAVED",
                      _ => "SD: ERROR",
                  };

                  pnp::println!("{}", sd_message);'''

          f = once(
              f,
              'pnp::println!("{}", label);',
              display,
              "Counter display"
          )

          # Safety checks.
          required_main = [
              "rowlet_v13_tick",
              "rowlet_sd_load();",
              "rowlet_sd_save();",
              "rowlet_try_nickname_start_frame",
              "rowlet_v13_halt();",
              "if (v13_phase == 5 || v13_phase == 6)",
              "rowlet_try_soft_reset_frame(true)",
          ]

          for marker in required_main:
              if marker not in m:
                  raise SystemExit(
                      "Missing original hunter code: " +
                      marker
                  )

          if m.count("v13_resets++;") != 1:
              raise SystemExit(
                  "Expected exactly one counter increment"
              )

          for marker in (
              "rowlet_v13_reset_sent",
              "ROWLET: SHINY!",
              "RESETS: {}",
              "SD: SAVED"
          ):
              if marker not in f:
                  raise SystemExit(
                      "Missing overlay/guard: " + marker
                  )

          main.write_text(m)
          frame.write_text(f)

          print("V13.4 SD counter patch installed")
          PY

          python3 /tmp/rowlet_v134.py

      - name: Verify counter and shiny safety
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq 'rowlet_sd_save();' \
            3gx/sources/main.c

          grep -Fq 'rowlet_sd_load();' \
            3gx/sources/main.c

          grep -Fq 'rowlet_resets.dat' \
            3gx/sources/main.c

          grep -Fq 'FSFILE_Write' \
            3gx/sources/main.c

          grep -Fq 'rowlet_try_nickname_start_frame' \
            3gx/sources/main.c

          grep -Fq 'rowlet_v13_reset_sent' \
            reader_core/src/gen7/frame.rs

          grep -Fq 'ROWLET: SHINY!' \
            reader_core/src/gen7/frame.rs

          grep -Fq 'RESETS: {}' \
            reader_core/src/gen7/frame.rs

          grep -Fq 'SD: SAVED' \
            reader_core/src/gen7/frame.rs

          echo "V13.4 source checks passed"

      - name: Build PokeReader plugin
        shell: bash
        run: |
          set -o pipefail

          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            zaksabeast/devkitarm-rust make \
            2>&1 | tee rowlet_v134_compile.log

      - name: Upload plugin
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rowlet-v13-4-sd-counter
          path: out/default.3gx
          if-no-files-found: error

      - name: Upload compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rowlet-v13-4-compile-log
          path: rowlet_v134_compile.log
          if-no-files-found: warn
