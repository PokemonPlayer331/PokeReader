
name: Build Rowlet V14.3 Offline Gmail Recovery

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore proven V13.9 hunter and Gmail diagnostics
        shell: bash
        env:
          ROWLET_NOTIFY_URL: ${{ secrets.ROWLET_NOTIFY_URL }}
          ROWLET_NOTIFY_TOKEN: ${{ secrets.ROWLET_NOTIFY_TOKEN }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import subprocess
          import yaml

          filename = ".github/workflows/rowlet_v13_5_gmail_counter.yml"

          if not os.environ.get("ROWLET_NOTIFY_URL"):
              raise SystemExit("Missing ROWLET_NOTIFY_URL secret")

          if not os.environ.get("ROWLET_NOTIFY_TOKEN"):
              raise SystemExit("Missing ROWLET_NOTIFY_TOKEN secret")

          commits = subprocess.check_output(
              [
                  "git", "log", "--all",
                  "--format=%H", "--", filename
              ],
              text=True
          ).splitlines()

          previous = None

          for commit in commits:
              result = subprocess.run(
                  ["git", "show", f"{commit}:{filename}"],
                  capture_output=True,
                  text=True
              )

              if result.returncode != 0:
                  continue

              try:
                  candidate = yaml.safe_load(result.stdout)
              except yaml.YAMLError:
                  continue

              if not isinstance(candidate, dict):
                  continue

              if candidate.get("name") == (
                  "Build Rowlet V13.9 Private Memory Gmail Fix"
              ):
                  previous = candidate
                  print("Found V13.9:", commit[:12])
                  break

          if previous is None:
              raise SystemExit(
                  "V13.9 not found in Git history"
              )

          steps = previous["jobs"]["build"]["steps"]

          required = [
              "Rebuild V13.8.1 hunting and Gmail source",
              "Enable private memory in plugin header",
          ]

          for name in required:
              matches = [
                  step for step in steps
                  if step.get("name") == name
              ]

              if len(matches) != 1:
                  raise SystemExit(
                      "Missing source step: " + name
                  )

              print("Applying:", name, flush=True)

              subprocess.run(
                  [
                      "bash", "-e",
                      "-o", "pipefail",
                      "-c", matches[0]["run"]
                  ],
                  env=os.environ.copy(),
                  check=True
              )

          print("V13.9 source successfully restored")
          PY

      - name: Verify offline-safe hunting and Gmail
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq 'UsePrivateMemory: true' \
            3gx/PokeReader.plgInfo

          grep -Fq 'httpcInit(0x1000)' \
            3gx/sources/main.c

          grep -Fq 'application/x-www-form-urlencoded' \
            3gx/sources/main.c

          grep -Fq 'rowlet_v137_send_mail' \
            3gx/sources/main.c

          grep -Fq 'rowlet_v137_notify_tick' \
            3gx/sources/main.c

          grep -Fq 'if (v13_phase == 4)' \
            3gx/sources/main.c

          grep -Fq 'rowlet_v13_halt();' \
            3gx/sources/main.c

          grep -Fq 'rowlet_v13_reset_sent' \
            reader_core/src/gen7/frame.rs

          grep -Fq 'ROWLET: SHINY!' \
            reader_core/src/gen7/frame.rs

          grep -Fq 'NET:{} ERR:{:08X}' \
            reader_core/src/gen7/frame.rs

          grep -Fq 'HTTP:{} TRY:{}' \
            reader_core/src/gen7/frame.rs

          if grep -Fq 'osGetWifiStrength()' \
            3gx/sources/main.c; then
            echo "Unexpected Wi-Fi strength check"
            exit 1
          fi

          echo "V14.3 checks passed"

      - name: Build PokeReader plugin
        shell: bash
        run: |
          set -o pipefail

          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            zaksabeast/devkitarm-rust make \
            2>&1 | tee rowlet_v14_3_compile.log

      - name: Upload plugin
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rowlet-v14-3-offline-gmail
          path: out/default.3gx
          if-no-files-found: error

      - name: Upload compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rowlet-v14-3-compile-log
          path: rowlet_v14_3_compile.log
          if-no-files-found: warn
