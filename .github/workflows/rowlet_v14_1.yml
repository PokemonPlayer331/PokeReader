
name: Build Rowlet V14.7 Internet Connection Test

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore V13.9 working base
        shell: bash
        env:
          ROWLET_NOTIFY_URL: ${{ secrets.ROWLET_NOTIFY_URL }}
          ROWLET_NOTIFY_TOKEN: ${{ secrets.ROWLET_NOTIFY_TOKEN }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import subprocess
          import yaml

          filename = ".github/workflows/rowlet_v13_5_gmail_counter.yml"

          for key in ("ROWLET_NOTIFY_URL", "ROWLET_NOTIFY_TOKEN"):
              if not os.environ.get(key):
                  raise SystemExit("Missing GitHub secret: " + key)

          commits = subprocess.check_output(
              ["git", "log", "--all", "--format=%H", "--", filename],
              text=True
          ).splitlines()

          previous = None

          for commit in commits:
              result = subprocess.run(
                  ["git", "show", f"{commit}:{filename}"],
                  capture_output=True,
                  text=True
              )

              if result.returncode:
                  continue

              try:
                  candidate = yaml.safe_load(result.stdout)
              except yaml.YAMLError:
                  continue

              if (
                  isinstance(candidate, dict)
                  and candidate.get("name") ==
                  "Build Rowlet V13.9 Private Memory Gmail Fix"
              ):
                  previous = candidate
                  print("Found V13.9:", commit[:12])
                  break

          if previous is None:
              raise SystemExit("V13.9 not found in Git history")

          steps = previous["jobs"]["build"]["steps"]

          for name in (
              "Rebuild V13.8.1 hunting and Gmail source",
              "Enable private memory in plugin header"
          ):
              matches = [
                  step for step in steps
                  if step.get("name") == name
              ]

              if len(matches) != 1:
                  raise SystemExit("Missing base step: " + name)

              print("Applying:", name, flush=True)

              subprocess.run(
                  ["bash", "-e", "-o", "pipefail", "-c", matches[0]["run"]],
                  env=os.environ.copy(),
                  check=True
              )

          print("V13.9 base restored")
          PY

      - name: Add standalone internet connection tests
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/rowlet147.py <<'PY'
          from pathlib import Path
          import re

          path = Path("3gx/sources/main.c")
          source = path.read_text()

          # Reuse the existing NET, ERR, and HTTP
          # diagnostic display from V13.9.
          # No changes to Rust overlay are needed.

          probe = r'''
          // V14.7 internet test.
          // Runs only after the hunter has stopped.
          // Does not modify shiny detection.

          static u32 v147_last_test_keys = 0u;

          static void rowlet_v147_probe(
              u32 test_number,
              const char *url
          )
          {
              // 81 = direct IP test started
              // 82 = hostname test started
              // 91 = direct IP received HTTP
              // 92 = hostname received HTTP

              v137_net_stage = 80u + test_number;
              v137_net_error = 0u;
              v137_http_status = 0u;

              Result rc = httpcInit(0x1000);

              if (R_FAILED(rc)) {
                  v137_net_error = (u32)rc;
                  return;
              }

              httpcContext ctx;

              rc = httpcOpenContext(
                  &ctx,
                  HTTPC_METHOD_GET,
                  url,
                  1
              );

              if (R_FAILED(rc)) {
                  v137_net_error = (u32)rc;
                  httpcExit();
                  return;
              }

              rc = httpcBeginRequest(&ctx);

              if (R_SUCCEEDED(rc)) {
                  u32 status = 0u;

                  rc = httpcGetResponseStatusCode(
                      &ctx,
                      &status
                  );

                  if (R_SUCCEEDED(rc)) {
                      v137_net_stage = 90u + test_number;
                      v137_http_status = status;
                  }
              }

              if (R_FAILED(rc)) {
                  v137_net_error = (u32)rc;
              }

              httpcCloseContext(&ctx);
              httpcExit();
          }

          static void rowlet_v147_test_tick(u32 keys)
          {
              const u32 ip_combo = KEY_SELECT | KEY_L;
              const u32 dns_combo = KEY_SELECT | KEY_R;

              u32 current = keys & (KEY_SELECT | KEY_L | KEY_R);
              u32 previous = v147_last_test_keys;

              // Run once per new physical button press.
              // Do not trigger repeatedly while held down.

              if (
                  current == ip_combo &&
                  previous != ip_combo
              ) {
                  rowlet_v147_probe(
                      1u,
                      "http://1.1.1.1/"
                  );
              }

              if (
                  current == dns_combo &&
                  previous != dns_combo
              ) {
                  rowlet_v147_probe(
                      2u,
                      "http://example.com/"
                  );
              }

              v147_last_test_keys = current;
          }

          '''

          # Insert the probe before the existing
          # notification function, then attach the
          # test at the function's opening brace.
          #
          # This avoids fragile line-by-line matching
          # in the existing PokeReader overlay.

          pattern = (
              r"static\s+void\s+"
              r"rowlet_v137_notify_tick"
              r"\s*\(\s*u32\s+keys\s*\)\s*\{"
          )

          matches = list(re.finditer(pattern, source))

          if len(matches) != 1:
              raise SystemExit(
                  "Expected exactly one existing "
                  "notification function, found " +
                  str(len(matches))
              )

          match = matches[0]

          old_header = match.group(0)

          new_header = (
              probe
              + "\n"
              + old_header
              + "\n"
              + "              rowlet_v147_test_tick(keys);\n"
          )

          source = (
              source[:match.start()]
              + new_header
              + source[match.end():]
          )

          # Preserve the existing hunting controls.
          for required in (
              "if (v13_phase == 4)",
              "rowlet_v13_halt();",
              "rowlet_v137_send_mail",
              "rowlet_v137_notify_tick",
              "rowlet_v147_test_tick(keys);",
              "rowlet_try_nickname_start_frame"
          ):
              if required not in source:
                  raise SystemExit(
                      "Required source missing: " + required
                  )

          path.write_text(source)

          print("V14.7 internet tests installed")
          PY

          python3 /tmp/rowlet147.py

      - name: Verify V14.7
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq 'UsePrivateMemory: true' \
            3gx/PokeReader.plgInfo

          grep -Fq 'rowlet_v147_probe' \
            3gx/sources/main.c

          grep -Fq 'rowlet_v147_test_tick(keys);' \
            3gx/sources/main.c

          grep -Fq 'http://1.1.1.1/' \
            3gx/sources/main.c

          grep -Fq 'http://example.com/' \
            3gx/sources/main.c

          grep -Fq 'if (v13_phase == 4)' \
            3gx/sources/main.c

          grep -Fq 'rowlet_v13_reset_sent' \
            reader_core/src/gen7/frame.rs

          grep -Fq 'ROWLET: SHINY!' \
            reader_core/src/gen7/frame.rs

          grep -Fq 'NET:{} ERR:{:08X}' \
            reader_core/src/gen7/frame.rs

          echo "V14.7 source checks passed"

      - name: Build PokeReader plugin
        shell: bash
        run: |
          set -o pipefail

          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            zaksabeast/devkitarm-rust make \
            2>&1 | tee rowlet_v14_7_compile.log

      - name: Upload plugin
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rowlet-v14-7-connection-test
          path: out/default.3gx
          if-no-files-found: error

      - name: Upload compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rowlet-v14-7-compile-log
          path: rowlet_v14_7_compile.log
          if-no-files-found: warn
