
name: Build Rowlet V14.2 Offline Gmail Fix

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository and history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore V14 source from Git history
        shell: bash
        env:
          ROWLET_NOTIFY_URL: ${{ secrets.ROWLET_NOTIFY_URL }}
          ROWLET_NOTIFY_TOKEN: ${{ secrets.ROWLET_NOTIFY_TOKEN }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import subprocess
          import yaml

          filename = ".github/workflows/rowlet_v13_5_gmail_counter.yml"

          if not os.environ.get("ROWLET_NOTIFY_URL"):
              raise SystemExit("Missing ROWLET_NOTIFY_URL secret")

          if not os.environ.get("ROWLET_NOTIFY_TOKEN"):
              raise SystemExit("Missing ROWLET_NOTIFY_TOKEN secret")

          commits = subprocess.check_output(
              [
                  "git", "log", "--all",
                  "--format=%H", "--", filename
              ],
              text=True
          ).splitlines()

          previous = None

          for commit in commits:
              result = subprocess.run(
                  ["git", "show", f"{commit}:{filename}"],
                  capture_output=True,
                  text=True
              )

              if result.returncode != 0:
                  continue

              try:
                  candidate = yaml.safe_load(result.stdout)
              except yaml.YAMLError:
                  continue

              if not isinstance(candidate, dict):
                  continue

              if candidate.get("name") == (
                  "Build Rowlet V14 Offline Gmail and Network Test"
              ):
                  previous = candidate
                  print("Found V14:", commit[:12])
                  break

          if previous is None:
              raise SystemExit(
                  "Original V14 workflow not found in Git history"
              )

          steps = previous["jobs"]["build"]["steps"]

          required = [
              "Restore V13.9 hunter and network code",
              "Add offline-safe notification and internet probe",
          ]

          for name in required:
              matches = [
                  step for step in steps
                  if step.get("name") == name
              ]

              if len(matches) != 1:
                  raise SystemExit(
                      "Missing original V14 build step: " + name
                  )

              print("Applying:", name, flush=True)

              subprocess.run(
                  [
                      "bash", "-e",
                      "-o", "pipefail",
                      "-c", matches[0]["run"]
                  ],
                  env=os.environ.copy(),
                  check=True
              )

          print("Original V14 hunting source restored")
          PY

      - name: Remove faulty WiFi detection
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("3gx/sources/main.c")
          source = path.read_text()

          # Locate the exact networking gate added in V14.
          beginning = "              // No Wi-Fi signal? Keep the mail pending."
          ending = "              v137_mail = 2u;"

          if source.count(beginning) != 1:
              raise SystemExit(
                  "V14 WiFi gate not found exactly once"
              )

          start = source.index(beginning)
          end = source.index(ending, start)

          # Keep normal retry timing, but never use
          # signal strength to cancel an HTTP attempt.
          replacement = (
              "              // V14.2: attempt delivery when due.\n"
              "              // No WiFi gate: failure is handled below.\n"
              "              // Hunting never depends on networking.\n\n"
          )

          source = source[:start] + replacement + source[end:]

          if "if (osGetWifiStrength() == 0)" in source:
              raise SystemExit(
                  "Faulty WiFi detection was not removed"
              )

          required = [
              "rowlet_v137_notify_tick",
              "rowlet_v137_send_mail",
              "v137_mail = ok ? 3u : 4u;",
              "httpcInit(0x1000)",
              "if (v13_phase == 4)",
              "rowlet_v13_halt();",
          ]

          for item in required:
              if item not in source:
                  raise SystemExit(
                      "Required code missing: " + item
                  )

          path.write_text(source)

          print("V14.2 WiFi retry fix installed")
          PY

      - name: Verify V14.2 safety and Gmail code
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq 'UsePrivateMemory: true' \
            3gx/PokeReader.plgInfo

          grep -Fq 'httpcInit(0x1000)' \
            3gx/sources/main.c

          grep -Fq 'rowlet_v137_send_mail' \
            3gx/sources/main.c

          grep -Fq 'rowlet_v137_notify_tick' \
            3gx/sources/main.c

          grep -Fq 'if (v13_phase == 4)' \
            3gx/sources/main.c

          grep -Fq 'rowlet_v13_reset_sent' \
            reader_core/src/gen7/frame.rs

          grep -Fq 'ROWLET: SHINY!' \
            reader_core/src/gen7/frame.rs

          grep -Fq 'NET:{} ERR:{:08X}' \
            reader_core/src/gen7/frame.rs

          grep -Fq 'HTTP:{} TRY:{}' \
            reader_core/src/gen7/frame.rs

          if grep -Fq 'if (osGetWifiStrength() == 0)' \
            3gx/sources/main.c; then
            echo "Faulty WiFi gate still exists"
            exit 1
          fi

          echo "V14.2 source checks passed"

      - name: Build PokeReader plugin
        shell: bash
        run: |
          set -o pipefail

          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            zaksabeast/devkitarm-rust make \
            2>&1 | tee rowlet_v14_2_compile.log

      - name: Upload plugin
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rowlet-v14-2-offline-gmail-fix
          path: out/default.3gx
          if-no-files-found: error

      - name: Upload compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rowlet-v14-2-compile-log
          path: rowlet_v14_2_compile.log
          if-no-files-found: warn
