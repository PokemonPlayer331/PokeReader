
name: Build Rowlet V13.3 Persistent Reset Counter

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore original V13.2
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          import yaml
          from pathlib import Path

          path = Path(".github/workflows/rowlet_build.yml")
          doc = yaml.safe_load(path.read_text())
          steps = doc["jobs"]["build"]["steps"]

          names = [
              "Apply V5 decoded Rowlet watcher",
              "Apply V6 working A-input bridge",
              "Replace V6 test with V12.1 A pulses and shiny-only status",
              "Install V13.1 reset loop",
              "V13.2 nickname keyboard START then A workaround",
              "Fix toolchain linker compatibility",
          ]

          for name in names:
              matches = [
                  s for s in steps
                  if s.get("name") == name
              ]
              if len(matches) != 1:
                  raise SystemExit("Missing V13.2 step: " + name)

              print("Applying:", name, flush=True)
              subprocess.run(
                  ["bash", "-e", "-o", "pipefail",
                   "-c", matches[0]["run"]],
                  check=True
              )

          print("Original V13.2 restored")
          PY

      - name: Add SD card counter
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/rowlet_v133.py <<'PY'
          from pathlib import Path

          main = Path("3gx/sources/main.c")
          frame = Path("reader_core/src/gen7/frame.rs")

          m = main.read_text()
          f = frame.read_text()

          def replace_once(text, old, new, description):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      description + ": expected one match, found " +
                      str(count)
                  )
              return text.replace(old, new, 1)

          sd_code = r'''
          // V13.3 persistent reset counter.
          // Two alternating records in SD root.

          #define ROWLET_SD_MAGIC 0x524C5433u
          #define ROWLET_SD_CHECK 0xAC57F00Du

          static const char rowlet_sd_path[] =
              "/rowlet_resets.dat";

          static bool rowlet_sd_initialized = false;
          static bool rowlet_sd_available = false;

          // 0 starting, 1 ready, 2 saved, 3 error
          static volatile u32 rowlet_sd_state = 0;

          typedef struct {
              u32 magic;
              u32 count;
              u32 checksum;
          } RowletSDRecord;

          u32 rowlet_get_reset_count(void)
          {
              return v13_resets;
          }

          u32 rowlet_get_sd_state(void)
          {
              return rowlet_sd_state;
          }

          static FS_Path rowlet_sd_archive_path(void)
          {
              return fsMakePath(PATH_EMPTY, "");
          }

          static FS_Path rowlet_sd_file_path(void)
          {
              return fsMakePath(PATH_ASCII, rowlet_sd_path);
          }

          static bool rowlet_sd_valid(
              const RowletSDRecord *r
          )
          {
              return
                  r->magic == ROWLET_SD_MAGIC &&
                  r->checksum ==
                  (r->count ^ ROWLET_SD_MAGIC ^
                   ROWLET_SD_CHECK);
          }

          static void rowlet_sd_load(void)
          {
              if (rowlet_sd_initialized)
                  return;

              rowlet_sd_initialized = true;

              Result rc = fsInit();

              if (R_FAILED(rc)) {
                  rowlet_sd_state = 3;
                  return;
              }

              rowlet_sd_available = true;
              rowlet_sd_state = 1;

              Handle file = 0;

              rc = FSUSER_OpenFileDirectly(
                  &file,
                  ARCHIVE_SDMC,
                  rowlet_sd_archive_path(),
                  rowlet_sd_file_path(),
                  FS_OPEN_READ,
                  0
              );

              // Missing file is normal the first time.
              if (R_FAILED(rc))
                  return;

              RowletSDRecord record;
              u32 best = 0;

              for (u32 slot = 0; slot < 2; slot++) {
                  u32 bytes = 0;

                  rc = FSFILE_Read(
                      file,
                      &bytes,
                      slot * sizeof(record),
                      &record,
                      sizeof(record)
                  );

                  if (
                      R_SUCCEEDED(rc) &&
                      bytes == sizeof(record) &&
                      rowlet_sd_valid(&record) &&
                      record.count > best
                  ) {
                      best = record.count;
                  }
              }

              FSFILE_Close(file);

              v13_resets = best;
          }

          static void rowlet_sd_save(void)
          {
              if (!rowlet_sd_available) {
                  rowlet_sd_state = 3;
                  return;
              }

              Handle file = 0;

              Result rc = FSUSER_OpenFileDirectly(
                  &file,
                  ARCHIVE_SDMC,
                  rowlet_sd_archive_path(),
                  rowlet_sd_file_path(),
                  FS_OPEN_READ |
                  FS_OPEN_WRITE |
                  FS_OPEN_CREATE,
                  0
              );

              if (R_FAILED(rc)) {
                  rowlet_sd_state = 3;
                  return;
              }

              RowletSDRecord record;

              record.magic = ROWLET_SD_MAGIC;
              record.count = v13_resets;
              record.checksum =
                  record.count ^
                  ROWLET_SD_MAGIC ^
                  ROWLET_SD_CHECK;

              // Alternate slots, retaining the last
              // valid record if a write is interrupted.
              u32 slot = record.count & 1u;
              u32 bytes = 0;

              rc = FSFILE_Write(
                  file,
                  &bytes,
                  slot * sizeof(record),
                  &record,
                  sizeof(record),
                  FS_WRITE_FLUSH
              );

              FSFILE_Close(file);

              if (
                  R_SUCCEEDED(rc) &&
                  bytes == sizeof(record)
              ) {
                  rowlet_sd_state = 2;
              } else {
                  rowlet_sd_state = 3;
              }
          }

          '''

          # Verified V13.2 source anchors.
          m = replace_once(
              m,
              "static void rowlet_v13_tick(void)",
              sd_code +
              "\nstatic void rowlet_v13_tick(void)",
              "SD helpers"
          )

          m = replace_once(
              m,
              "if (get_title_id() != ROWLET_V13_TITLE) return;",
              """if (get_title_id() != ROWLET_V13_TITLE) return;
              rowlet_sd_load();""",
              "SD initialization"
          )

          # Save ONCE when the verified non-shiny
          # phase authorizes the soft reset.
          # The original V13.2 phase and injection
          # logic remain otherwise unchanged.
          m = replace_once(
              m,
              "if (v13_phase == 4) {\n"
              "                rowlet_try_release_a_frame();",
              "if (v13_phase == 4) {\n"
              "                v13_resets++;\n"
              "                rowlet_sd_save();\n"
              "                rowlet_try_release_a_frame();",
              "Pre-reset save"
          )

          # Remove ONLY the old increment that
          # occurs after the reset chord.
          m = replace_once(
              m,
              "v13_resets++;",
              "/* old counter increment relocated */",
              "Original increment"
          ) if False else m

          # There are now two increments: the inserted
          # increment and V13.2's original increment.
          # Remove the ORIGINAL by matching its
          # surrounding mode transition.
          m = replace_once(
              m,
              "v13_mode = 4; v13_frame = 0; "
              "v13_missing_hid = 0;\n"
              "                v13_resets++;",
              "v13_mode = 4; v13_frame = 0; "
              "v13_missing_hid = 0;\n"
              "                /* saved before reset */",
              "Old post-reset increment"
          )

          # Add counter to V13.2's existing overlay.
          display = '''pnp::println!("{}", label);

                  extern "C" {
                      fn rowlet_get_reset_count() -> u32;
                      fn rowlet_get_sd_state() -> u32;
                  }

                  let count = unsafe {
                      rowlet_get_reset_count()
                  };

                  let sd = unsafe {
                      rowlet_get_sd_state()
                  };

                  pnp::println!("RESETS: {}", count);

                  let status = match sd {
                      0 => "SD: STARTING",
                      1 => "SD: READY",
                      2 => "SD: SAVED",
                      _ => "SD: ERROR",
                  };

                  pnp::println!("{}", status);'''

          f = replace_once(
              f,
              'pnp::println!("{}", label);',
              display,
              "Counter display"
          )

          for required in (
              "rowlet_v13_tick",
              "rowlet_try_nickname_start_frame",
              "rowlet_v13_halt();",
              "if (v13_phase == 4)",
              "if (v13_phase == 5 || v13_phase == 6)",
              "rowlet_sd_save();",
              "rowlet_sd_load();",
          ):
              if required not in m:
                  raise SystemExit(
                      "Original hunting feature missing: " +
                      required
                  )

          if "rowlet_v13_reset_sent" not in f:
              raise SystemExit("Reset guard missing")

          if "ROWLET: SHINY!" not in f:
              raise SystemExit("Shiny status missing")

          main.write_text(m)
          frame.write_text(f)

          print("V13.3 persistent counter installed")
          PY

          python3 /tmp/rowlet_v133.py

      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq 'rowlet_sd_save();' \
            3gx/sources/main.c

          grep -Fq 'rowlet_sd_load();' \
            3gx/sources/main.c

          grep -Fq 'rowlet_resets.dat' \
            3gx/sources/main.c

          grep -Fq 'FSFILE_Write' \
            3gx/sources/main.c

          grep -Fq 'rowlet_try_nickname_start_frame' \
            3gx/sources/main.c

          grep -Fq 'rowlet_v13_reset_sent' \
            reader_core/src/gen7/frame.rs

          grep -Fq 'ROWLET: SHINY!' \
            reader_core/src/gen7/frame.rs

          grep -Fq 'RESETS: {}' \
            reader_core/src/gen7/frame.rs

          grep -Fq 'SD: SAVED' \
            reader_core/src/gen7/frame.rs

          echo "V13.3 verification passed"

      - name: Build PokeReader plugin
        shell: bash
        run: |
          set -o pipefail

          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            zaksabeast/devkitarm-rust make \
            2>&1 | tee rowlet_v133_compile.log

      - name: Upload plugin
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rowlet-v13-3-sd-counter
          path: out/default.3gx
          if-no-files-found: error

      - name: Upload compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rowlet-v13-3-compile-log
          path: rowlet_v133_compile.log
          if-no-files-found: warn
