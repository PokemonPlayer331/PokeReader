
name: Build Rowlet V14.5 Network Test Fix

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore V13.9 hunting and Gmail source
        shell: bash
        env:
          ROWLET_NOTIFY_URL: ${{ secrets.ROWLET_NOTIFY_URL }}
          ROWLET_NOTIFY_TOKEN: ${{ secrets.ROWLET_NOTIFY_TOKEN }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import subprocess
          import yaml

          filename = ".github/workflows/rowlet_v13_5_gmail_counter.yml"

          for key in ("ROWLET_NOTIFY_URL", "ROWLET_NOTIFY_TOKEN"):
              if not os.environ.get(key):
                  raise SystemExit("Missing GitHub secret: " + key)

          commits = subprocess.check_output(
              ["git", "log", "--all", "--format=%H", "--", filename],
              text=True
          ).splitlines()

          previous = None

          for commit in commits:
              result = subprocess.run(
                  ["git", "show", f"{commit}:{filename}"],
                  capture_output=True,
                  text=True
              )

              if result.returncode:
                  continue

              try:
                  candidate = yaml.safe_load(result.stdout)
              except yaml.YAMLError:
                  continue

              if (
                  isinstance(candidate, dict)
                  and candidate.get("name")
                  == "Build Rowlet V13.9 Private Memory Gmail Fix"
              ):
                  previous = candidate
                  print("Found V13.9:", commit[:12], flush=True)
                  break

          if previous is None:
              raise SystemExit("Could not recover V13.9 from Git history")

          steps = previous["jobs"]["build"]["steps"]

          required = [
              "Rebuild V13.8.1 hunting and Gmail source",
              "Enable private memory in plugin header",
          ]

          for name in required:
              matches = [
                  step for step in steps
                  if step.get("name") == name
              ]

              if len(matches) != 1:
                  raise SystemExit("Missing original step: " + name)

              print("Applying:", name, flush=True)

              subprocess.run(
                  [
                      "bash", "-e", "-o", "pipefail",
                      "-c", matches[0]["run"]
                  ],
                  env=os.environ.copy(),
                  check=True
              )

          print("V13.9 source restored")
          PY

      - name: Install V14.5 connection tests
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/rowlet145.py <<'PY'
          from pathlib import Path
          import re

          main = Path("3gx/sources/main.c")
          frame = Path("reader_core/src/gen7/frame.rs")

          m = main.read_text()
          f = frame.read_text()

          def replace_one(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{label}: expected 1 anchor, found {count}"
                  )
              return text.replace(old, new, 1)

          # Separate network diagnostic:
          #
          # SELECT + L tests a numerical IP.
          # SELECT + R tests a DNS hostname.
          # SELECT + Y retains the Gmail test.
          #
          # All tests run after B stops the hunter.

          probe = r'''
          // ROWLET V14.5: network isolation diagnostics.

          static volatile u32 v145_stage[2] = {0u, 0u};
          static volatile u32 v145_error[2] = {0u, 0u};
          static volatile u32 v145_http[2] = {0u, 0u};

          static u32 v145_ip_held = 0u;
          static u32 v145_dns_held = 0u;

          u32 rowlet_v145_stage(u32 index)
          {
              return index < 2u ? v145_stage[index] : 0u;
          }

          u32 rowlet_v145_error(u32 index)
          {
              return index < 2u ? v145_error[index] : 0u;
          }

          u32 rowlet_v145_http(u32 index)
          {
              return index < 2u ? v145_http[index] : 0u;
          }

          static void rowlet_v145_probe(
              u32 index,
              const char *url
          )
          {
              if (index >= 2u)
                  return;

              v145_stage[index] = 1u;
              v145_error[index] = 0u;
              v145_http[index] = 0u;

              Result rc = httpcInit(0x1000);

              if (R_FAILED(rc)) {
                  v145_error[index] = (u32)rc;
                  return;
              }

              httpcContext ctx;

              v145_stage[index] = 2u;

              rc = httpcOpenContext(
                  &ctx,
                  HTTPC_METHOD_GET,
                  url,
                  1
              );

              if (R_FAILED(rc)) {
                  v145_error[index] = (u32)rc;
                  httpcExit();
                  return;
              }

              v145_stage[index] = 3u;

              rc = httpcBeginRequest(&ctx);

              if (R_FAILED(rc)) {
                  v145_error[index] = (u32)rc;
                  httpcCloseContext(&ctx);
                  httpcExit();
                  return;
              }

              v145_stage[index] = 4u;

              u32 status = 0u;

              rc = httpcGetResponseStatusCode(
                  &ctx,
                  &status
              );

              if (R_FAILED(rc)) {
                  v145_error[index] = (u32)rc;
              } else {
                  v145_stage[index] = 5u;
                  v145_http[index] = status;
              }

              httpcCloseContext(&ctx);
              httpcExit();
          }

          static void rowlet_v145_probe_tick(u32 keys)
          {
              // Only called by the stopped notification
              // function. Never during ordinary hunting.

              bool ip_down =
                  (keys & (KEY_SELECT | KEY_L)) ==
                  (KEY_SELECT | KEY_L);

              bool dns_down =
                  (keys & (KEY_SELECT | KEY_R)) ==
                  (KEY_SELECT | KEY_R);

              if (ip_down && !v145_ip_held) {
                  rowlet_v145_probe(
                      0u,
                      "http://1.1.1.1/"
                  );
              }

              if (dns_down && !v145_dns_held) {
                  rowlet_v145_probe(
                      1u,
                      "http://example.com/"
                  );
              }

              v145_ip_held = ip_down ? 1u : 0u;
              v145_dns_held = dns_down ? 1u : 0u;
          }

          '''

          m = replace_one(
              m,
              "static bool rowlet_v137_send_mail(void)",
              probe + "\nstatic bool rowlet_v137_send_mail(void)",
              "Probe functions"
          )

          # Insert the diagnostic directly inside the
          # existing notification function.
          # This avoids matching the fragile stopped-mode
          # code that caused V14.4 to fail.

          pattern = (
              r"(static\s+void\s+"
              r"rowlet_v137_notify_tick\s*"
              r"\(\s*u32\s+keys\s*\)\s*\{)"
          )

          m, found = re.subn(
              pattern,
              lambda match: (
                  match.group(1)
                  + "\n              rowlet_v145_probe_tick(keys);\n"
              ),
              m,
              count=1
          )

          if found != 1:
              raise SystemExit(
                  "Could not locate V13.7 notification function"
              )

          # Add compact results to the existing overlay.

          anchor = 'pnp::println!("HTTP:{} TRY:{}",'

          extra = '''extern "C" {
                      fn rowlet_v145_stage(i: u32) -> u32;
                      fn rowlet_v145_error(i: u32) -> u32;
                      fn rowlet_v145_http(i: u32) -> u32;
                  }

                  let (ip_stage, ip_error, ip_http,
                       dns_stage, dns_error, dns_http) = unsafe {
                      (
                          rowlet_v145_stage(0),
                          rowlet_v145_error(0),
                          rowlet_v145_http(0),
                          rowlet_v145_stage(1),
                          rowlet_v145_error(1),
                          rowlet_v145_http(1)
                      )
                  };

                  pnp::println!(
                      "IP:{} E:{:08X} H:{}",
                      ip_stage, ip_error, ip_http
                  );

                  pnp::println!(
                      "DNS:{} E:{:08X} H:{}",
                      dns_stage, dns_error, dns_http
                  );

                  '''

          f = replace_one(
              f,
              anchor,
              extra + anchor,
              "Network diagnostics display"
          )

          # Verify the safety-critical Rowlet code
          # remains in place.

          required_main = [
              "if (v13_phase == 4)",
              "rowlet_v13_halt();",
              "rowlet_v137_notify_tick",
              "rowlet_v137_send_mail",
              "rowlet_v145_probe_tick(keys);",
          ]

          for item in required_main:
              if item not in m:
                  raise SystemExit(
                      "Missing Rowlet source: " + item
                  )

          if "rowlet_v13_reset_sent" not in f:
              raise SystemExit("Reset re-arm guard missing")

          if "ROWLET: SHINY!" not in f:
              raise SystemExit("Shiny display missing")

          main.write_text(m)
          frame.write_text(f)

          print("V14.5 diagnostics installed")
          PY

          python3 /tmp/rowlet145.py

      - name: Verify V14.5
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq 'UsePrivateMemory: true' \
            3gx/PokeReader.plgInfo

          grep -Fq 'rowlet_v145_probe_tick(keys);' \
            3gx/sources/main.c

          grep -Fq 'rowlet_v137_send_mail' \
            3gx/sources/main.c

          grep -Fq 'if (v13_phase == 4)' \
            3gx/sources/main.c

          grep -Fq 'rowlet_v13_reset_sent' \
            reader_core/src/gen7/frame.rs

          grep -Fq 'ROWLET: SHINY!' \
            reader_core/src/gen7/frame.rs

          grep -Fq 'IP:{} E:{:08X} H:{}' \
            reader_core/src/gen7/frame.rs

          grep -Fq 'DNS:{} E:{:08X} H:{}' \
            reader_core/src/gen7/frame.rs

          echo "V14.5 checks passed"

      - name: Build PokeReader plugin
        shell: bash
        run: |
          set -o pipefail

          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            zaksabeast/devkitarm-rust make \
            2>&1 | tee rowlet_v14_5_compile.log

      - name: Upload plugin
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rowlet-v14-5-network-test
          path: out/default.3gx
          if-no-files-found: error

      - name: Upload compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rowlet-v14-5-compile-log
          path: rowlet_v14_5_compile.log
          if-no-files-found: warn
