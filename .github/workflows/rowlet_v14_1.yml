
name: Build Rowlet V13.2 Persistent SD Counter

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore working V13.2
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          original = Path(
              ".github/workflows/rowlet_build.yml"
          )

          if not original.exists():
              raise SystemExit(
                  "Original V13.2 workflow missing"
              )

          doc = yaml.safe_load(original.read_text())
          steps = doc["jobs"]["build"]["steps"]

          required = [
              "Apply V5 decoded Rowlet watcher",
              "Apply V6 working A-input bridge",
              "Replace V6 test with V12.1 A pulses and shiny-only status",
              "Install V13.1 reset loop",
              "V13.2 nickname keyboard START then A workaround",
              "Fix toolchain linker compatibility",
          ]

          for name in required:
              matches = [
                  step for step in steps
                  if step.get("name") == name
              ]

              if len(matches) != 1:
                  raise SystemExit(
                      "Missing V13.2 step: " + name
                  )

              print("Applying:", name, flush=True)

              subprocess.run(
                  [
                      "bash", "-e", "-o", "pipefail",
                      "-c", matches[0]["run"]
                  ],
                  check=True
              )

          print("Original V13.2 restored")
          PY

      - name: Install persistent SD reset counter
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/rowlet_sd_counter.py <<'PY'
          from pathlib import Path

          main = Path("3gx/sources/main.c")
          frame = Path("reader_core/src/gen7/frame.rs")

          m = main.read_text()
          f = frame.read_text()

          def once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{label}: expected 1 match, "
                      f"found {count}"
                  )
              return text.replace(old, new, 1)

          counter_code = r'''
          // V13.2 persistent reset counter.
          // Stored on SD card, not in Pokemon save data.

          #define ROWLET_COUNT_MAGIC 0x524C5431u
          #define ROWLET_COUNT_SALT  0xAC57F00Du

          static const char rowlet_count_path[] =
              "/rowlet_resets.dat";

          static u32 rowlet_count_loaded = 0;
          static u32 rowlet_fs_ready = 0;

          // 0 = not initialized
          // 1 = loaded/ready
          // 2 = saved
          // 3 = SD error
          static volatile u32 rowlet_sd_status = 0;

          typedef struct {
              u32 magic;
              u32 count;
              u32 check;
          } RowletCountRecord;

          u32 rowlet_get_reset_count(void)
          {
              return v13_resets;
          }

          u32 rowlet_get_sd_status(void)
          {
              return rowlet_sd_status;
          }

          static bool rowlet_record_valid(
              const RowletCountRecord *record
          )
          {
              return
                  record->magic == ROWLET_COUNT_MAGIC &&
                  record->check ==
                  (record->count ^
                   ROWLET_COUNT_MAGIC ^
                   ROWLET_COUNT_SALT);
          }

          static void rowlet_counter_load(void)
          {
              if (rowlet_count_loaded)
                  return;

              rowlet_count_loaded = 1;

              Result rc = fsInit();

              if (R_FAILED(rc)) {
                  rowlet_sd_status = 3;
                  return;
              }

              rowlet_fs_ready = 1;
              rowlet_sd_status = 1;

              FS_Path archive = {
                  PATH_EMPTY,
                  1,
                  ""
              };

              FS_Path file = {
                  PATH_ASCII,
                  sizeof(rowlet_count_path),
                  rowlet_count_path
              };

              Handle handle = 0;

              rc = FSUSER_OpenFileDirectly(
                  &handle,
                  ARCHIVE_SDMC,
                  archive,
                  file,
                  FS_OPEN_READ,
                  0
              );

              // No existing file is normal on first run.
              if (R_FAILED(rc))
                  return;

              RowletCountRecord record;

              u32 highest = 0;

              // Two alternating saved records.
              // If one write is interrupted, the
              // previous valid record may survive.
              for (u32 slot = 0; slot < 2; slot++) {
                  u32 bytes = 0;

                  rc = FSFILE_Read(
                      handle,
                      &bytes,
                      slot * sizeof(record),
                      &record,
                      sizeof(record)
                  );

                  if (
                      R_SUCCEEDED(rc) &&
                      bytes == sizeof(record) &&
                      rowlet_record_valid(&record)
                  ) {
                      if (record.count > highest)
                          highest = record.count;
                  }
              }

              v13_resets = highest;

              FSFILE_Close(handle);
          }

          static void rowlet_counter_save(void)
          {
              if (!rowlet_fs_ready) {
                  rowlet_sd_status = 3;
                  return;
              }

              FS_Path archive = {
                  PATH_EMPTY,
                  1,
                  ""
              };

              FS_Path file = {
                  PATH_ASCII,
                  sizeof(rowlet_count_path),
                  rowlet_count_path
              };

              Handle handle = 0;

              Result rc = FSUSER_OpenFileDirectly(
                  &handle,
                  ARCHIVE_SDMC,
                  archive,
                  file,
                  FS_OPEN_WRITE | FS_OPEN_CREATE,
                  0
              );

              if (R_FAILED(rc)) {
                  rowlet_sd_status = 3;
                  return;
              }

              RowletCountRecord record;

              record.magic = ROWLET_COUNT_MAGIC;
              record.count = v13_resets;
              record.check =
                  record.count ^
                  ROWLET_COUNT_MAGIC ^
                  ROWLET_COUNT_SALT;

              // Alternate slots on each reset.
              u32 slot = record.count & 1u;
              u32 bytes = 0;

              rc = FSFILE_Write(
                  handle,
                  &bytes,
                  slot * sizeof(record),
                  &record,
                  sizeof(record),
                  FS_WRITE_FLUSH
              );

              FSFILE_Close(handle);

              if (
                  R_SUCCEEDED(rc) &&
                  bytes == sizeof(record)
              ) {
                  rowlet_sd_status = 2;
              } else {
                  rowlet_sd_status = 3;
              }
          }

          '''

          # Make the existing counter accessible,
          # and add SD read/write functions.
          m = once(
              m,
              "static void rowlet_v13_tick(void)",
              counter_code +
              "static void rowlet_v13_tick(void)",
              "SD counter insertion"
          )

          # Load the counter once per plugin session.
          m = once(
              m,
              "if (get_title_id() != ROWLET_V13_TITLE) return;",
              """if (get_title_id() != ROWLET_V13_TITLE) return;

              rowlet_counter_load();""",
              "SD counter initialization"
          )

          # Remove the original counter increment,
          # which happened after the reset chord.
          m = once(
              m,
              """                      v13_resets++;""",
              """                      // Count was saved before reset.""",
              "Original counter increment"
          )

          # Now increment and save BEFORE sending
          # a verified non-shiny soft reset.
          # This gives the SD write time to finish.
          old = '''if (v13_phase == 4) {
                      rowlet_try_release_a_frame();'''

          new = '''if (v13_phase == 4) {
                      v13_resets++;
                      rowlet_counter_save();
                      rowlet_try_release_a_frame();'''

          m = once(
              m,
              old,
              new,
              "Safe reset count and save"
          )

          # On-screen display.
          display = '''pnp::println!("{}", label);

                  extern "C" {
                      fn rowlet_get_reset_count() -> u32;
                      fn rowlet_get_sd_status() -> u32;
                  }

                  let resets = unsafe {
                      rowlet_get_reset_count()
                  };

                  let sd = unsafe {
                      rowlet_get_sd_status()
                  };

                  pnp::println!("RESETS: {}", resets);

                  let sd_label = match sd {
                      0 => "SD: STARTING",
                      1 => "SD: READY",
                      2 => "SD: SAVED",
                      _ => "SD: ERROR",
                  };

                  pnp::println!("{}", sd_label);'''

          f = once(
              f,
              'pnp::println!("{}", label);',
              display,
              "Counter display"
          )

          # Check the original hunting logic.
          required_main = [
              "if (v13_phase == 4)",
              "if (v13_phase == 5 || v13_phase == 6)",
              "rowlet_v13_halt();",
              "rowlet_try_nickname_start_frame",
              "rowlet_counter_save();",
              "rowlet_counter_load();",
          ]

          for marker in required_main:
              if marker not in m:
                  raise SystemExit(
                      "Missing hunting code: " + marker
                  )

          if "rowlet_v13_reset_sent" not in f:
              raise SystemExit(
                  "Original reset guard missing"
              )

          if "ROWLET: SHINY!" not in f:
              raise SystemExit(
                  "Shiny display missing"
              )

          main.write_text(m)
          frame.write_text(f)

          print("Persistent SD counter installed")
          PY

          python3 /tmp/rowlet_sd_counter.py

      - name: Verify hunting and counter code
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq 'rowlet_v13_tick();' \
            3gx/sources/main.c

          grep -Fq 'rowlet_counter_save();' \
            3gx/sources/main.c

          grep -Fq 'rowlet_counter_load();' \
            3gx/sources/main.c

          grep -Fq 'FSFILE_Write' \
            3gx/sources/main.c

          grep -Fq 'rowlet_resets.dat' \
            3gx/sources/main.c

          grep -Fq 'rowlet_try_nickname_start_frame' \
            3gx/sources/main.c

          grep -Fq 'rowlet_v13_reset_sent' \
            reader_core/src/gen7/frame.rs

          grep -Fq 'ROWLET: SHINY!' \
            reader_core/src/gen7/frame.rs

          grep -Fq 'RESETS: {}' \
            reader_core/src/gen7/frame.rs

          grep -Fq 'SD: SAVED' \
            reader_core/src/gen7/frame.rs

          echo "SD counter checks passed"

      - name: Build PokeReader plugin
        shell: bash
        run: |
          set -o pipefail

          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            zaksabeast/devkitarm-rust make \
            2>&1 | tee rowlet_sd_counter_compile.log

      - name: Upload plugin
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rowlet-v13-2-persistent-sd-counter
          path: out/default.3gx
          if-no-files-found: error

      - name: Upload compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rowlet-sd-counter-compile-log
          path: rowlet_sd_counter_compile.log
          if-no-files-found: warn
