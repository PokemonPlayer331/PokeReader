
name: Rowlet V8.9 Rehid Movement Test NEW

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out clean PokeReader source
        uses: actions/checkout@v4

      - name: Apply proven V5 Rowlet detector
        run: python3 patch/apply_patch.py .

      - name: Apply V6 virtual A input
        run: python3 patch/apply_input_test.py .

      - name: Apply V7.1 virtual reset test base
        run: python3 patch/apply_reset_test.py .

      - name: Apply V8.3 controller base
        run: python3 patch/apply_v8_3.py .

      - name: Convert to V8.9 SAFE Rehid movement test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('3gx/sources/main.c')
          s = path.read_text()

          def replace(old, new):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'V8.9: expected 1 anchor, got {count}: {old[:85]!r}')
              s = s.replace(old, new, 1)

          # Inject virtual D-pad Up for Rehid to remap.
          replace('if (v8_frames < 28 && !rowlet_v8_inject(0, true)) {',
                  'if (v8_frames < 28 && !rowlet_v8_inject(KEY_DUP, false)) {')

          replace('if (v8_state == 6) expected_virtual = KEY_L | KEY_R | KEY_START;',
                  'if (v8_state == 6) expected_virtual = KEY_L | KEY_R | KEY_START;\n'
                  '    if (v8_state == 3) expected_virtual = KEY_DUP | KEY_CPAD_UP;')

          replace('const u32 arm = KEY_L | KEY_DUP;',
                  'const u32 arm = KEY_L | KEY_R | KEY_B;')
          replace('const u32 stop = KEY_L | KEY_DDOWN;',
                  'const u32 stop = KEY_L | KEY_R | KEY_Y;')

          # Disable persistence and automatic activation.
          def replace_span(begin, finish, new):
              global s
              if s.count(begin) != 1 or s.count(finish) != 1:
                  raise SystemExit('V8.9: expected unique controller block anchors')
              a = s.index(begin)
              b = s.index(finish, a) + len(finish)
              s = s[:a] + new + s[b:]

          replace_span('    if (!v8_initialized) {',
                       '\n    // Emergency stop',
                       '    if (!v8_initialized) {\n'
                       '        v8_initialized = true;\n'
                       '        v8_fs_ready = false;\n'
                       '    }\n\n    // Emergency stop')

          replace_span('            if (!v8_write_session(V8_MAX_RESETS)) {',
                       '            v8_remaining = V8_MAX_RESETS;',
                       '            v8_remaining = 0;')
          replace('        if (!v8_write_session(0)) v8_fs_error = 4;\n', '')

          # Completely disable the automated reset state.
          replace_span('    if (v8_state == 6) {',
                       '\n}\n\nstatic void rowlet_v8_overlay',
                       '    if (v8_state == 6) { v8_stop(8); return; }'
                       '\n}\n\nstatic void rowlet_v8_overlay')
          replace('#define V8_MAX_RESETS 2u', '#define V8_MAX_RESETS 0u')

          # Unique on-screen version and controls.
          replace('const char *status="OFF - L+UP";',
                  'const char *status="OFF - L+R+B";')
          replace('case 3: status="WALKING FORWARD";',
                  'case 3: status="WALK VIA REHID";')
          replace('"V8.3 %s | R:%lu P:%lu E:%u FS:%u"',
                  '"V8.9 %s | R:%lu P:%lu E:%u FS:%u"')

          path.write_text(s)
          print('V8.9: L+R+B start, L+R+Y stop.')
          print('Automatic resets and session resume DISABLED.')
          PY

      - name: Validate V8.9 version and safety markers
        run: |
          grep -Fq 'V8.9 %s' 3gx/sources/main.c
          grep -Fq 'OFF - L+R+B' 3gx/sources/main.c
          grep -Fq 'WALK VIA REHID' 3gx/sources/main.c
          grep -Fq 'rowlet_v8_inject(KEY_DUP, false)' 3gx/sources/main.c
          grep -Fq '#define V8_MAX_RESETS 0u' 3gx/sources/main.c

      - name: Compile new plugin
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            zaksabeast/devkitarm-rust make

      - name: Upload V8.9 plugin
        uses: actions/upload-artifact@v4
        with:
          name: rowlet-v8-9-NEW-rehid-test
          path: out/default.3gx
          if-no-files-found: error
