
name: Build Rowlet V11 CTR Stick One Step Dry Run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Rowlet Watch V5
        run: python3 patch/apply_patch.py .

      - name: Apply original V6 virtual A test
        run: python3 patch/apply_input_test.py .

      - name: V11 experimental game-side stick conversion test
        shell: bash
        run: |
          cat > /tmp/v11.py <<'PY'
          from pathlib import Path

          main = Path('3gx/sources/main.c')
          hid = Path('3gx/sources/hid.c')
          header = Path('3gx/includes/hid.h')
          m = main.read_text()
          h = hid.read_text()
          d = header.read_text()

          def once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise RuntimeError(
                      f'{label}: expected 1 anchor, found {count}'
                  )
              return source.replace(old, new, 1)

          # Reuse the earlier virtual A input bridge.
          h = once(
              h,
              '#include "common.h"',
              '#include "common.h"\n#include "csvc.h"',
              'csvc header'
          )

          h += r'''
          // Preserve V6-style virtual A input.
          bool rowlet_v11_inject(u32 bits)
          {
              if (!g_key_addr) return false;

              bits &= KEY_A;
              if (!bits) return false;

              volatile u32 *base =
                  g_key_addr - (0x28 / 4);

              u32 index = base[0x10 / 4];
              if (index >= 8) return false;

              volatile u32 *sample =
                  base + (0x28 / 4)
                  + index * (0x10 / 4);

              u32 sample_pa = svcConvertVAToPA(
                  (const void *)sample, false
              );

              u32 current_pa = svcConvertVAToPA(
                  (const void *)(base + 0x1c / 4),
                  false
              );

              if (!sample_pa || !current_pa)
                  return false;

              volatile u32 *s =
                  (volatile u32 *)(
                      sample_pa | 0x80000000u
                  );

              volatile u32 *cur =
                  (volatile u32 *)(
                      current_pa | 0x80000000u
                  );

              s[0] |= bits;
              s[1] |= bits;
              *cur |= bits;

              return true;
          }

          // Game-side stick conversion experiment.
          // Target: Ultra Sun v1.2 executable.
          //
          // Original:
          // 0x004B6DF8: ldrsh r1, [r1, #14]
          //
          // Temporary replacement:
          // mov r1, #156
          //
          // Changes a Y-coordinate input to full Up.
          // Does not modify the HID input ring.

          #define V11_STICK_Y_INST 0x004B6DF8u
          #define V11_STICK_ORIGINAL 0xE1D110FEu
          #define V11_STICK_UP 0xE3A0109Cu

          static bool v11_patch_active = false;
          static u32 v11_patch_error = 0;

          u32 rowlet_v11_error(void)
          {
              return v11_patch_error;
          }

          bool rowlet_v11_set_up(bool enable)
          {
              if (!enable && !v11_patch_active)
                  return true;

              volatile u32 *virtual_word =
                  (volatile u32 *)V11_STICK_Y_INST;

              // Never patch an unexpected instruction.
              if (enable &&
                  !v11_patch_active &&
                  *virtual_word != V11_STICK_ORIGINAL)
              {
                  v11_patch_error = 1;
                  return false;
              }

              u32 pa = svcConvertVAToPA(
                  (const void *)V11_STICK_Y_INST,
                  false
              );

              if (!pa) {
                  v11_patch_error = 2;
                  return false;
              }

              volatile u32 *physical_word =
                  (volatile u32 *)(
                      pa | 0x80000000u
                  );

              *physical_word = enable
                  ? V11_STICK_UP
                  : V11_STICK_ORIGINAL;

              svcInvalidateEntireInstructionCache();

              v11_patch_active = enable;
              return true;
          }
          '''

          d += '\nbool rowlet_v11_inject(u32 bits);\n'
          d += 'bool rowlet_v11_set_up(bool enable);\n'
          d += 'u32 rowlet_v11_error(void);\n'

          controller = r'''
          // V11 dry-run state machine.
          //
          // 0 = READY
          // 1 = RELEASE
          // 2 = PATCH UP
          // 3 = PRESS A
          // 4 = DONE
          // 5 = STOP/ERROR

          static unsigned v11_state = 0;
          static unsigned v11_frames = 0;
          static unsigned v11_idle = 0;
          static unsigned v11_step_frames = 0;
          static unsigned v11_a_calls = 0;
          static unsigned v11_error = 0;

          #define V11_TITLE 0x00040000001B5000ULL

          static void v11_set(unsigned state)
          {
              v11_state = state;
              v11_frames = 0;
          }

          static void v11_stop(unsigned reason)
          {
              if (!rowlet_v11_set_up(false))
                  v11_error = 3;
              else
                  v11_error = reason;

              v11_set(5);
          }

          static void rowlet_v11_tick(void)
          {
              if (get_title_id() != V11_TITLE)
                  return;

              const u32 keys = get_current_keys();

              // Start with L + R + Y.
              // Never use X.
              const u32 start =
                  KEY_L | KEY_R | KEY_Y;

              if (v11_state == 0) {
                  if ((keys & start) == start &&
                      !(keys & KEY_X))
                  {
                      v11_step_frames = 0;
                      v11_a_calls = 0;
                      v11_idle = 0;
                      v11_error = 0;
                      v11_set(1);
                  }

                  return;
              }

              // Physical B stops the test.
              if (keys & KEY_B) {
                  v11_stop(4);
                  return;
              }

              if (v11_state >= 4)
                  return;

              if (v11_state == 1) {
                  // Wait for activation buttons
                  // to be fully released.
                  v11_idle =
                      keys == 0
                      ? v11_idle + 1
                      : 0;

                  if (v11_idle >= 15)
                      v11_set(2);

                  if (++v11_frames > 600)
                      v11_stop(5);

                  return;
              }

              // Stop if unexpected keys are held.
              if ((keys & ~(KEY_A | KEY_DUP)) != 0) {
                  v11_stop(6);
                  return;
              }

              if (v11_state == 2) {
                  // Apply the game-side Up patch once.
                  if (v11_frames == 0) {
                      if (!rowlet_v11_set_up(true)) {
                          v11_stop(1);
                          return;
                      }
                  }

                  // Remain patched for at most
                  // 45 rendered frames.
                  if (v11_frames < 45) {
                      ++v11_step_frames;
                  } else {
                      // Restore the original instruction
                      // before sending any A presses.
                      if (!rowlet_v11_set_up(false)) {
                          v11_stop(3);
                          return;
                      }

                      v11_set(3);
                      return;
                  }
              }

              else if (v11_state == 3) {
                  // Preserve known A input method.
                  // Ten short pulses.
                  if (v11_frames < 350) {
                      if ((v11_frames % 35) < 6) {
                          if (!rowlet_v11_inject(KEY_A)) {
                              v11_stop(7);
                              return;
                          }

                          ++v11_a_calls;
                      }
                  } else {
                      v11_set(4);
                      return;
                  }
              }

              ++v11_frames;
          }

          static void rowlet_v11_overlay(void)
          {
              if (get_title_id() != V11_TITLE)
                  return;

              const char *state = "READY";

              if (v11_state == 1)
                  state = "RELEASE";

              if (v11_state == 2)
                  state = "PATCH UP";

              if (v11_state == 3)
                  state = "PRESS A";

              if (v11_state == 4)
                  state = "DONE";

              if (v11_state == 5)
                  state = "STOP/ERROR";

              char buf[64];

              host_print(
                  (u32)"ROWLET V11 DRY",
                  14,
                  0x00ffff
              );

              host_print(
                  (u32)"L+R+Y / B:STOP",
                  14,
                  0x00ffff
              );

              snprintf(
                  buf,
                  sizeof(buf),
                  "STATE: %s",
                  state
              );

              host_print(
                  (u32)buf,
                  strlen(buf),
                  0x00ffff
              );

              if (v11_state == 5) {
                  snprintf(
                      buf,
                      sizeof(buf),
                      "ERR:%u/%u",
                      v11_error,
                      rowlet_v11_error()
                  );
              } else {
                  snprintf(
                      buf,
                      sizeof(buf),
                      "STEP:%u A:%u",
                      v11_step_frames,
                      v11_a_calls
                  );
              }

              host_print(
                  (u32)buf,
                  strlen(buf),
                  0x00ffff
              );
          }
          '''

          m = once(
              m,
              'void run_hook(',
              controller + '\nvoid run_hook(',
              'controller location'
          )

          # Replace the earlier V6 controller loop.
          # Place V11 status on the main popup.
          hook_start = (
              '        scan_input();\n'
              '        rowlet_a_test_tick();\n'
              '        run_frame();'
          )

          hook_end = (
              '        draw_to_screen('
              'screenId, fb_a, stride, format);'
          )

          if (
              m.count(hook_start) != 1
              or m.count(hook_end) != 1
          ):
              raise RuntimeError(
                  'V6 overlay hook not found'
              )

          a = m.index(hook_start)
          b = (
              m.index(hook_end, a)
              + len(hook_end)
          )

          m = (
              m[:a]
              + '        scan_input();\n'
              + '        rowlet_v11_tick();\n'
              + '        run_frame();\n'
              + '        rowlet_v11_overlay();\n'
              + hook_end
              + m[b:]
          )

          main.write_text(m)
          hid.write_text(h)
          header.write_text(d)

          print('V11 game-side movement test patched')
          print('Trigger: L + R + Y')
          print('Mode: DRY RUN')
          print('Soft resets: DISABLED')
          PY

          python3 /tmp/v11.py

      - name: Fix libctru 2.4.1 compatibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ld = Path('3gx/3gx.ld')
          code = ld.read_text()

          if '__tdata_align' not in code:
              needle = 'SORT(CONSTRUCTORS)\n\t\t. = ALIGN(4);'
              assert needle in code

              code = code.replace(
                  needle,
                  needle
                  + '\n\t\t__tdata_align = .;'
                  + '\n\t\tLONG (ALIGNOF(.tdata));'
                  + '\n\t\t. = ALIGN(4);',
                  1
              )

          needle = (
              '\t\t__tls_start = .;\n'
              '\t\t. += + SIZEOF(.tdata) + SIZEOF(.tbss);'
          )

          if needle in code:
              code = code.replace(
                  needle,
                  '\t\t. = 8 + ABSOLUTE(ALIGN('
                  'ABSOLUTE(. - 8), '
                  'MAX(4, ALIGNOF(.tdata))));\n'
                  '\t\t__tls_start = .;\n'
                  '\t\t. += SIZEOF(.tdata) + '
                  'SIZEOF(.tbss);',
                  1
              )

          ld.write_text(code)

          src = Path('3gx/sources/main.c')
          code = src.read_text()

          if (
              '__system_runflags' not in code
              or '__apt_appid' not in code
          ):
              needle = 'u32 __ctru_linear_heap_size = 0;'
              assert needle in code

              code = code.replace(
                  needle,
                  needle
                  + '\n\nu32 __system_runflags = 0;'
                  + '\nu32 __apt_appid = 0;',
                  1
              )

          src.write_text(code)
          PY

      - name: Compile with log
        shell: bash
        run: |
          set -o pipefail
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            zaksabeast/devkitarm-rust make \
            2>&1 | tee v11_compile.log

      - name: Upload plugin
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rowlet-v11-game-side-dry-test
          path: out/default.3gx
          if-no-files-found: error

      - name: Upload compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rowlet-v11-compile-log
          path: v11_compile.log
          if-no-files-found: warn
