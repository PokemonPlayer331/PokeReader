
name: Build Rowlet Watch V8.3

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply V5 detector
        run: python3 patch/apply_patch.py .

      - name: Apply V6 A-button test
        run: python3 patch/apply_input_test.py .

      - name: Apply V7.1 reset test
        run: python3 patch/apply_reset_test.py .

      - name: Apply V8.3 resume controller
        run: python3 patch/apply_v8_3.py .

      - name: Compile plugin
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            zaksabeast/devkitarm-rust make

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: rowlet-watch-v8-3-plugin
          path: out/default.3gx
          if-no-files-found: error
