
name: Build Rowlet AUTO v10.2 (DPAD + REHID DRY RUN)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Rowlet patch
        run: python3 patch/apply_patch.py .

      - name: Add experimental automated Rowlet controller
        shell: bash
        run: |
          cat > /tmp/rowlet_auto_patch.py <<'PY'
          #!/usr/bin/env python3
          """PokeReader Ultra Sun Rowlet autopilot prototype: apply AFTER patch/apply_patch.py."""
          from pathlib import Path
          
          root = Path('.').resolve()
          
          def replace(path, old, new):
              p = root/path
              s = p.read_text()
              if s.count(old) != 1:
                  raise RuntimeError(f'{path}: expected one anchor {old!r}, found {s.count(old)}')
              p.write_text(s.replace(old, new, 1))
          
          # Do not touch the existing rendering or input mapping on other titles.
          # The injection thread writes to the mapped HID samples using the same physical
          # alias method that PokeReader already uses for its code hooks. This is
          # experimental on real hardware: it must be bench-tested with one hunt first.
          p = root/'3gx/sources/hid.c'
          s = p.read_text()
          s += r'''
          
          /* Rowlet autopilot: deliberately limited to 12 ordinary 3DS buttons.
           * The 3DS HID module refreshes the ring several times per rendered frame.
           * A short polling thread makes scripted presses more likely to be observed.
           * No writes are attempted before the original game has mapped HID memory. */
          #include <3ds.h>
          static volatile u32 auto_rowlet_mask = 0;
          static volatile bool auto_rowlet_thread_running = false;
          static volatile bool auto_rowlet_started = false;
          static vu32 *auto_rowlet_base = 0;
          #define ROWLET_KEYS (KEY_A | KEY_B | KEY_SELECT | KEY_START | KEY_DRIGHT | KEY_DLEFT | KEY_DUP | KEY_DDOWN | KEY_R | KEY_L | KEY_X | KEY_Y)
          void auto_rowlet_keys(u32 keys) { auto_rowlet_mask = keys & ROWLET_KEYS; }
          bool auto_rowlet_available(void) { return auto_rowlet_started && auto_rowlet_base != 0; }
          static void auto_rowlet_pump(void *unused) {
            (void)unused;
            auto_rowlet_thread_running = true;
            while (auto_rowlet_thread_running) {
              u32 keys = auto_rowlet_mask;
              if (keys && auto_rowlet_base) {
                /* PA_FROM_VA_PTR is used elsewhere in this plugin for code patching.
                 * It bypasses the game's read-only VA mapping of HID shared memory.
                 * The HID service still owns the memory and will keep refreshing it. */
                vu32 *mem = (vu32 *)PA_FROM_VA_PTR((u32)auto_rowlet_base);
                if (mem) {
                  u32 idx = mem[0x10 / 4] & 7u;
                  vu32 *entry = (vu32 *)((u8 *)mem + 0x28 + idx * 0x10);
                  entry[0] |= keys;  /* current */
                  entry[1] |= keys;  /* pressed: game libraries may read the edge */
                  entry[2] &= ~keys; /* released */
                  mem[0x1c / 4] |= keys & 0xfffu;
                }
              }
              svcSleepThread(2000000); /* 2 ms */
            }
          }
          void auto_rowlet_start_thread(void) {
            if (!auto_rowlet_started) {
              Thread t = threadCreate(auto_rowlet_pump, NULL, 0x1000, 0x30, -2, true);
              if (t) auto_rowlet_started = true;
            }
          }
          '''
          # Needed by PA_FROM_VA_PTR and thread functions; the existing HID source has <3ds.h>.
          s = s.replace('  g_key_addr = key_addr;', '  g_key_addr = key_addr;\n  auto_rowlet_base = (vu32 *)((u8 *)key_addr - 0x28);')
          # C declaration must precede set_key_addr(); globals defined below become visible via extern.
          s = s.replace('vu32 *g_key_addr = 0;', 'static vu32 *auto_rowlet_base;\nvu32 *g_key_addr = 0;')
          # Duplicate declaration of file-scope static (tentative definition) is allowed C; remove for clarity.
          s = s.replace('static vu32 *auto_rowlet_base = 0;', '')
          p.write_text(s)
          
          replace('3gx/includes/hid.h', 'void scan_input();',
          '''void scan_input();
          void auto_rowlet_keys(u32 keys);
          bool auto_rowlet_available(void);
          void auto_rowlet_start_thread();''')
          replace('3gx/sources/main.c', '    initialize();\n',
          '''    auto_rowlet_start_thread();
              initialize();
          ''')
          replace('3gx/sources/pnp.c', 'u32 host_just_pressed()\n',
          '''void host_auto_rowlet_keys(u32 bits) { auto_rowlet_keys(bits); }
          u32 host_auto_rowlet_available() { return (u32)auto_rowlet_available(); }
          u32 host_just_pressed()
          ''')
          replace('reader_core/src/pnp/mod.rs', 'mod bindings;', 'pub(crate) mod bindings;')
          replace('reader_core/src/pnp/bindings.rs', '    pub fn host_get_game_title_id() -> u64;',
          '''    pub fn host_get_game_title_id() -> u64;
              pub fn host_auto_rowlet_keys(bits: u32);
              pub fn host_auto_rowlet_available() -> u32;''')
          
          # The current diagnostic Watch already verifies two windows of PID/PSV data.
          # Permit re-arming only after the game has returned to an empty slot following
          # an explicitly approved reset. Preserve the encounter counter.
          replace('patch/rowlet_watch.rs', '    fn fail(&mut self, reason: &\'static str) {',
          '''    pub fn next_cycle(&mut self) {
                  let count = self.count;
                  *self = Self::new();
                  self.count = count;
              }
              fn fail(&mut self, reason: &'static str) {''')
          # Copy of patch/rowlet_watch.rs is made by the base patcher; patch the copy too.
          replace('reader_core/src/gen7/rowlet_watch.rs', '    fn fail(&mut self, reason: &\'static str) {',
          '''    pub fn next_cycle(&mut self) {
                  let count = self.count;
                  *self = Self::new();
                  self.count = count;
              }
              fn fail(&mut self, reason: &'static str) {''')
          
          auto_rust = r'''// Experimental standalone 3DS input automation for Ultra Sun ONLY.
          // Defaults assume you saved immediately before the Route 1 grass trigger.
          // All timing values are 60-FPS approximate and require real-hardware testing.
          // B+SELECT starts / aborts when an empty slot has been observed.
          use super::rowlet_watch::{Phase, Watch};
          use crate::pnp::{self, Button};
          
          const KEY_A: u32 = 1;
          // D-pad Up is mapped to Circle Pad Up through rehid on the user console.
          // Injected HID input reaching rehid is NOT yet confirmed.
          const KEY_UP: u32 = 1 << 6; // D-pad Up
          // No reset keys are ever emitted by this dry-run build.
          const MAX_DIALOG_FRAMES: u32 = 120 * 60;
          
          #[derive(Clone, Copy, PartialEq, Eq)]
          pub enum Step { Off, Walk, Dialog, Check, Done, Shiny, Halt }
          impl Step {
              pub fn label(self) -> &'static str {
                  match self {
                      Self::Off => "OFF: B+SELECT to arm",
                      Self::Walk => "DRY RUN: D-PAD UP",
                      Self::Dialog => "DRY RUN: sending A",
                      Self::Check => "DRY RUN: checking PID",
                      Self::Done => "DRY RUN DONE: non-shiny",
                      Self::Shiny => "SHINY! STOPPED",
                      Self::Halt => "DRY RUN STOP: check console",
                  }
              }
          }
          pub struct Auto {
              pub step: Step,
              pub frames: u32,
              pub cycles: u32,
              debounce: u16,
          }
          impl Auto {
              pub const fn new() -> Self {
                  Self {step: Step::Off, frames: 0, cycles: 0, debounce: 0}
              }
              fn set(&mut self, new_step: Step) { self.step = new_step; self.frames = 0; }
              pub fn tick(&mut self, watch: &mut Watch, _species: u16) {
                  if self.debounce > 0 { self.debounce -= 1; }
                  let toggle = pnp::is_pressing(Button::B) && pnp::is_pressing(Button::Select);
                  if toggle && self.debounce == 0 {
                      self.debounce = 90;
                      if self.step == Step::Off && watch.phase == Phase::WaitRowlet &&
                          unsafe { crate::pnp::bindings::host_auto_rowlet_available() } != 0 {
                          self.set(Step::Walk);
                      } else {
                          self.set(Step::Off);
                      }
                  }
                  // NOTE: never send any input on a verified shiny, even if the user
                  // has left the overlay hidden. The C side defaults to no buttons.
                  if watch.phase == Phase::Shiny { self.set(Step::Shiny); }
                  if watch.phase == Phase::Error { self.set(Step::Halt); }
                  let mut keys: u32 = 0;
                  match self.step {
                      Step::Off | Step::Shiny | Step::Halt => {}
                      Step::Walk => {
                          if self.frames < 120 { keys = KEY_UP; }
                          else { self.set(Step::Dialog); }
                      }
                      Step::Dialog => {
                          // Rowlet is already the default first starter.
                          // Advance with A only; no Left selector input.
                          if watch.phase == Phase::Verify || watch.phase == Phase::Reverify {
                              self.set(Step::Check);
                          } else if watch.phase == Phase::Normal {
                              self.set(Step::Done);
                          } else if self.frames >= MAX_DIALOG_FRAMES {
                              self.set(Step::Halt); // fail closed on a stalled scene
                          } else if self.frames % 40 < 10 {
                              keys = KEY_A;
                          }
                      }
                      Step::Check => {
                          if watch.phase == Phase::Normal { self.set(Step::Done); }
                          else if watch.phase == Phase::WaitRowlet { self.set(Step::Halt); }
                          else if self.frames > 180 { self.set(Step::Halt); }
                      }
                      Step::Done => {
                          // DRY RUN: freeze all scripted inputs on verified non-shiny.
                          // No resets, even after a completed selection.
                      }
                  }
                  self.frames = self.frames.saturating_add(1);
                  unsafe { crate::pnp::bindings::host_auto_rowlet_keys(keys); }
              }
          }
          '''
          (root/'reader_core/src/gen7/rowlet_auto.rs').write_text(auto_rust)
          for watch_name in ('patch/rowlet_watch.rs', 'reader_core/src/gen7/rowlet_watch.rs'):
              replace(watch_name, 'RESET APPROVED (DRY RUN)', 'DRY RUN: NORMAL')
              replace(watch_name, 'Would reset; no buttons sent', 'NO RESET: dry run')
              replace(watch_name, 'No reset buttons will be pressed', 'B+SELECT: start dry-run')
          replace('reader_core/src/gen7/mod.rs', 'mod reader;', 'mod reader;\nmod rowlet_auto;')
          replace('reader_core/src/gen7/frame.rs', 'use super::rowlet_watch::{Sample, Watch};',
          '''use super::rowlet_watch::{Sample, Watch};
          use super::rowlet_auto::Auto;''')
          replace('reader_core/src/gen7/frame.rs', ' rowlet_watch: Watch,',
          ''' rowlet_watch: Watch,
           rowlet_auto: Auto,''')
          replace('reader_core/src/gen7/frame.rs', ' rowlet_watch: Watch::new(),',
          ''' rowlet_watch: Watch::new(),
           rowlet_auto: Auto::new(),''')
          replace('reader_core/src/gen7/frame.rs', ' state.sfmt.reinit_if_needed(reader.init_seed());',
          ''' if is_ultra_sun {
                  let mon = reader.party_pkm(0);
                  state.rowlet_auto.tick(&mut state.rowlet_watch, mon.species());
              }
              state.sfmt.reinit_if_needed(reader.init_seed());''')
          # Replace the existing diagnostic line that is definitely present in patcher.
          replace('reader_core/src/gen7/frame.rs', ' pnp::println!("Reset output: OFF");',
          ''' pnp::println!("MODE: DRY RUN / DPAD+REHID");
           pnp::println!("AUTO: {}", state.rowlet_auto.step.label());
           pnp::println!("Reset commands: DISABLED");''')
          replace('reader_core/src/gen7/frame.rs', 'pnp::println!("ROWLET WATCH v4");', 'pnp::println!("ROWLET AUTO v10.2");')
          print('Patched Rowlet v10.2 dry-run selection test. Hardware input not verified.')
          PY
          python3 /tmp/rowlet_auto_patch.py

      - name: Fix libctru 2.4.1 compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ld = Path('3gx/3gx.ld')
          code = ld.read_text()
          if '__tdata_align' not in code:
              needle = 'SORT(CONSTRUCTORS)\n\t\t. = ALIGN(4);'
              assert needle in code, 'Cannot locate rodata section in 3gx/3gx.ld'
              code = code.replace(
                  needle,
                  needle + '\n\t\t__tdata_align = .;\n\t\tLONG (ALIGNOF(.tdata));\n\t\t. = ALIGN(4);',
                  1,
              )
          needle = '\t\t__tls_start = .;\n\t\t. += + SIZEOF(.tdata) + SIZEOF(.tbss);'
          if needle in code:
              code = code.replace(
                  needle,
                  '\t\t. = 8 + ABSOLUTE(ALIGN(ABSOLUTE(. - 8), MAX(4, ALIGNOF(.tdata))));\n'
                  '\t\t__tls_start = .;\n'
                  '\t\t. += SIZEOF(.tdata) + SIZEOF(.tbss);',
                  1,
              )
          ld.write_text(code)

          src = Path('3gx/sources/main.c')
          code = src.read_text()
          if '__system_runflags' not in code or '__apt_appid' not in code:
              needle = 'u32 __ctru_linear_heap_size = 0;'
              assert needle in code, 'Cannot locate heap definitions in 3gx/sources/main.c'
              code = code.replace(
                  needle,
                  needle + '\n\n/* libctru symbols expected by its APT support. */\n'
                  'u32 __system_runflags = 0;\n'
                  'u32 __apt_appid = 0;',
                  1,
              )
          src.write_text(code)
          PY

      - name: Compile and save log
        shell: bash
        run: |
          set -o pipefail
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            zaksabeast/devkitarm-rust make 2>&1 | tee v90_compile.log

      - name: Upload plugin
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rowlet-auto-v10-2-dry-run
          path: out/default.3gx
          if-no-files-found: error

      - name: Upload compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rowlet-auto-compile-log
          path: v90_compile.log
          if-no-files-found: warn
