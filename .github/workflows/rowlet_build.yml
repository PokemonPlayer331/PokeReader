
name: Build Rowlet Watch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Rowlet patch
        run: python3 patch/apply_patch.py .

      - name: Apply experimental A-button test
        run: python3 patch/apply_input_test.py .

      - name: Apply manual soft-reset test
        run: python3 patch/apply_reset_test.py .

      - name: Compile
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            zaksabeast/devkitarm-rust make

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: rowlet-watch-plugin
          path: out/default.3gx
          if-no-files-found: error
