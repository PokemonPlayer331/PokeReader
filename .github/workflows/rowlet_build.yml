
name: Build Rowlet V10.9 One Step Analog Ring + A DRY RUN

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Rowlet Watch V5
        run: python3 patch/apply_patch.py .

      - name: Apply original V6 virtual A test
        run: python3 patch/apply_input_test.py .

      - name: Combine V6 input with one-step analog test
        shell: bash
        run: |
          cat > /tmp/v109.py <<'PY'
          from pathlib import Path

          main = Path('3gx/sources/main.c')
          hid = Path('3gx/sources/hid.c')
          header = Path('3gx/includes/hid.h')
          m = main.read_text()
          h = hid.read_text()
          d = header.read_text()

          def once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise RuntimeError(
                      f'{label}: expected 1 anchor, found {count}'
                  )
              return source.replace(old, new, 1)

          # Retain the previously working virtual A method.
          # No background HID thread or automatic resets.
          h = once(
              h,
              '#include "common.h"',
              '#include "common.h"\n#include "csvc.h"',
              'csvc header'
          )

          h += r'''
          // V10.9: preserve V6-style A injection.
          bool rowlet_v109_inject(u32 bits)
          {
              if (!g_key_addr) return false;

              bits &= KEY_A;
              if (!bits) return false;

              volatile u32 *base =
                  g_key_addr - (0x28 / 4);

              u32 index = base[0x10 / 4];
              if (index >= 8) return false;

              volatile u32 *sample =
                  base + (0x28 / 4)
                  + index * (0x10 / 4);

              u32 sample_pa = svcConvertVAToPA(
                  (const void *)sample, false
              );

              u32 current_pa = svcConvertVAToPA(
                  (const void *)(base + (0x1c / 4)),
                  false
              );

              if (!sample_pa || !current_pa)
                  return false;

              volatile u32 *s =
                  (volatile u32 *)(
                      sample_pa | 0x80000000u
                  );

              volatile u32 *cur =
                  (volatile u32 *)(
                      current_pa | 0x80000000u
                  );

              s[0] |= bits;
              s[1] |= bits;
              *cur |= bits;

              return true;
          }

          // New experiment: write to all eight PAD
          // samples instead of only the newest.
          bool rowlet_v109_step(void)
          {
              if (!g_key_addr) return false;

              volatile u32 *base =
                  g_key_addr - (0x28 / 4);

              u32 index = base[0x10 / 4];
              if (index >= 8) return false;

              u32 pa = svcConvertVAToPA(
                  (const void *)(base + (0x28 / 4)),
                  false
              );

              if (!pa) return false;

              volatile u32 *ring =
                  (volatile u32 *)(
                      pa | 0x80000000u
                  );

              for (u32 i = 0; i < 8; ++i) {
                  volatile u32 *sample =
                      ring + 4 * i;

                  // +0xC stores X and Y.
                  // Preserve X and set Y to +156.
                  sample[3] =
                      (sample[3] & 0x0000ffffu)
                      | 0x009c0000u;

                  // Derived Circle Pad Up direction.
                  sample[0] |= KEY_CPAD_UP;
              }

              return true;
          }
          '''

          d += '\nbool rowlet_v109_inject(u32 bits);\n'
          d += 'bool rowlet_v109_step(void);\n'

          controller = r'''
          // V10.9 dry-run state machine.
          // 0 READY
          // 1 RELEASE
          // 2 ONE STEP
          // 3 PRESS A
          // 4 DONE
          // 5 STOP / ERROR

          static unsigned v109_state = 0;
          static unsigned v109_frames = 0;
          static unsigned v109_idle = 0;
          static unsigned v109_up_calls = 0;
          static unsigned v109_a_calls = 0;

          static const char *v109_error = "";

          #define V109_TITLE 0x00040000001B5000ULL

          static void v109_set(unsigned state)
          {
              v109_state = state;
              v109_frames = 0;
          }

          static void rowlet_v109_tick(void)
          {
              if (get_title_id() != V109_TITLE)
                  return;

              const u32 keys = get_current_keys();

              // Start using L + R + Y.
              // X is never part of the trigger.
              const u32 start =
                  KEY_L | KEY_R | KEY_Y;

              if (v109_state == 0) {
                  if (
                      (keys & start) == start &&
                      !(keys & KEY_X)
                  ) {
                      v109_up_calls = 0;
                      v109_a_calls = 0;
                      v109_idle = 0;
                      v109_set(1);
                  }

                  return;
              }

              // Physical B stops the test.
              if (keys & KEY_B) {
                  v109_error = "MANUAL STOP";
                  v109_set(5);
                  return;
              }

              if (v109_state >= 4)
                  return;

              if (v109_state == 1) {
                  // Wait until trigger is released.
                  v109_idle =
                      (keys == 0)
                      ? v109_idle + 1
                      : 0;

                  if (v109_idle >= 15)
                      v109_set(2);

                  if (++v109_frames > 600) {
                      v109_error = "RELEASE TIMEOUT";
                      v109_set(5);
                  }

                  return;
              }

              if (
                  (keys & ~(KEY_DUP | KEY_A)) != 0
              ) {
                  v109_error = "OTHER KEY PRESSED";
                  v109_set(5);
                  return;
              }

              if (v109_state == 2) {
                  // One-step experiment:
                  // maximum 45 rendered frames.
                  if (v109_frames < 45) {
                      if (!rowlet_v109_step()) {
                          v109_error = "STEP FAILED";
                          v109_set(5);
                          return;
                      }

                      ++v109_up_calls;
                  } else {
                      v109_set(3);
                      return;
                  }
              }

              else if (v109_state == 3) {
                  // Preserve working A injection.
                  // Ten short pulses.
                  if (v109_frames < 350) {
                      if (
                          (v109_frames % 35) < 6
                      ) {
                          if (
                              !rowlet_v109_inject(KEY_A)
                          ) {
                              v109_error = "A INJECT FAILED";
                              v109_set(5);
                              return;
                          }

                          ++v109_a_calls;
                      }
                  } else {
                      v109_set(4);
                      return;
                  }
              }

              ++v109_frames;
          }

          static void rowlet_v109_overlay(void)
          {
              if (get_title_id() != V109_TITLE)
                  return;

              const char *state = "READY";

              if (v109_state == 1)
                  state = "RELEASE";

              if (v109_state == 2)
                  state = "ONE STEP";

              if (v109_state == 3)
                  state = "PRESS A";

              if (v109_state == 4)
                  state = "DONE";

              if (v109_state == 5)
                  state = "STOP/ERROR";

              char buf[64];

              host_print(
                  (u32)"ROWLET V10.9 DRY",
                  16,
                  0x00ffff
              );

              host_print(
                  (u32)"L+R+Y: START",
                  12,
                  0x00ffff
              );

              snprintf(
                  buf,
                  sizeof(buf),
                  "STATE: %s",
                  state
              );

              host_print(
                  (u32)buf,
                  strlen(buf),
                  0x00ffff
              );

              snprintf(
                  buf,
                  sizeof(buf),
                  "ST:%u A:%u",
                  v109_up_calls,
                  v109_a_calls
              );

              host_print(
                  (u32)buf,
                  strlen(buf),
                  0x00ffff
              );
          }
          '''

          m = once(
              m,
              'void run_hook(',
              controller + '\nvoid run_hook(',
              'controller location'
          )

          # Replace original V6 execution while
          # preserving the main popup.
          hook_start = (
              '        scan_input();\n'
              '        rowlet_a_test_tick();\n'
              '        run_frame();'
          )

          hook_end = (
              '        draw_to_screen('
              'screenId, fb_a, stride, format);'
          )

          if (
              m.count(hook_start) != 1
              or m.count(hook_end) != 1
          ):
              raise RuntimeError(
                  'V6 overlay hook not found'
              )

          a = m.index(hook_start)
          b = (
              m.index(hook_end, a)
              + len(hook_end)
          )

          m = (
              m[:a]
              + '        scan_input();\n'
              + '        rowlet_v109_tick();\n'
              + '        run_frame();\n'
              + '        rowlet_v109_overlay();\n'
              + hook_end
              + m[b:]
          )

          main.write_text(m)
          hid.write_text(h)
          header.write_text(d)

          print("V10.9 patch applied")
          print("Trigger: L + R + Y")
          print("Movement: analog input ring test")
          print("A injection: V6 method")
          print("Reset: DISABLED")
          PY

          python3 /tmp/v109.py

      - name: Fix libctru 2.4.1 compatibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ld = Path('3gx/3gx.ld')
          code = ld.read_text()

          if '__tdata_align' not in code:
              needle = (
                  'SORT(CONSTRUCTORS)\n'
                  '\t\t. = ALIGN(4);'
              )

              assert needle in code

              code = code.replace(
                  needle,
                  needle
                  + '\n\t\t__tdata_align = .;'
                  + '\n\t\tLONG (ALIGNOF(.tdata));'
                  + '\n\t\t. = ALIGN(4);',
                  1
              )

          needle = (
              '\t\t__tls_start = .;\n'
              '\t\t. += + SIZEOF(.tdata) '
              '+ SIZEOF(.tbss);'
          )

          if needle in code:
              code = code.replace(
                  needle,
                  '\t\t. = 8 + ABSOLUTE(ALIGN('
                  'ABSOLUTE(. - 8), '
                  'MAX(4, ALIGNOF(.tdata))));\n'
                  '\t\t__tls_start = .;\n'
                  '\t\t. += SIZEOF(.tdata) '
                  '+ SIZEOF(.tbss);',
                  1
              )

          ld.write_text(code)

          src = Path('3gx/sources/main.c')
          code = src.read_text()

          if (
              '__system_runflags' not in code
              or '__apt_appid' not in code
          ):
              needle = (
                  'u32 __ctru_linear_heap_size = 0;'
              )

              assert needle in code

              code = code.replace(
                  needle,
                  needle
                  + '\n\nu32 __system_runflags = 0;'
                  + '\nu32 __apt_appid = 0;',
                  1
              )

          src.write_text(code)
          PY

      - name: Compile with log
        shell: bash
        run: |
          set -o pipefail
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            zaksabeast/devkitarm-rust make \
            2>&1 | tee v109_compile.log

      - name: Upload plugin
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rowlet-v10-9-dry-test
          path: out/default.3gx
          if-no-files-found: error

      - name: Upload compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rowlet-v10-9-compile-log
          path: v109_compile.log
          if-no-files-found: warn
