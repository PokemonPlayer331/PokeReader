
name: Build Rowlet V11.3 Measured Two-Step Dry Run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Rowlet Watch V5
        run: python3 patch/apply_patch.py .

      - name: Apply previously working V6 virtual A bridge
        run: python3 patch/apply_input_test.py .

      - name: V11.3 game-side measured stick experiment
        shell: bash
        run: |
          cat > /tmp/v113.py <<'PY'
          from pathlib import Path

          main = Path('3gx/sources/main.c')
          hid = Path('3gx/sources/hid.c')
          h = hid.read_text()

          if '#include "csvc.h"' not in h:
              needle = '#include "common.h"'
              if h.count(needle) != 1:
                  raise RuntimeError('V6 common.h include missing')
              h = h.replace(
                  needle,
                  needle + '\n#include "csvc.h"',
                  1
              )
              hid.write_text(h)

          s = main.read_text()

          observer = r'''
          // V11.3 Ultra Sun v1.2 measured stick test.
          // Physical Up reached Y=+104 in V11.2.
          // DRY RUN: no automatic reset.

          #define V113_TITLE 0x00040000001B5000ULL
          #define V113_TARGET 0x004B6DD8u
          #define V113_OP0 0xE92D4070u
          #define V113_OP1 0xE1A04000u
          #define V113_JUMP 0xE51FF004u

          // 0 idle, 1 Up, 2 neutral.
          static volatile u32 v113_inject_mode = 0;
          static volatile u32 v113_up_hits = 0;
          static volatile u32 v113_release_hits = 0;
          static volatile s32 v113_last_y_before = 0;
          static volatile s32 v113_last_y_after = 0;
          static volatile u32 v113_hook_status = 0;

          __attribute__((used, noinline))
          static void v113_modify_stick(void *input)
          {
              u32 mode = v113_inject_mode;

              if (!input || !mode)
                  return;

              volatile s16 *xy =
                  (volatile s16 *)(
                      (u8 *)input + 12
                  );

              v113_last_y_before = (s32)xy[1];

              if (mode == 1) {
                  // Copy the actual measured Up value.
                  xy[0] = 0;
                  xy[1] = 104;

                  ++v113_up_hits;
              }

              else if (mode == 2) {
                  // Release to neutral.
                  xy[0] = 0;
                  xy[1] = 0;

                  ++v113_release_hits;
              }

              v113_last_y_after = (s32)xy[1];
          }

          // Preserve registers, replay original instructions,
          // then return to the original routine.
          __attribute__((naked, used, noinline, aligned(4)))
          static void v113_trampoline(void)
          {
              __asm__ volatile(
                  ".arm\n"
                  "stmdb sp!, {r0-r3, r12, lr}\n"
                  "mov r0, r1\n"
                  "bl v113_modify_stick\n"
                  "ldmia sp!, {r0-r3, r12, lr}\n"
                  "stmdb sp!, {r4, r5, r6, lr}\n"
                  "mov r4, r0\n"
                  "ldr pc, =0x004B6DE0\n"
              );
          }

          static void v113_install(void)
          {
              if (get_title_id() != V113_TITLE)
                  return;

              volatile u32 *code =
                  (volatile u32 *)V113_TARGET;

              if (
                  code[0] != V113_OP0 ||
                  code[1] != V113_OP1
              ) {
                  v113_hook_status = 2;
                  return;
              }

              u32 dest =
                  (u32)(void *)v113_trampoline;

              if (dest & 3u) {
                  v113_hook_status = 4;
                  return;
              }

              u32 pa = svcConvertVAToPA(
                  (const void *)V113_TARGET,
                  false
              );

              if (!pa || (pa & 3u)) {
                  v113_hook_status = 3;
                  return;
              }

              volatile u32 *p =
                  (volatile u32 *)(
                      pa | 0x80000000u
                  );

              p[1] = dest;
              p[0] = V113_JUMP;

              svcInvalidateEntireInstructionCache();

              v113_hook_status = 1;
          }

          // 0 READY
          // 1 RELEASE BUTTONS
          // 2 UP
          // 3 NEUTRAL
          // 4 A PRESS
          // 5 DONE
          // 6 STOP/ERROR

          static u32 v113_state = 0;
          static u32 v113_frames = 0;
          static u32 v113_idle = 0;
          static u32 v113_a_calls = 0;
          static u32 v113_error = 0;

          static void v113_set(u32 new_state)
          {
              v113_state = new_state;
              v113_frames = 0;
          }

          static void v113_abort(u32 reason)
          {
              v113_inject_mode = 2;
              v113_error = reason;
              v113_set(6);
          }

          static void v113_tick(void)
          {
              if (
                  get_title_id() != V113_TITLE ||
                  v113_hook_status != 1
              )
                  return;

              u32 keys = get_current_keys();

              // No X activation.
              const u32 chord =
                  KEY_L | KEY_R | KEY_Y;

              if (v113_state == 0) {
                  if (
                      (keys & chord) == chord &&
                      !(keys & KEY_X)
                  ) {
                      v113_a_calls = 0;
                      v113_up_hits = 0;
                      v113_release_hits = 0;
                      v113_error = 0;
                      v113_inject_mode = 0;
                      v113_idle = 0;

                      v113_set(1);
                  }

                  return;
              }

              if (v113_state == 5)
                  return;

              if (v113_state == 6) {
                  if (++v113_frames >= 45)
                      v113_inject_mode = 0;

                  return;
              }

              // Physical B cancels.
              if (keys & KEY_B) {
                  v113_abort(1);
                  return;
              }

              if (v113_state == 1) {
                  v113_idle =
                      (keys == 0)
                      ? v113_idle + 1
                      : 0;

                  if (v113_idle >= 15) {
                      v113_inject_mode = 1;
                      v113_set(2);
                      return;
                  }

                  if (++v113_frames > 600)
                      v113_abort(2);

                  return;
              }

              if (keys & ~(KEY_A | KEY_DUP)) {
                  v113_abort(3);
                  return;
              }

              if (v113_state == 2) {
                  // Hold game-side Up for 150 frames.
                  // The save requires two actual steps.
                  if (++v113_frames >= 150) {
                      v113_inject_mode = 2;
                      v113_set(3);
                  }

                  return;
              }

              if (v113_state == 3) {
                  // Release Up before A presses.
                  if (++v113_frames >= 35) {
                      v113_inject_mode = 0;
                      v113_set(4);
                  }

                  return;
              }

              if (v113_state == 4) {
                  // Use the proven V6 virtual A function.
                  // Ten short pulses, no reset.
                  if (v113_frames < 350) {
                      if ((v113_frames % 35) < 6) {
                          if (!rowlet_try_inject_a_frame()) {
                              v113_abort(4);
                              return;
                          }

                          ++v113_a_calls;
                      }
                  } else {
                      v113_inject_mode = 0;
                      v113_set(5);
                      return;
                  }

                  ++v113_frames;
              }
          }

          static void v113_overlay(void)
          {
              if (get_title_id() != V113_TITLE)
                  return;

              const char *label = "READY";

              if (v113_hook_status != 1) {
                  label = "HOOK ERR";
              } else {
                  if (v113_state == 1)
                      label = "RELEASE";

                  if (v113_state == 2)
                      label = "UP";

                  if (v113_state == 3)
                      label = "NEUTRAL";

                  if (v113_state == 4)
                      label = "A PRESS";

                  if (v113_state == 5)
                      label = "DONE";

                  if (v113_state == 6)
                      label = "STOP";
              }

              char buf[64];

              host_print(
                  (u32)"V11.3 DRY / 2 STEPS",
                  19,
                  0x00ffff
              );

              host_print(
                  (u32)"L+R+Y START  B:STOP",
                  19,
                  0x00ffff
              );

              snprintf(
                  buf,
                  sizeof(buf),
                  "S:%s Y:%ld/%ld",
                  label,
                  (long)v113_last_y_before,
                  (long)v113_last_y_after
              );

              host_print(
                  (u32)buf,
                  strlen(buf),
                  0x00ffff
              );

              if (
                  v113_hook_status == 1 &&
                  v113_state != 6
              ) {
                  snprintf(
                      buf,
                      sizeof(buf),
                      "UP:%lu A:%lu",
                      (unsigned long)v113_up_hits,
                      (unsigned long)v113_a_calls
                  );
              } else {
                  snprintf(
                      buf,
                      sizeof(buf),
                      "ERR:%lu/%lu",
                      (unsigned long)v113_hook_status,
                      (unsigned long)v113_error
                  );
              }

              host_print(
                  (u32)buf,
                  strlen(buf),
                  0x00ffff
              );
          }
          '''

          needle = 'void run_hook('

          if s.count(needle) != 1:
              raise RuntimeError(
                  'V11.3 run_hook insertion point missing'
              )

          s = s.replace(
              needle,
              observer + '\n' + needle,
              1
          )

          hook_start = (
              '        scan_input();\n'
              '        rowlet_a_test_tick();\n'
              '        run_frame();'
          )

          hook_end = (
              '        draw_to_screen('
              'screenId, fb_a, stride, format);'
          )

          if (
              s.count(hook_start) != 1 or
              s.count(hook_end) != 1
          ):
              raise RuntimeError(
                  'V11.3 V6 framebuffer hook missing'
              )

          a = s.index(hook_start)
          b = (
              s.index(hook_end, a)
              + len(hook_end)
          )

          s = (
              s[:a]
              + '        scan_input();\n'
              + '        v113_tick();\n'
              + '        run_frame();\n'
              + '        v113_overlay();\n'
              + hook_end
              + s[b:]
          )

          old = (
              '    initialize();\n'
              '    svcInvalidateEntireInstructionCache();'
          )

          new = (
              '    initialize();\n'
              '    v113_install();\n'
              '    svcInvalidateEntireInstructionCache();'
          )

          if s.count(old) != 1:
              raise RuntimeError(
                  'V11.3 startup hook missing'
              )

          s = s.replace(old, new, 1)

          main.write_text(s)

          print("V11.3 patch applied")
          print("Trigger: L + R + Y")
          print("Movement value: Y = +104")
          print("Movement duration: 150 frames")
          print("Virtual A: V6 bridge")
          print("Automatic reset: DISABLED")
          PY

          python3 /tmp/v113.py

      - name: Fix libctru compatibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ld = Path('3gx/3gx.ld')
          code = ld.read_text()

          if '__tdata_align' not in code:
              needle = 'SORT(CONSTRUCTORS)\n\t\t. = ALIGN(4);'
              assert needle in code

              code = code.replace(
                  needle,
                  needle +
                  '\n\t\t__tdata_align = .;'
                  '\n\t\tLONG (ALIGNOF(.tdata));'
                  '\n\t\t. = ALIGN(4);',
                  1
              )

          needle = (
              '\t\t__tls_start = .;\n'
              '\t\t. += + SIZEOF(.tdata) + SIZEOF(.tbss);'
          )

          if needle in code:
              code = code.replace(
                  needle,
                  '\t\t. = 8 + ABSOLUTE(ALIGN('
                  'ABSOLUTE(. - 8), '
                  'MAX(4, ALIGNOF(.tdata))));\n'
                  '\t\t__tls_start = .;\n'
                  '\t\t. += SIZEOF(.tdata) + SIZEOF(.tbss);',
                  1
              )

          ld.write_text(code)

          src = Path('3gx/sources/main.c')
          code = src.read_text()

          if (
              '__system_runflags' not in code or
              '__apt_appid' not in code
          ):
              needle = 'u32 __ctru_linear_heap_size = 0;'
              assert needle in code

              code = code.replace(
                  needle,
                  needle +
                  '\n\nu32 __system_runflags = 0;'
                  '\nu32 __apt_appid = 0;',
                  1
              )

          src.write_text(code)
          PY

      - name: Compile and save log
        shell: bash
        run: |
          set -o pipefail
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            zaksabeast/devkitarm-rust make \
            2>&1 | tee v113_compile.log

      - name: Upload plugin
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rowlet-v11-3-two-step-dry-run
          path: out/default.3gx
          if-no-files-found: error

      - name: Upload compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rowlet-v11-3-compile-log
          path: v113_compile.log
          if-no-files-found: warn
