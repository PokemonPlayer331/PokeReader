
# V12.1: A-only Rowlet starter test. REPLACE .github/workflows/rowlet_build.yml.
name: Build Rowlet V12.1 A Spam Shiny Check

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply V5 decoded Rowlet watcher
        run: python3 patch/apply_patch.py .

      - name: Apply V6 working A-input bridge
        run: python3 patch/apply_input_test.py .

      - name: Replace V6 test with V12.1 A pulses and shiny-only status
        shell: bash
        run: |
          cat > /tmp/rowlet_v12_1_patch.py <<'PY'
          #!/usr/bin/env python3
          """V12.1 A pulses and Rowlet Watch status, applied AFTER repo V5 + V6 patches."""
          from pathlib import Path

          main = Path('3gx/sources/main.c')
          hid = Path('3gx/sources/hid.c')
          hdr = Path('3gx/includes/hid.h')
          frame = Path('reader_core/src/gen7/frame.rs')
          for p in (main, hid, hdr, frame):
              if not p.is_file():
                  raise SystemExit(f'V12.1 missing source: {p}')
          m, h, d, f = (p.read_text() for p in (main, hid, hdr, frame))

          def rep(s, a, b, label):
              n=s.count(a)
              if n!=1:
                  raise SystemExit(f'V12.1 {label}: expected one anchor, found {n}; stopped before editing')
              return s.replace(a,b,1)

          # V6 controller really starts with exactly this marker in apply_input_test.py.
          start = '// ROWLET_V6_INPUT_TEST\n\nstatic unsigned int rowlet_a_test_state'
          end = 'void run_hook('
          if m.count(start) != 1 or m.count(end) != 1:
              raise SystemExit('V12.1 actual V6 controller anchors missing; stopped before editing')
          a, b = m.index(start), m.index(end)
          if a >= b:
              raise SystemExit('V12.1 V6 controller order invalid')

          controller = r'''// ROWLET_V12_1: virtual A only; no injected motion, no reset.
          #define ROWLET_V12_TITLE 0x00040000001B5000ULL
          #define ROWLET_V12_TIMEOUT 10800u
          static volatile u32 v12_phase = 0;
          static u32 v12_state = 0; /* 0 ready, 1 release trigger, 2 pulses, 3 stop */
          static u32 v12_frame = 0;
          static u32 v12_release = 0;

          void rowlet_v12_report(u32 phase) { v12_phase = phase; }

          static void rowlet_v12_tick(void)
          {
              if (get_title_id() != ROWLET_V12_TITLE) return;
              const u32 keys = get_current_keys();
              const u32 trigger = KEY_L | KEY_R | KEY_Y;
              if ((keys & KEY_B) || v12_phase >= 4) {
                  if (v12_state == 2) rowlet_try_release_a_frame();
                  v12_state = 3;
                  return;
              }
              if (v12_state == 0) {
                  if ((keys & trigger) == trigger) {
                      v12_state = 1;
                      v12_frame = 0;
                      v12_release = 0;
                  }
                  return;
              }
              if (v12_state == 1) {
                  if ((keys & trigger) == 0) {
                      if (++v12_release >= 8) {
                          v12_state = 2;
                          v12_frame = 0;
                      }
                  } else {
                      v12_release = 0;
                  }
                  if (++v12_frame > 600) v12_state = 3;
                  return;
              }
              if (v12_state != 2) return;
              if (v12_frame++ >= ROWLET_V12_TIMEOUT) {
                  rowlet_try_release_a_frame();
                  v12_state = 3;
                  return;
              }
              /* Two ON frames, four OFF frames; ~10 distinct A presses/second. */
              bool ok = ((v12_frame % 6u) < 2u) ?
                  rowlet_try_inject_a_frame() : rowlet_try_release_a_frame();
              if (!ok) v12_state = 3;
          }

          '''
          m = m[:a] + controller + m[b:]

          # Patch the actual V6 hook block. The V6 patcher uses a multiline display
          # whose formatting differs from the older v12 template. Restrict to run_hook.
          run = m.index('void run_hook(')
          start_block = m.index('        scan_input();\n        rowlet_a_test_tick();\n        run_frame();',run)
          end_statement = '        draw_to_screen(screenId, fb_a, stride, format);'
          end_block = m.index(end_statement,start_block)+len(end_statement)
          old_block = m[start_block:end_block]
          if 'A TEST READY: L+X+Y' not in old_block or old_block.count('draw_to_screen(')!=1:
              raise SystemExit('V12.1 V6 overlay has unexpected structure; stopped before editing')
          m = m[:start_block]+'''        scan_input();
                  run_frame();
                  rowlet_v12_tick();
                  draw_to_screen(screenId, fb_a, stride, format);'''+m[end_block:]

          # Explicitly clear injected A between pulses, so the game sees new key edges.
          # Same mapping and checks as the working V6 injection helper.
          release = r'''
          // ROWLET_V12_1: release the virtual A in the current HID sample.
          bool rowlet_try_release_a_frame(void)
          {
              if (!g_key_addr) return false;
              volatile u32 *base = g_key_addr - (0x28 / 4);
              u32 index = base[0x10 / 4];
              if (index >= 8) return false;
              volatile u32 *sample = base + (0x28 / 4) + index * (0x10 / 4);
              u32 sample_pa = svcConvertVAToPA((const void *)sample, false);
              u32 current_pa = svcConvertVAToPA((const void *)(base + (0x1c / 4)), false);
              if (!sample_pa || !current_pa) return false;
              volatile u32 *s = (volatile u32 *)(sample_pa | 0x80000000u);
              volatile u32 *cur = (volatile u32 *)(current_pa | 0x80000000u);
              s[0] &= ~KEY_A;
              s[1] &= ~KEY_A;
              *cur &= ~KEY_A;
              return true;
          }
          '''
          if h.count('bool rowlet_try_inject_a_frame(void)')!=1:
              raise SystemExit('V12.1 V6 HID injection helper missing; stopped before editing')
          h += release
          if d.count('bool rowlet_try_inject_a_frame(void);')!=1:
              raise SystemExit('V12.1 V6 HID header missing; stopped before editing')
          d += '\n// ROWLET_V12_1\nbool rowlet_try_release_a_frame(void);\n'

          # V5 watcher always ticks, even when overlay is hidden. Report its phase
          # immediately after that tick, so we never show a guessed shiny value.
          f = rep(f, 'use super::rowlet_watch::{Sample, Watch};',
                  'use super::rowlet_watch::{Sample, Watch, Phase};','Rust phase import')
          status = '''    if is_ultra_sun {
                  let phase = match state.rowlet_watch.phase {
                      Phase::Standby => 0,
                      Phase::WaitRowlet => 1,
                      Phase::Verify => 2,
                      Phase::Reverify => 3,
                      Phase::Normal => 4,
                      Phase::Shiny => 5,
                      Phase::Error => 6,
                  };
                  extern "C" { fn rowlet_v12_report(phase: u32); }
                  unsafe { rowlet_v12_report(phase); }
                  let label = match state.rowlet_watch.phase {
                      Phase::Standby | Phase::WaitRowlet => "ROWLET: WAITING",
                      Phase::Verify | Phase::Reverify => "ROWLET: CHECKING",
                      Phase::Normal => "ROWLET: NOT SHINY",
                      Phase::Shiny => "ROWLET: SHINY!",
                      Phase::Error => "ROWLET: ERROR",
                  };
                  pnp::println!("{}", label);
                  return;
              }

          '''
          # Watcher original insertion comes directly from patch/apply_patch.py.
          watcher_end = '            shiny: mon.is_shiny(),\n        });\n    }\n\n'
          f = rep(f, watcher_end, watcher_end+status, 'Rust V5 watcher tick')

          # Write only when all checks above succeeded.
          for p, value in ((main,m),(hid,h),(hdr,d),(frame,f)):
              p.write_text(value)
          print('V12.1 installed from V5 + V6, one-line shiny status, distinct A pulses.')
          PY
          python3 /tmp/rowlet_v12_1_patch.py

      - name: Fix toolchain linker compatibility
        shell: bash
        run: |
          cat > /tmp/rowlet_v12_compat.py <<'PY'
          from pathlib import Path
          ld = Path('3gx/3gx.ld')
          s = ld.read_text()
          if '__tdata_align' not in s:
              needle = 'SORT(CONSTRUCTORS)\n\t\t. = ALIGN(4);'
              if needle not in s:
                  raise RuntimeError('Linker __tdata_align anchor absent')
              s = s.replace(needle,
                            needle + '\n\t\t__tdata_align = .;\n\t\tLONG (ALIGNOF(.tdata));\n\t\t. = ALIGN(4);', 1)
          needle = '\t\t__tls_start = .;\n\t\t. += + SIZEOF(.tdata) + SIZEOF(.tbss);'
          if needle in s:
              s = s.replace(needle,
                            '\t\t. = 8 + ABSOLUTE(ALIGN(ABSOLUTE(. - 8), MAX(4, ALIGNOF(.tdata))));\n'
                            '\t\t__tls_start = .;\n\t\t. += SIZEOF(.tdata) + SIZEOF(.tbss);', 1)
          ld.write_text(s)
          p = Path('3gx/sources/main.c')
          s = p.read_text()
          if '__system_runflags' not in s or '__apt_appid' not in s:
              needle = 'u32 __ctru_linear_heap_size = 0;'
              if needle not in s:
                  raise RuntimeError('libctru definitions anchor absent')
              s = s.replace(needle,
                            needle + '\n\nu32 __system_runflags = 0;\nu32 __apt_appid = 0;', 1)
          p.write_text(s)
          PY
          python3 /tmp/rowlet_v12_compat.py

      - name: Verify installed code
        shell: bash
        run: |
          grep -Fq 'rowlet_v12_tick();' 3gx/sources/main.c
          grep -Fq 'rowlet_try_release_a_frame' 3gx/sources/hid.c
          grep -Fq 'ROWLET: SHINY!' reader_core/src/gen7/frame.rs
          grep -Fq 'ROWLET: NOT SHINY' reader_core/src/gen7/frame.rs
          if grep -Fq 'rowlet_a_test_tick();' 3gx/sources/main.c; then
            echo 'Old V6 hook survived'
