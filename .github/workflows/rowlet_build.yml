
name: Build Rowlet Watch V8.4 Circle Pad Fix

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply V5 detector
        run: python3 patch/apply_patch.py .

      - name: Apply V6 A-button control
        run: python3 patch/apply_input_test.py .

      - name: Apply V7.1 reset control
        run: python3 patch/apply_reset_test.py .

      - name: Apply V8.3 resumable hunter
        run: python3 patch/apply_v8_3.py .

      - name: Fix Circle Pad Up movement for V8.4
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          hid = Path('3gx/sources/hid.c')
          main = Path('3gx/sources/main.c')
          h = hid.read_text()
          m = main.read_text()

          old = 's[3] = (u32)(125u << 16);'
          new = '''s[3] = ((u32)145u << 16);
                  // Circle Pad Up direction flag
                  s[0] |= (1u << 30);
                  s[1] |= (1u << 30);'''

          if h.count(old) != 1:
              raise SystemExit('Circle Pad anchor missing')

          old_pulse = 'if (v8_frames < 28 && !rowlet_v8_inject(0, true))'
          new_pulse = 'if (v8_frames < 32 && !rowlet_v8_inject(0, true))'
          old_end = 'if (v8_frames >= 28) v8_go(4);'
          new_end = 'if (v8_frames >= 32) v8_go(4);'

          if m.count(old_pulse) != 1 or m.count(old_end) != 1:
              raise SystemExit('Movement anchors missing')

          hid.write_text(h.replace(old, new, 1))
          main.write_text(
              m.replace(old_pulse, new_pulse, 1)
               .replace(old_end, new_end, 1)
          )

          print('V8.4 movement fix applied')
          PY

      - name: Compile plugin
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            zaksabeast/devkitarm-rust make

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: rowlet-watch-v8-4-plugin
          path: out/default.3gx
          if-no-files-found: error
