// Hand-pivoting museum-style classroom display, non-locking and non-load-bearing.
$fn=72;
module original(){import("/mnt/data/single_color.stl");}
module cross_y(r,len){rotate([90,0,0]) cylinder(r=r,h=len,center=true);}
// Keep the original shank and head silhouettes wherever possible.
module lower(){intersection(){original();translate([-20,-20,-60])cube([40,40,89.2]);}}
module upper(){intersection(){original();translate([-20,-20,30.6])cube([40,40,30]);}}
module shank(){
 difference(){union(){
  lower();
  // flattened fork: each cheek joins original iron below the cut
  translate([1.3,-1.75,28.8])cube([3.4,1.25,5.8],center=true);
  translate([1.3, 1.75,28.8])cube([3.4,1.25,5.8],center=true);
  translate([1.3,-1.75,30.2])cross_y(2.0,1.25);
  translate([1.3, 1.75,30.2])cross_y(2.0,1.25);
 }translate([1.3,0,30.2])cross_y(1.12,6.0);}
}
module head(){
 difference(){union(){
  upper();
  // central eye and tongue between fork cheeks
  translate([1.3,0,31.3])cube([2.65,1.8,3.4],center=true);
  translate([1.3,0,30.2])cross_y(1.95,1.8);
 }translate([1.3,0,30.2])cross_y(1.12,4.5);}
}
module pin(){
 union(){cross_y(0.95,5.0);translate([0,2.7,0])cross_y(1.55,0.4);}
}
part="shank";
if(part=="shank")shank();
else if(part=="head")head();
else if(part=="pin")pin();
