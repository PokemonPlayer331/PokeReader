
name: Build Rowlet V11.4 Caller and Stick Trace

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rowlet_build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply original Rowlet Watch V5
        run: python3 patch/apply_patch.py .

      - name: Trace CTR Stick caller and object by phase
        shell: bash
        run: |
          cat > /tmp/v114_observer.c <<'C'
          // V11.4: diagnostic of Ultra Sun v1.2 CTR_Stick call sites and input objects.
          // NO synthesized inputs, NO resets, NO changes to the raw stick values.
          #define V114_TITLE 0x00040000001B5000ULL
          #define V114_TARGET 0x004B6DD8u
          #define V114_OP0 0xE92D4070u
          #define V114_OP1 0xE1A04000u
          #define V114_JUMP 0xE51FF004u
          #define V114_GROUPS 8

          // 0 READY; 1 RELEASE CHORD; 2 IDLE; 3 PRESS PHYSICAL UP; 4 DONE; 5 STOP.
          static volatile u32 v114_phase = 0;
          static u32 v114_hook_status = 0;
          static u32 v114_frames = 0;
          static u32 v114_release = 0;
          static u32 v114_page = 0;
          static u32 v114_prev_select = 0;
          static volatile u32 v114_count = 0;
          static volatile u32 v114_overflow = 0;

          typedef struct {
              u32 return_pc; // LR at entry; identifies caller instruction
              u32 object;    // CTR_Stick object; distinguishes instances per caller
              volatile s32 i_min, i_max, m_min, m_max;
              volatile u32 i_n, m_n, i_up, m_up;
          } V114Group;
          static V114Group v114_groups[V114_GROUPS];

          static void v114_clear(void)
          {
              v114_count = 0;
              v114_overflow = 0;
              v114_page = 0;
              for (unsigned i = 0; i < V114_GROUPS; i++) {
                  V114Group *g = &v114_groups[i];
                  g->return_pc = 0;
                  g->object = 0;
                  g->i_min = g->m_min = 32767;
                  g->i_max = g->m_max = -32768;
                  g->i_n = g->m_n = g->i_up = g->m_up = 0;
              }
          }

          // The original function is called with a CTR_Stick object in r0.
          // Its signed raw stick coordinates come from the pointer stored at [r0+8]
          // and offsets +12 (X) / +14 (Y). V11.2 measured this successfully.
          // The original LR is captured by the trampoline before making any calls.
          __attribute__((used, noinline))
          static void v114_capture(const void *ctx, u32 caller_lr)
          {
              const u32 phase = v114_phase;
              if (phase != 2 && phase != 3) return;
              if (!ctx) return;

              const volatile u8 *input =
                  *(const volatile u8 * const volatile *)((const u8 *)ctx + 8);
              if (!input) return;
              const s32 y = (s32)*(const volatile s16 *)(input + 14);
              const u32 caller = caller_lr & ~1u;
              const u32 object = (u32)ctx;
              u32 n = v114_count;
              u32 slot = n;
              for (u32 i = 0; i < n; i++) {
                  if (v114_groups[i].return_pc == caller &&
                      v114_groups[i].object == object) {
                      slot = i;
                      break;
                  }
              }
              if (slot == n) {
                  if (n >= V114_GROUPS) { v114_overflow++; return; }
                  v114_groups[slot].return_pc = caller;
                  v114_groups[slot].object = object;
                  v114_groups[slot].i_min = v114_groups[slot].m_min = 32767;
                  v114_groups[slot].i_max = v114_groups[slot].m_max = -32768;
                  v114_groups[slot].i_n = v114_groups[slot].m_n = 0;
                  v114_groups[slot].i_up = v114_groups[slot].m_up = 0;
                  v114_count = n + 1;
              }
              V114Group *g = &v114_groups[slot];
              if (phase == 2) {
                  if (y < g->i_min) g->i_min = y;
                  if (y > g->i_max) g->i_max = y;
                  if (y > 20) g->i_up++;
                  g->i_n++;
              } else {
                  if (y < g->m_min) g->m_min = y;
                  if (y > g->m_max) g->m_max = y;
                  if (y > 20) g->m_up++;
                  g->m_n++;
              }
          }

          // Keep all registers, including the incoming LR, intact. Replay both
          // original instructions at 0x004B6DD8 and resume at 0x004B6DE0.
          __attribute__((naked, used, noinline, aligned(4)))
          static void v114_trampoline(void)
          {
              __asm__ volatile(
                  ".arm\n"
                  "stmdb sp!, {r0-r3, r12, lr}\n"
                  "mov r1, lr\n"
                  "bl v114_capture\n"
                  "ldmia sp!, {r0-r3, r12, lr}\n"
                  "stmdb sp!, {r4, r5, r6, lr}\n"
                  "mov r4, r0\n"
                  "ldr pc, =0x004B6DE0\n"
              );
          }

          static void v114_install(void)
          {
              if (get_title_id() != V114_TITLE) return;
              v114_clear();
              volatile u32 *code = (volatile u32 *)V114_TARGET;
              if (code[0] != V114_OP0 || code[1] != V114_OP1) {
                  v114_hook_status = 2;
                  return;
              }
              u32 dest = (u32)(void *)v114_trampoline;
              if (dest & 3u) { v114_hook_status = 4; return; }
              u32 pa = svcConvertVAToPA((const void *)V114_TARGET, false);
              if (!pa || (pa & 3u)) { v114_hook_status = 3; return; }
              volatile u32 *p = (volatile u32 *)(pa | 0x80000000u);
              p[1] = dest;
              p[0] = V114_JUMP;
              svcInvalidateEntireInstructionCache();
              v114_hook_status = 1;
          }

          static void v114_tick(void)
          {
              if (get_title_id() != V114_TITLE || v114_hook_status != 1) return;
              const u32 keys = get_current_keys();
              const u32 chord = KEY_L | KEY_R | KEY_Y; // No X trigger!
              if (v114_phase == 0) {
                  if ((keys & chord) == chord && !(keys & KEY_X)) {
                      v114_clear();
                      v114_frames = v114_release = 0;
                      v114_phase = 1;
                  }
                  return;
              }
              if (v114_phase == 4 || v114_phase == 5) {
                  // After the test, tap SELECT to cycle through recorded caller/object pairs.
                  const u32 sel = !!(keys & KEY_SELECT);
                  if (sel && !v114_prev_select && v114_count)
                      v114_page = (v114_page + 1) % v114_count;
                  v114_prev_select = sel;
                  return;
              }
              if (keys & KEY_B) { v114_phase = 5; return; }
              if (v114_phase == 1) {
                  v114_release = keys == 0 ? v114_release + 1 : 0;
                  if (++v114_frames >= 600) { v114_phase = 5; return; }
                  if (v114_release >= 15) {
                      v114_frames = 0;
                      v114_phase = 2;
                  }
                  return;
              }
              if (v114_phase == 2) {
                  if (++v114_frames >= 180) { v114_frames = 0; v114_phase = 3; }
              } else if (v114_phase == 3) {
                  if (++v114_frames >= 180) v114_phase = 4;
              }
          }

          static void v114_overlay(void)
          {
              if (get_title_id() != V114_TITLE) return;
              const char *state = "READY";
              if (v114_hook_status != 1) state = "HOOK ERR";
              else if (v114_phase == 1) state = "RELEASE";
              else if (v114_phase == 2) state = "IDLE";
              else if (v114_phase == 3) state = "UP NOW";
              else if (v114_phase == 4) state = "DONE";
              else if (v114_phase == 5) state = "STOP";

              char buf[64];
              snprintf(buf, sizeof(buf), "V11.4 %s %lu/%lu", state,
                  (unsigned long)(v114_count ? v114_page + 1 : 0),
                  (unsigned long)v114_count);
              host_print((u32)buf, strlen(buf), 0x00ffff);
              if (v114_hook_status != 1) {
                  snprintf(buf, sizeof(buf), "ERR:%lu", (unsigned long)v114_hook_status);
                  host_print((u32)buf, strlen(buf), 0x00ffff);
                  return;
              }
              if (!v114_count) {
                  host_print((u32)"L+R+Y: START", 12, 0x00ffff);
                  host_print((u32)"UP: 2 STEPS", 11, 0x00ffff);
                  host_print((u32)"NO RESET", 8, 0x00ffff);
                  return;
              }
              const V114Group *g = &v114_groups[v114_page];
              snprintf(buf, sizeof(buf), "PC:%08lX %04lX", (unsigned long)g->return_pc,
                  (unsigned long)(g->object & 0xffffu));
              host_print((u32)buf, strlen(buf), 0x00ffff);
              snprintf(buf, sizeof(buf), "I:%ld/%ld n%lu", (long)g->i_min,
                  (long)g->i_max, (unsigned long)g->i_n);
              host_print((u32)buf, strlen(buf), 0x00ffff);
              snprintf(buf, sizeof(buf), "M:%ld/%ld n%lu", (long)g->m_min,
                  (long)g->m_max, (unsigned long)g->m_n);
              host_print((u32)buf, strlen(buf), 0x00ffff);
          }
          C
          cat > /tmp/v114_patch.py <<'PY'
          from pathlib import Path
          main = Path('3gx/sources/main.c')
          s = main.read_text()
          observer = Path('/tmp/v114_observer.c').read_text()
          needle = 'void run_hook('
          if s.count(needle) != 1:
              raise RuntimeError('Expected unique run_hook insertion point')
          s = s.replace(needle, observer + '\n' + needle, 1)
          old = ('        scan_input();\n'
                 '        run_frame();\n'
                 '        draw_to_screen(screenId, fb_a, stride, format);')
          new = ('        scan_input();\n'
                 '        v114_tick();\n'
                 '        run_frame();\n'
                 '        v114_overlay();\n'
                 '        draw_to_screen(screenId, fb_a, stride, format);')
          if s.count(old) != 1:
              raise RuntimeError('Expected original framebuffer hook')
          s = s.replace(old, new, 1)
          old = '    initialize();\n    svcInvalidateEntireInstructionCache();'
          new = '    initialize();\n    v114_install();\n    svcInvalidateEntireInstructionCache();'
          if s.count(old) != 1:
              raise RuntimeError('Expected original initialization hook')
          s = s.replace(old, new, 1)
          main.write_text(s)
          print('V11.4 caller/object diagnostic installed. NO movement injection, NO resets.')
          PY
          python3 /tmp/v114_patch.py

      - name: Fix libctru compatibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          ld = Path('3gx/3gx.ld')
          code = ld.read_text()
          if '__tdata_align' not in code:
              needle = 'SORT(CONSTRUCTORS)\n\t\t. = ALIGN(4);'
              assert needle in code
              code = code.replace(needle, needle + '\n\t\t__tdata_align = .;\n\t\tLONG (ALIGNOF(.tdata));\n\t\t. = ALIGN(4);',1)
          needle = '\t\t__tls_start = .;\n\t\t. += + SIZEOF(.tdata) + SIZEOF(.tbss);'
          if needle in code:
              code = code.replace(needle, '\t\t. = 8 + ABSOLUTE(ALIGN(ABSOLUTE(. - 8), MAX(4, ALIGNOF(.tdata))));\n\t\t__tls_start = .;\n\t\t. += SIZEOF(.tdata) + SIZEOF(.tbss);',1)
          ld.write_text(code)
          src = Path('3gx/sources/main.c')
          code = src.read_text()
          if '__system_runflags' not in code or '__apt_appid' not in code:
              needle = 'u32 __ctru_linear_heap_size = 0;'
              assert needle in code
              code = code.replace(needle, needle + '\n\nu32 __system_runflags = 0;\nu32 __apt_appid = 0;',1)
          src.write_text(code)
          PY

      - name: Compile and save log
        shell: bash
        run: |
          set -o pipefail
          docker run --rm -v "$PWD:/work" -w /work \
            zaksabeast/devkitarm-rust make 2>&1 | tee v114_compile.log

      - name: Upload plugin
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rowlet-v11-4-caller-xy-trace
          path: out/default.3gx
          if-no-files-found: error

      - name: Upload compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rowlet-v11-4-compile-log
          path: v114_compile.log
          if-no-files-found: warn
