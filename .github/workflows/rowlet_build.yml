
#!/usr/bin/env python3
"""Rowlet V10.4 - Luma3DS Wi-Fi movement test.

Requires:
- 2DS XL and computer on the same Wi-Fi
- Luma3DS InputRedirection enabled
- rehid configured for D-pad Up to Circle Pad Up

DRY RUN: No soft reset commands.
"""

import argparse
import socket
import struct
import time

PORT = 4950

# Luma3DS uses active-low button states.
RELEASED = 0x00000FFF

UP = 1 << 6
A = 1 << 0

TOUCH_RELEASED = 0x02000000
CIRCLE_CENTER = 0x007FF7FF
CPP_CENTER = 0x80800081


def packet(keys=0):
    mask = RELEASED & ~keys

    return struct.pack(
        "<IIIII",
        mask,
        TOUCH_RELEASED,
        CIRCLE_CENTER,
        CPP_CENTER,
        0
    )


def send_for(sock, target, keys, duration):
    end = time.monotonic() + duration
    data = packet(keys)

    while time.monotonic() < end:
        sock.sendto(data, target)
        time.sleep(0.02)


def main():
    parser = argparse.ArgumentParser(
        description="Rowlet V10.4 Wi-Fi dry-run controller"
    )

    parser.add_argument(
        "ip",
        help="3DS IP shown in Rosalina InputRedirection"
    )

    parser.add_argument(
        "--walk-seconds",
        type=float,
        default=2.0
    )

    parser.add_argument(
        "--dialog-seconds",
        type=float,
        default=90.0
    )

    args = parser.parse_args()

    if not (
        0 < args.walk_seconds <= 15
        and 0 <= args.dialog_seconds <= 180
    ):
        parser.error("Invalid movement or dialogue duration")

    target = (args.ip, PORT)
    sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)

    print("ROWLET AUTO V10.4")
    print("MODE: DRY RUN")
    print("INPUT: D-PAD + REHID")
    print("AUTOMATIC RESET: DISABLED")
    print("Press Ctrl+C to stop.")

    try:
        print("Starting in 3 seconds...")
        time.sleep(3)

        # Step 1: Walk forward.
        print("STEP 1: D-PAD UP")
        send_for(
            sock,
            target,
            UP,
            args.walk_seconds
        )

        # Release the button.
        send_for(sock, target, 0, 0.5)

        # Step 2: Advance scene and select Rowlet.
        print("STEP 2: PRESSING A")
        print("Watching starter dialogue...")

        end = time.monotonic() + args.dialog_seconds

        while time.monotonic() < end:
            send_for(sock, target, A, 0.14)
            send_for(sock, target, 0, 0.65)

        print("DRY RUN COMPLETED")
        print("No reset sent.")
        print("Check Rowlet Watch for shiny status.")

    except KeyboardInterrupt:
        print("STOPPED BY USER")
        print("No reset sent.")

    finally:
        # Release all controller buttons.
        for _ in range(12):
            sock.sendto(packet(0), target)
            time.sleep(0.02)

        sock.close()


if __name__ == "__main__":
    main()
