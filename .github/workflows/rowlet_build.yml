
name: Build Rowlet V11.2 Raw Stick XY Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply original Rowlet Watch V5
        run: python3 patch/apply_patch.py .

      - name: Instrument exact stick input values
        shell: bash
        run: |
          cat > /tmp/v112.py <<'PY'
          from pathlib import Path
          main = Path('3gx/sources/main.c')
          s = main.read_text()

          observer = r'''
          // V11.2 Ultra Sun v1.2 raw stick diagnostic.
          // No automatic movement, A presses, or resets.
          #define V112_TITLE 0x00040000001B5000ULL
          #define V112_TARGET 0x004B6DD8u
          #define V112_OP0 0xE92D4070u
          #define V112_OP1 0xE1A04000u
          #define V112_JUMP 0xE51FF004u

          // 0 READY, 1 RELEASE, 2 IDLE,
          // 3 UP NOW, 4 DONE, 5 STOP.
          static volatile u32 v112_phase = 0;
          static u32 v112_hook_status = 0;
          static u32 v112_frames = 0;
          static u32 v112_release = 0;

          typedef struct {
              volatile s32 min_x;
              volatile s32 max_x;
              volatile s32 min_y;
              volatile s32 max_y;
              volatile u32 samples;
          } V112Samples;

          static V112Samples v112_idle_samples;
          static V112Samples v112_move_samples;

          static void v112_clear(V112Samples *r)
          {
              r->min_x = 32767;
              r->max_x = -32768;
              r->min_y = 32767;
              r->max_y = -32768;
              r->samples = 0;
          }

          // The original function reads its source
          // pointer at [r0+8], then signed values at
          // source+12 (X) and source+14 (Y).
          __attribute__((used, noinline))
          static void v112_capture(const void *input)
          {
              u32 phase = v112_phase;

              if (phase != 2 && phase != 3)
                  return;

              if (!input)
                  return;

              const volatile s16 *coords =
                  (const volatile s16 *)(
                      (const u8 *)input + 12
                  );

              s32 x = (s32)coords[0];
              s32 y = (s32)coords[1];

              V112Samples *r =
                  phase == 2
                  ? &v112_idle_samples
                  : &v112_move_samples;

              if (x < r->min_x) r->min_x = x;
              if (x > r->max_x) r->max_x = x;
              if (y < r->min_y) r->min_y = y;
              if (y > r->max_y) r->max_y = y;

              r->samples++;
          }

          // Preserve original registers and replay
          // the two instructions being replaced.
          __attribute__((naked, used, noinline, aligned(4)))
          static void v112_trampoline(void)
          {
              __asm__ volatile(
                  ".arm\n"
                  "stmdb sp!, {r0-r3, r12, lr}\n"
                  "ldr r0, [r0, #8]\n"
                  "bl v112_capture\n"
                  "ldmia sp!, {r0-r3, r12, lr}\n"
                  "stmdb sp!, {r4, r5, r6, lr}\n"
                  "mov r4, r0\n"
                  "ldr pc, =0x004B6DE0\n"
              );
          }

          static void v112_install(void)
          {
              if (get_title_id() != V112_TITLE)
                  return;

              volatile u32 *code =
                  (volatile u32 *)V112_TARGET;

              if (code[0] != V112_OP0 ||
                  code[1] != V112_OP1) {
                  v112_hook_status = 2;
                  return;
              }

              u32 dest =
                  (u32)(void *)v112_trampoline;

              if (dest & 3u) {
                  v112_hook_status = 4;
                  return;
              }

              u32 pa = svcConvertVAToPA(
                  (const void *)V112_TARGET,
                  false
              );

              if (!pa || (pa & 3u)) {
                  v112_hook_status = 3;
                  return;
              }

              volatile u32 *p =
                  (volatile u32 *)(
                      pa | 0x80000000u
                  );

              p[1] = dest;
              p[0] = V112_JUMP;

              svcInvalidateEntireInstructionCache();

              v112_hook_status = 1;
          }

          static void v112_tick(void)
          {
              if (get_title_id() != V112_TITLE ||
                  v112_hook_status != 1)
                  return;

              u32 keys = get_current_keys();

              // L + R + Y trigger. No X.
              const u32 trigger =
                  KEY_L | KEY_R | KEY_Y;

              if (v112_phase == 0) {
                  if ((keys & trigger) == trigger &&
                      !(keys & KEY_X)) {

                      v112_clear(&v112_idle_samples);
                      v112_clear(&v112_move_samples);

                      v112_frames = 0;
                      v112_release = 0;
                      v112_phase = 1;
                  }

                  return;
              }

              if (keys & KEY_B) {
                  v112_phase = 5;
                  return;
              }

              if (v112_phase == 1) {
                  v112_release =
                      keys == 0
                      ? v112_release + 1
                      : 0;

                  if (++v112_frames >= 600) {
                      v112_phase = 5;
                      return;
                  }

                  if (v112_release >= 15) {
                      v112_frames = 0;
                      v112_phase = 2;
                  }

                  return;
              }

              if (v112_phase == 2) {
                  // Three seconds standing still.
                  if (++v112_frames >= 180) {
                      v112_frames = 0;
                      v112_phase = 3;
                  }
              }

              else if (v112_phase == 3) {
                  // Three seconds moving physically.
                  if (++v112_frames >= 180)
                      v112_phase = 4;
              }
          }

          static void v112_overlay(void)
          {
              if (get_title_id() != V112_TITLE)
                  return;

              const char *state = "READY";

              if (v112_hook_status == 0)
                  state = "NOT READY";

              if (v112_hook_status == 2)
                  state = "ERR OPCODE";

              if (v112_hook_status == 3)
                  state = "ERR ADDRESS";

              if (v112_hook_status == 4)
                  state = "ERR ALIGN";

              if (v112_hook_status == 1) {
                  if (v112_phase == 1)
                      state = "RELEASE";

                  if (v112_phase == 2)
                      state = "IDLE";

                  if (v112_phase == 3)
                      state = "UP NOW";

                  if (v112_phase == 4)
                      state = "DONE";

                  if (v112_phase == 5)
                      state = "STOP";
              }

              char buf[80];

              snprintf(
                  buf,
                  sizeof(buf),
                  "V11.2 %s",
                  state
              );

              host_print(
                  (u32)buf,
                  strlen(buf),
                  0x00ffff
              );

              if (v112_idle_samples.samples) {
                  snprintf(
                      buf,
                      sizeof(buf),
                      "I X:%ld/%ld Y:%ld/%ld",
                      (long)v112_idle_samples.min_x,
                      (long)v112_idle_samples.max_x,
                      (long)v112_idle_samples.min_y,
                      (long)v112_idle_samples.max_y
                  );
              } else {
                  snprintf(
                      buf,
                      sizeof(buf),
                      "I X:-- Y:--"
                  );
              }

              host_print(
                  (u32)buf,
                  strlen(buf),
                  0x00ffff
              );

              if (v112_move_samples.samples) {
                  snprintf(
                      buf,
                      sizeof(buf),
                      "M X:%ld/%ld Y:%ld/%ld",
                      (long)v112_move_samples.min_x,
                      (long)v112_move_samples.max_x,
                      (long)v112_move_samples.min_y,
                      (long)v112_move_samples.max_y
                  );
              } else {
                  snprintf(
                      buf,
                      sizeof(buf),
                      "M X:-- Y:--"
                  );
              }

              host_print(
                  (u32)buf,
                  strlen(buf),
                  0x00ffff
              );

              snprintf(
                  buf,
                  sizeof(buf),
                  "N:%lu/%lu LRY START",
                  (unsigned long)
                      v112_idle_samples.samples,
                  (unsigned long)
                      v112_move_samples.samples
              );

              host_print(
                  (u32)buf,
                  strlen(buf),
                  0x00ffff
              );
          }
          '''

          needle = 'void run_hook('

          if s.count(needle) != 1:
              raise RuntimeError(
                  'V11.2 run_hook insertion missing'
              )

          s = s.replace(
              needle,
              observer + '\n' + needle,
              1
          )

          old = (
              '        scan_input();\n'
              '        run_frame();\n'
              '        draw_to_screen(screenId, fb_a, stride, format);'
          )

          new = (
              '        scan_input();\n'
              '        v112_tick();\n'
              '        run_frame();\n'
              '        v112_overlay();\n'
              '        draw_to_screen(screenId, fb_a, stride, format);'
          )

          if s.count(old) != 1:
              raise RuntimeError(
                  'V11.2 framebuffer hook missing'
              )

          s = s.replace(old, new, 1)

          old = (
              '    initialize();\n'
              '    svcInvalidateEntireInstructionCache();'
          )

          new = (
              '    initialize();\n'
              '    v112_install();\n'
              '    svcInvalidateEntireInstructionCache();'
          )

          if s.count(old) != 1:
              raise RuntimeError(
                  'V11.2 startup hook missing'
              )

          s = s.replace(old, new, 1)

          main.write_text(s)

          print("V11.2 diagnostic installed")
          print("Input: Physical D-pad + rehid")
          print("Automatic input: DISABLED")
          print("Automatic reset: DISABLED")
          PY

          python3 /tmp/v112.py

      - name: Fix libctru compatibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ld = Path('3gx/3gx.ld')
          code = ld.read_text()

          if '__tdata_align' not in code:
              needle = 'SORT(CONSTRUCTORS)\n\t\t. = ALIGN(4);'
              assert needle in code

              code = code.replace(
                  needle,
                  needle +
                  '\n\t\t__tdata_align = .;'
                  '\n\t\tLONG (ALIGNOF(.tdata));'
                  '\n\t\t. = ALIGN(4);',
                  1
              )

          needle = (
              '\t\t__tls_start = .;\n'
              '\t\t. += + SIZEOF(.tdata) + SIZEOF(.tbss);'
          )

          if needle in code:
              code = code.replace(
                  needle,
                  '\t\t. = 8 + ABSOLUTE(ALIGN('
                  'ABSOLUTE(. - 8), '
                  'MAX(4, ALIGNOF(.tdata))));\n'
                  '\t\t__tls_start = .;\n'
                  '\t\t. += SIZEOF(.tdata) + '
                  'SIZEOF(.tbss);',
                  1
              )

          ld.write_text(code)

          src = Path('3gx/sources/main.c')
          code = src.read_text()

          if (
              '__system_runflags' not in code or
              '__apt_appid' not in code
          ):
              needle = 'u32 __ctru_linear_heap_size = 0;'
              assert needle in code

              code = code.replace(
                  needle,
                  needle +
                  '\n\nu32 __system_runflags = 0;'
                  '\nu32 __apt_appid = 0;',
                  1
              )

          src.write_text(code)
          PY

      - name: Compile and save log
        shell: bash
        run: |
          set -o pipefail
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            zaksabeast/devkitarm-rust make \
            2>&1 | tee v112_compile.log

      - name: Upload plugin
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rowlet-v11-2-xy-diagnostic
          path: out/default.3gx
          if-no-files-found: error

      - name: Upload compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rowlet-v11-2-compile-log
          path: v112_compile.log
          if-no-files-found: warn
