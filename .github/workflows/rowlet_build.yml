
name: Build Rowlet Watch V8.1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply V5 detector
        run: python3 patch/apply_patch.py .

      - name: Apply V6 virtual A
        run: python3 patch/apply_input_test.py .

      - name: Apply V7.1 soft reset
        run: python3 patch/apply_reset_test.py .

      - name: Apply V8.1 navigation
        shell: bash
        run: |
          cat > /tmp/rowlet_v8_patch.py <<'ROWLET_SCRIPT'
          #!/usr/bin/env python3
          from pathlib import Path
          import argparse

          p = argparse.ArgumentParser()
          p.add_argument('root', nargs='?', default='.')
          root = Path(p.parse_args().root).resolve()

          main = root / '3gx/sources/main.c'
          hid = root / '3gx/sources/hid.c'
          header = root / '3gx/includes/hid.h'
          frame = root / 'reader_core/src/gen7/frame.rs'
          watch = root / 'reader_core/src/gen7/rowlet_watch.rs'
          paths = (main, hid, header, frame, watch)

          for path in paths:
              if not path.is_file():
                  raise SystemExit(f'Missing: {path}')

          m,h,d,f,w = [x.read_text() for x in paths]
          MARKER = 'ROWLET_V8_INTEGRATED'

          if any(MARKER in x for x in (m,h,d,f,w)):
              raise SystemExit('V8 already applied')

          def repl(s, old, new, label):
              n = s.count(old)
              if n != 1:
                  raise SystemExit(
                      f'{label}: expected 1 match, got {n}'
                  )
              return s.replace(old, new, 1)

          for label,source,anchor in [
              ('V5 import',f,'use super::rowlet_watch::{Sample, Watch};'),
              ('V5 tick',f,'            shiny: mon.is_shiny(),\n        });'),
              ('V5 phase',w,'if matches!(self.phase, Phase::Normal | Phase::Shiny | Phase::Error) {'),
              ('V6 HID',h,'bool rowlet_try_inject_a_frame(void)'),
              ('V7 HID',h,'bool rowlet_try_inject_reset_frame(void)'),
              ('V7 hook',m,'        rowlet_reset_test_tick();'),
              ('render',m,'        draw_to_screen(screenId, fb_a, stride, format);'),
              ('main hook',m,'void run_hook('),
          ]:
              if anchor not in source:
                  raise SystemExit(f'Missing {label}')

          w = repl(w,
          '''        // Stop states latch. The player must manually soft reset for a new run.
                  if matches!(self.phase, Phase::Normal | Phase::Shiny | Phase::Error) {
                      return;
                  }''',
          '''        // ROWLET_V8_INTEGRATED
                  if self.phase == Phase::Normal {
                      if s.tsv == TSV && s.species == 0 {
                          self.frames = self.frames.saturating_add(1);
                          if self.frames >= EMPTY_FRAMES {
                              let n = self.count;
                              *self = Self::new();
                              self.count = n;
                              self.phase = Phase::WaitRowlet;
                              self.tsv = TSV;
                              self.message = "New empty party confirmed";
                          }
                      } else {
                          self.frames = 0;
                      }
                      return;
                  }
                  if matches!(self.phase, Phase::Shiny | Phase::Error) {
                      return;
                  }''',
          'Rust rearm')

          f = repl(
              f,
              'use super::rowlet_watch::{Sample, Watch};',
              'use super::rowlet_watch::{Sample, Watch, Phase};',
              'Rust import'
          )

          f = repl(f,
          '''            shiny: mon.is_shiny(),
                  });''',
          '''            shiny: mon.is_shiny(),
                  });
                  // ROWLET_V8_INTEGRATED
                  extern "C" {
                      fn rowlet_bot_report(phase: u32, tsv: u32, pid: u32);
                  }
                  let w = &state.rowlet_watch;
                  let phase: u32 = match w.phase {
                      Phase::Standby => 0,
                      Phase::WaitRowlet => 1,
                      Phase::Verify => 2,
                      Phase::Reverify => 3,
                      Phase::Normal => 4,
                      Phase::Shiny => 5,
                      Phase::Error => 6,
                  };
                  unsafe { rowlet_bot_report(phase, w.tsv as u32, w.pid); }''',
          'Rust status report')

          h += r'''
          // ROWLET_V8_INTEGRATED
          bool rowlet_v8_inject(u32 buttons, bool walk_up)
          {
              if (!g_key_addr) return false;

              volatile u32 *base = g_key_addr - (0x28 / 4);
              u32 index = base[0x10 / 4];
              if (index >= 8) return false;

              volatile u32 *sample =
                  base + (0x28 / 4) + index * (0x10 / 4);

              u32 spa = svcConvertVAToPA(
                  (const void *)sample, false
              );
              u32 cpa = svcConvertVAToPA(
                  (const void *)(base + (0x1c / 4)), false
              );

              if (!spa || !cpa) return false;

              volatile u32 *s =
                  (volatile u32 *)(spa | 0x80000000u);
              volatile u32 *cur =
                  (volatile u32 *)(cpa | 0x80000000u);

              if (buttons) {
                  s[0] |= buttons;
                  s[1] |= buttons;
                  *cur |= buttons;
              }

              if (walk_up) {
                  s[3] = (u32)(125u << 16);
              }

              return true;
          }
          '''

          d += '''
          // ROWLET_V8_INTEGRATED
          bool rowlet_v8_inject(u32 buttons, bool walk_up);
          '''

          controller = r'''
          // ROWLET_V8_INTEGRATED
          #include <stdio.h>

          #define V8_TITLE_ID 0x00040000001B5000ULL
          #define V8_TSV 3936u
          #define V8_MAX_RESETS 1
          #define V8_MAX_TITLE_FRAMES 3600u
          #define V8_MAX_TALK_FRAMES 14500u

          static volatile u32 v8_phase = 0;
          static volatile u32 v8_tsv = 0;
          static volatile u32 v8_pid = 0;

          static unsigned v8_state = 0;
          static unsigned v8_frames = 0;
          static unsigned v8_pulse = 0;
          static unsigned v8_hold = 0;
          static unsigned v8_idle = 0;

          static int v8_remaining = 0;
          static unsigned v8_error_stage = 0;
          static bool v8_initialized = false;

          void rowlet_bot_report(u32 phase, u32 tsv, u32 pid)
          {
              v8_phase = phase;
              v8_tsv = tsv;
              v8_pid = pid;
          }

          static void v8_stop(unsigned status)
          {
              if (v8_state >= 8) return;
              if (status == 10)
                  v8_error_stage = v8_state;
              v8_state = status;
              v8_remaining = 0;
          }

          static void v8_go(unsigned state)
          {
              v8_state = state;
              v8_frames = 0;
              v8_pulse = 0;
              v8_idle = 0;
          }

          static bool v8_a_pulse(
              unsigned period,
              unsigned duration
          )
          {
              if ((v8_frames % period) < duration)
                  return rowlet_v8_inject(KEY_A, false);
              return true;
          }

          static void rowlet_v8_tick(void)
          {
              if (get_title_id() != V8_TITLE_ID)
                  return;

              const u32 keys = get_current_keys();
              const u32 arm = KEY_L | KEY_X | KEY_DUP;
              const u32 stop = KEY_L | KEY_X | KEY_DDOWN;

              if (keys == stop) {
                  v8_stop(8);
                  return;
              }

              if (!v8_initialized) {
                  v8_initialized = true;
                  v8_remaining = 0;
              }

              if (v8_state >= 8)
                  return;

              if (v8_state == 0) {
                  v8_hold = (keys == arm)
                      ? v8_hold + 1 : 0;

                  if (v8_hold >= 60) {
                      v8_hold = 0;
                      v8_remaining = V8_MAX_RESETS;
                      v8_go(1);
                  }
                  return;
              }

              if (v8_state == 1) {
                  v8_idle = (keys == 0)
                      ? v8_idle + 1 : 0;

                  if (v8_idle >= 15)
                      v8_go(2);

                  if (++v8_frames >= 900)
                      v8_stop(10);

                  return;
              }

              if (keys != 0) {
                  v8_stop(8);
                  return;
              }

              if (v8_phase == 5) {
                  v8_stop(9);
                  return;
              }

              if (v8_phase == 6) {
                  v8_stop(10);
                  return;
              }

              ++v8_frames;

              if (v8_state == 2 || v8_state == 7) {
                  if (v8_phase == 1 &&
                      v8_tsv == V8_TSV) {
                      v8_go(3);
                      return;
                  }

                  if (v8_frames > V8_MAX_TITLE_FRAMES) {
                      v8_stop(10);
                      return;
                  }

                  if (!v8_a_pulse(105, 6))
                      v8_stop(10);

                  return;
              }

              if (v8_state == 3) {
                  if (v8_phase != 1 ||
                      v8_tsv != V8_TSV) {
                      if (v8_phase >= 2 &&
                          v8_phase <= 4)
                          v8_go(5);
                      else
                          v8_stop(10);
                      return;
                  }

                  if (v8_frames < 28 &&
                      !rowlet_v8_inject(0, true)) {
                      v8_stop(10);
                      return;
                  }

                  if (v8_frames >= 28)
                      v8_go(4);

                  return;
              }

              if (v8_state == 4) {
                  if (v8_phase >= 2 &&
                      v8_phase <= 4) {
                      v8_go(5);
                      return;
                  }

                  if (v8_phase != 1 ||
                      v8_tsv != V8_TSV ||
                      v8_frames > V8_MAX_TALK_FRAMES) {
                      v8_stop(10);
                      return;
                  }

                  if (!v8_a_pulse(35, 6))
                      v8_stop(10);

                  return;
              }

              if (v8_state == 5) {
                  if (v8_phase == 4 &&
                      v8_tsv == V8_TSV &&
                      v8_pid != 0) {

                      if (v8_remaining <= 0) {
                          v8_stop(8);
                          return;
                      }

                      --v8_remaining;
                      v8_go(6);
                      return;
                  }

                  if (v8_frames > 500)
                      v8_stop(10);

                  return;
              }

              if (v8_state == 6) {
                  if (!rowlet_v8_inject(
                      KEY_L | KEY_R | KEY_START,
                      false)) {
                      v8_stop(10);
                      return;
                  }

                  if (v8_frames >= 45)
                      v8_stop(8);

                  return;
              }
          }

          static void rowlet_v8_overlay(void)
          {
              if (get_title_id() != V8_TITLE_ID)
                  return;

              char buf[160];
              const char *status = "OFF - L+X+UP";

              switch (v8_state) {
              case 1: status = "RELEASE BUTTONS"; break;
              case 2: status = "LOADING SAVE"; break;
              case 3: status = "WALKING INTO GRASS"; break;
              case 4: status = "SELECTING ROWLET"; break;
              case 5: status = "VERIFYING SHINY"; break;
              case 6: status = "RESETTING"; break;
              case 7: status = "WAITING AFTER RESET"; break;
              case 8: status = "STOPPED"; break;
              case 9: status = "SHINY! STOPPED"; break;
              case 10: status = "ERROR! STOPPED"; break;
              }

              snprintf(
                  buf,
                  sizeof(buf),
                  "V8.1 %s | R:%d P:%lu E:%u",
                  status,
                  v8_remaining,
                  (unsigned long)v8_phase,
                  v8_error_stage
              );

              host_print(
                  (u32)buf,
                  strlen(buf),
                  0x00FF00
              );
          }
          '''

          m = repl(
              m,
              'void run_hook(',
              controller + 'void run_hook(',
              'Controller'
          )

          m = repl(
              m,
              '        rowlet_reset_test_tick();',
              '        rowlet_reset_test_tick();\n'
              '        rowlet_v8_tick();',
              'Frame tick'
          )

          m = repl(
              m,
              '        draw_to_screen(screenId, fb_a, stride, format);',
              '        rowlet_v8_overlay();\n'
              '        draw_to_screen(screenId, fb_a, stride, format);',
              'Overlay'
          )

          for path, data in zip(paths, (m,h,d,f,w)):
              path.write_text(data)

          print('V8.1 patch installed.')
          print('One reset maximum.')
          print('No automatic rearming after restart.')
          ROWLET_SCRIPT
          python3 /tmp/rowlet_v8_patch.py .

      - name: Compile
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            zaksabeast/devkitarm-rust make

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: rowlet-watch-v8-plugin
          path: out/default.3gx
          if-no-files-found: error
