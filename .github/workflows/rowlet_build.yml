
name: Build Rowlet V11.1 Stick Trace Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply original Rowlet Watch V5
        run: python3 patch/apply_patch.py .

      - name: Instrument candidate stick routine
        shell: bash
        run: |
          cat > /tmp/v111.py <<'PY'
          from pathlib import Path

          main = Path('3gx/sources/main.c')
          s = main.read_text()

          observer = r'''
          // V11.1 diagnostic, USA Ultra Sun v1.2.
          #define V111_TITLE 0x00040000001B5000ULL
          #define V111_TARGET 0x004B6DD8u
          #define V111_OP0 0xE92D4070u
          #define V111_OP1 0xE1A04000u
          #define V111_JUMP 0xE51FF004u

          __attribute__((used))
          static volatile u32 v111_hits = 0;

          static unsigned v111_hook_status = 0;

          __attribute__((naked, used, noinline, aligned(4)))
          static void v111_trampoline(void)
          {
              __asm__ volatile(
                  ".arm\n"
                  "stmdb sp!, {r0-r3, r12, lr}\n"
                  "ldr r12, =v111_hits\n"
                  "ldr r0, [r12]\n"
                  "add r0, r0, #1\n"
                  "str r0, [r12]\n"
                  "ldmia sp!, {r0-r3, r12, lr}\n"
                  "stmdb sp!, {r4, r5, r6, lr}\n"
                  "mov r4, r0\n"
                  "ldr pc, =0x004B6DE0\n"
              );
          }

          static void v111_install(void)
          {
              if (get_title_id() != V111_TITLE)
                  return;

              volatile u32 *code =
                  (volatile u32 *)V111_TARGET;

              if (
                  code[0] != V111_OP0 ||
                  code[1] != V111_OP1
              ) {
                  v111_hook_status = 2;
                  return;
              }

              u32 dest =
                  (u32)(void *)v111_trampoline;

              if (dest & 3u) {
                  v111_hook_status = 4;
                  return;
              }

              u32 pa = svcConvertVAToPA(
                  (const void *)V111_TARGET,
                  false
              );

              if (!pa || (pa & 3u)) {
                  v111_hook_status = 3;
                  return;
              }

              volatile u32 *p =
                  (volatile u32 *)(
                      pa | 0x80000000u
                  );

              // Installed at startup, before
              // normal gameplay begins.
              p[1] = dest;
              p[0] = V111_JUMP;

              svcInvalidateEntireInstructionCache();

              v111_hook_status = 1;
          }

          // 0 READY
          // 1 RELEASE
          // 2 IDLE
          // 3 STEP NOW
          // 4 DONE
          // 5 STOPPED

          static unsigned v111_phase = 0;
          static unsigned v111_frames = 0;
          static unsigned v111_release = 0;

          static u32 v111_begin = 0;
          static u32 v111_walk_begin = 0;
          static u32 v111_idle = 0;
          static u32 v111_walk = 0;

          static void v111_tick(void)
          {
              if (
                  get_title_id() != V111_TITLE ||
                  v111_hook_status != 1
              )
                  return;

              u32 keys = get_current_keys();

              // No X-button trigger.
              const u32 trigger =
                  KEY_L | KEY_R | KEY_Y;

              if (v111_phase == 0) {
                  if (
                      (keys & trigger) == trigger &&
                      !(keys & KEY_X)
                  ) {
                      v111_release = 0;
                      v111_frames = 0;
                      v111_idle = 0;
                      v111_walk = 0;
                      v111_phase = 1;
                  }

                  return;
              }

              if (keys & KEY_B) {
                  v111_phase = 5;
                  return;
              }

              if (v111_phase == 1) {
                  v111_release =
                      keys == 0
                      ? v111_release + 1
                      : 0;

                  if (++v111_frames >= 600) {
                      v111_phase = 5;
                      return;
                  }

                  if (v111_release >= 15) {
                      v111_begin = v111_hits;
                      v111_frames = 0;
                      v111_phase = 2;
                  }

                  return;
              }

              if (v111_phase == 2) {
                  // Count calls while standing still.
                  v111_idle =
                      v111_hits - v111_begin;

                  if (++v111_frames >= 180) {
                      v111_walk_begin = v111_hits;
                      v111_frames = 0;
                      v111_phase = 3;
                  }

                  return;
              }

              if (v111_phase == 3) {
                  // Count calls during physical Up.
                  v111_walk =
                      v111_hits - v111_walk_begin;

                  if (++v111_frames >= 180)
                      v111_phase = 4;
              }
          }

          static void v111_overlay(void)
          {
              if (get_title_id() != V111_TITLE)
                  return;

              const char *phase = "READY";

              if (v111_hook_status == 0)
                  phase = "NOT READY";

              if (v111_hook_status == 2)
                  phase = "ERR: OPCODE";

              if (v111_hook_status == 3)
                  phase = "ERR: ADDRESS";

              if (v111_hook_status == 4)
                  phase = "ERR: ALIGN";

              if (v111_hook_status == 1) {
                  if (v111_phase == 1)
                      phase = "RELEASE";

                  if (v111_phase == 2)
                      phase = "IDLE";

                  if (v111_phase == 3)
                      phase = "STEP NOW";

                  if (v111_phase == 4)
                      phase = "DONE";

                  if (v111_phase == 5)
                      phase = "STOPPED";
              }

              char buf[48];

              host_print(
                  (u32)"V11.1 STICK TRACE",
                  17,
                  0x00ffff
              );

              host_print(
                  (u32)"L+R+Y / B:STOP",
                  14,
                  0x00ffff
              );

              snprintf(
                  buf,
                  sizeof(buf),
                  "STATE:%s",
                  phase
              );

              host_print(
                  (u32)buf,
                  strlen(buf),
                  0x00ffff
              );

              snprintf(
                  buf,
                  sizeof(buf),
                  "ID:%lu MV:%lu",
                  (unsigned long)v111_idle,
                  (unsigned long)v111_walk
              );

              host_print(
                  (u32)buf,
                  strlen(buf),
                  0x00ffff
              );
          }
          '''

          needle = 'void run_hook('

          if s.count(needle) != 1:
              raise RuntimeError(
                  'V11.1 run_hook insertion point missing'
              )

          s = s.replace(
              needle,
              observer + '\n' + needle,
              1
          )

          old = (
              '        scan_input();\n'
              '        run_frame();\n'
              '        draw_to_screen(screenId, fb_a, stride, format);'
          )

          new = (
              '        scan_input();\n'
              '        v111_tick();\n'
              '        run_frame();\n'
              '        v111_overlay();\n'
              '        draw_to_screen(screenId, fb_a, stride, format);'
          )

          if s.count(old) != 1:
              raise RuntimeError(
                  'V11.1 framebuffer hook not found'
              )

          s = s.replace(old, new, 1)

          old = (
              '    initialize();\n'
              '    svcInvalidateEntireInstructionCache();'
          )

          new = (
              '    initialize();\n'
              '    v111_install();\n'
              '    svcInvalidateEntireInstructionCache();'
          )

          if s.count(old) != 1:
              raise RuntimeError(
                  'V11.1 startup hook not found'
              )

          s = s.replace(old, new, 1)

          main.write_text(s)

          print("V11.1 diagnostic installed")
          print("No automatic inputs or resets")
          PY

          python3 /tmp/v111.py

      - name: Fix libctru compatibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ld = Path('3gx/3gx.ld')
          code = ld.read_text()

          if '__tdata_align' not in code:
              needle = (
                  'SORT(CONSTRUCTORS)\n'
                  '\t\t. = ALIGN(4);'
              )
              assert needle in code
              code = code.replace(
                  needle,
                  needle +
                  '\n\t\t__tdata_align = .;'
                  '\n\t\tLONG (ALIGNOF(.tdata));'
                  '\n\t\t. = ALIGN(4);',
                  1
              )

          needle = (
              '\t\t__tls_start = .;\n'
              '\t\t. += + SIZEOF(.tdata) + SIZEOF(.tbss);'
          )

          if needle in code:
              code = code.replace(
                  needle,
                  '\t\t. = 8 + ABSOLUTE(ALIGN('
                  'ABSOLUTE(. - 8), '
                  'MAX(4, ALIGNOF(.tdata))));\n'
                  '\t\t__tls_start = .;\n'
                  '\t\t. += SIZEOF(.tdata) + SIZEOF(.tbss);',
                  1
              )

          ld.write_text(code)

          src = Path('3gx/sources/main.c')
          code = src.read_text()

          if (
              '__system_runflags' not in code or
              '__apt_appid' not in code
          ):
              needle = (
                  'u32 __ctru_linear_heap_size = 0;'
              )

              assert needle in code

              code = code.replace(
                  needle,
                  needle +
                  '\n\nu32 __system_runflags = 0;'
                  '\nu32 __apt_appid = 0;',
                  1
              )

          src.write_text(code)
          PY

      - name: Compile and save log
        shell: bash
        run: |
          set -o pipefail
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            zaksabeast/devkitarm-rust make \
            2>&1 | tee v111_compile.log

      - name: Upload plugin
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rowlet-v11-1-stick-trace
          path: out/default.3gx
          if-no-files-found: error

      - name: Upload compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rowlet-v11-1-compile-log
          path: v111_compile.log
          if-no-files-found: warn
