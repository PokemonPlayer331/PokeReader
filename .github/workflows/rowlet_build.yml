
name: Build Rowlet V10.8 Analog Circle Pad + A DRY RUN

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Rowlet Watch V5
        run: python3 patch/apply_patch.py .

      - name: Apply original V6 virtual A test
        run: python3 patch/apply_input_test.py .

      - name: Combine V6 input with analog Circle Pad and A test
        shell: bash
        run: |
          cat > /tmp/v108.py <<'PY'
          from pathlib import Path

          main = Path('3gx/sources/main.c')
          hid = Path('3gx/sources/hid.c')
          header = Path('3gx/includes/hid.h')
          m = main.read_text()
          h = hid.read_text()
          d = header.read_text()

          def once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise RuntimeError(
                      f'{label}: expected 1 anchor, found {count}'
                  )
              return source.replace(old, new, 1)

          # Preserve the working V6 virtual A injection.
          # Add separate analog movement injection.
          # No background HID thread.
          h = once(
              h,
              '#include "common.h"',
              '#include "common.h"\n#include "csvc.h"',
              'csvc header'
          )

          h += r'''
          // V10.8: V6-style virtual button injection.
          bool rowlet_v108_inject(u32 bits)
          {
              if (!g_key_addr) return false;

              bits &= (KEY_A | KEY_DUP);
              if (!bits) return false;

              volatile u32 *base =
                  g_key_addr - (0x28 / 4);

              u32 index = base[0x10 / 4];
              if (index >= 8) return false;

              volatile u32 *sample =
                  base + (0x28 / 4)
                  + index * (0x10 / 4);

              u32 sample_pa = svcConvertVAToPA(
                  (const void *)sample,
                  false
              );

              u32 current_pa = svcConvertVAToPA(
                  (const void *)(base + (0x1c / 4)),
                  false
              );

              if (!sample_pa || !current_pa)
                  return false;

              volatile u32 *s =
                  (volatile u32 *)(
                      sample_pa | 0x80000000u
                  );

              volatile u32 *cur =
                  (volatile u32 *)(
                      current_pa | 0x80000000u
                  );

              s[0] |= bits;
              s[1] |= bits;
              *cur |= bits;

              return true;
          }
          '''

          # Circle Pad analog movement test.
          # HID sample +0x0C stores X and Y.
          # Positive Y represents Up.
          h += r'''
          bool rowlet_v108_analog_up(void)
          {
              if (!g_key_addr)
                  return false;

              volatile u32 *base =
                  g_key_addr - (0x28 / 4);

              u32 index = base[0x10 / 4];

              if (index >= 8)
                  return false;

              volatile u32 *sample =
                  base + (0x28 / 4)
                  + index * (0x10 / 4);

              u32 pa = svcConvertVAToPA(
                  (const void *)sample,
                  false
              );

              if (!pa)
                  return false;

              volatile u32 *s =
                  (volatile u32 *)(
                      pa | 0x80000000u
                  );

              // Preserve analog X.
              // Set analog Y to +156 (Up).
              s[3] =
                  (s[3] & 0x0000ffffu)
                  | 0x009c0000u;

              // Derived Circle Pad Up state.
              s[0] |= (1u << 30);

              return true;
          }
          '''

          d += '\nbool rowlet_v108_inject(u32 bits);\n'
          d += 'bool rowlet_v108_analog_up(void);\n'

          controller = r'''
          // V10.8 one-cycle dry run.
          // 0 READY
          // 1 RELEASE
          // 2 ANALOG UP
          // 3 PRESS A
          // 4 DONE
          // 5 STOP

          static unsigned v108_state = 0;
          static unsigned v108_frames = 0;
          static unsigned v108_idle = 0;
          static unsigned v108_up_calls = 0;
          static unsigned v108_a_calls = 0;

          static const char *v108_error = "";

          #define V108_TITLE 0x00040000001B5000ULL

          static void v108_set(unsigned state)
          {
              v108_state = state;
              v108_frames = 0;
          }

          static void rowlet_v108_tick(void)
          {
              if (get_title_id() != V108_TITLE)
                  return;

              const u32 keys = get_current_keys();

              // Activation: L + R + Y.
              // No X-button injection.
              const u32 start =
                  KEY_L | KEY_R | KEY_Y;

              if (v108_state == 0) {
                  if (
                      (keys & start) == start &&
                      !(keys & KEY_X)
                  ) {
                      v108_up_calls = 0;
                      v108_a_calls = 0;
                      v108_idle = 0;
                      v108_set(1);
                  }

                  return;
              }

              // Emergency stop: B.
              if (keys & KEY_B) {
                  v108_error = "MANUAL STOP";
                  v108_set(5);
                  return;
              }

              if (v108_state >= 4)
                  return;

              if (v108_state == 1) {
                  // Wait for activation buttons
                  // to be released.
                  v108_idle =
                      (keys == 0)
                      ? v108_idle + 1
                      : 0;

                  if (v108_idle >= 15) {
                      v108_set(2);
                  }

                  if (++v108_frames > 600) {
                      v108_error = "RELEASE TIMEOUT";
                      v108_set(5);
                  }

                  return;
              }

              // Stop on unexpected inputs.
              if (
                  (keys & ~(KEY_DUP | KEY_A)) != 0
              ) {
                  v108_error = "OTHER KEY PRESSED";
                  v108_set(5);
                  return;
              }

              if (v108_state == 2) {
                  // Attempt analog Circle Pad Up
                  // for 120 rendered frames.

                  if (v108_frames < 120) {
                      if (!rowlet_v108_analog_up()) {
                          v108_error = "ANALOG FAILED";
                          v108_set(5);
                          return;
                      }

                      ++v108_up_calls;
                  } else {
                      v108_set(3);
                      return;
                  }
              }

              else if (v108_state == 3) {
                  // Preserve the virtual A technique.
                  // Ten short A pulses.

                  if (v108_frames < 350) {
                      if ((v108_frames % 35) < 6) {
                          if (
                              !rowlet_v108_inject(KEY_A)
                          ) {
                              v108_error = "A INJECT FAILED";
                              v108_set(5);
                              return;
                          }

                          ++v108_a_calls;
                      }
                  } else {
                      v108_set(4);
                      return;
                  }
              }

              ++v108_frames;
          }

          static void rowlet_v108_overlay(void)
          {
              if (get_title_id() != V108_TITLE)
                  return;

              const char *state = "READY";

              if (v108_state == 1)
                  state = "RELEASE";

              if (v108_state == 2)
                  state = "ANALOG UP";

              if (v108_state == 3)
                  state = "PRESS A";

              if (v108_state == 4)
                  state = "DONE";

              if (v108_state == 5)
                  state = "STOP/ERROR";

              char buf[64];

              host_print(
                  (u32)"ROWLET V10.8 DRY",
                  16,
                  0x00ffff
              );

              host_print(
                  (u32)"L+R+Y: START",
                  12,
                  0x00ffff
              );

              snprintf(
                  buf,
                  sizeof(buf),
                  "STATE: %s",
                  state
              );

              host_print(
                  (u32)buf,
                  strlen(buf),
                  0x00ffff
              );

              snprintf(
                  buf,
                  sizeof(buf),
                  "UP:%u A:%u",
                  v108_up_calls,
                  v108_a_calls
              );

              host_print(
                  (u32)buf,
                  strlen(buf),
                  0x00ffff
              );
          }
          '''

          m = once(
              m,
              'void run_hook(',
              controller + '\nvoid run_hook(',
              'controller location'
          )

          # Replace original V6 test execution.
          # Put counters on main PokeReader popup.
          hook_start = (
              '        scan_input();\n'
              '        rowlet_a_test_tick();\n'
              '        run_frame();'
          )

          hook_end = (
              '        draw_to_screen('
              'screenId, fb_a, stride, format);'
          )

          if (
              m.count(hook_start) != 1
              or m.count(hook_end) != 1
          ):
              raise RuntimeError(
                  'Expected unique V6 overlay hook not found'
              )

          a = m.index(hook_start)
          b = (
              m.index(hook_end, a)
              + len(hook_end)
          )

          m = (
              m[:a]
              + '        scan_input();\n'
              + '        rowlet_v108_tick();\n'
              + '        run_frame();\n'
              + '        rowlet_v108_overlay();\n'
              + hook_end
              + m[b:]
          )

          main.write_text(m)
          hid.write_text(h)
          header.write_text(d)

          print("V10.8 analog input test patched")
          print("Trigger: L + R + Y")
          print("Movement: Analog Circle Pad Up")
          print("Virtual A: Enabled")
          print("Automatic reset: DISABLED")
          PY

          python3 /tmp/v108.py

      - name: Fix libctru 2.4.1 compatibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ld = Path('3gx/3gx.ld')
          code = ld.read_text()

          if '__tdata_align' not in code:
              needle = (
                  'SORT(CONSTRUCTORS)\n'
                  '\t\t. = ALIGN(4);'
              )

              assert needle in code

              code = code.replace(
                  needle,
                  needle
                  + '\n\t\t__tdata_align = .;'
                  + '\n\t\tLONG (ALIGNOF(.tdata));'
                  + '\n\t\t. = ALIGN(4);',
                  1
              )

          needle = (
              '\t\t__tls_start = .;\n'
              '\t\t. += + SIZEOF(.tdata) '
              '+ SIZEOF(.tbss);'
          )

          if needle in code:
              code = code.replace(
                  needle,
                  '\t\t. = 8 + ABSOLUTE(ALIGN('
                  'ABSOLUTE(. - 8), '
                  'MAX(4, ALIGNOF(.tdata))));\n'
                  '\t\t__tls_start = .;\n'
                  '\t\t. += SIZEOF(.tdata) '
                  '+ SIZEOF(.tbss);',
                  1
              )

          ld.write_text(code)

          src = Path('3gx/sources/main.c')
          code = src.read_text()

          if (
              '__system_runflags' not in code
              or '__apt_appid' not in code
          ):
              needle = (
                  'u32 __ctru_linear_heap_size = 0;'
              )

              assert needle in code

              code = code.replace(
                  needle,
                  needle
                  + '\n\nu32 __system_runflags = 0;'
                  + '\nu32 __apt_appid = 0;',
                  1
              )

          src.write_text(code)
          PY

      - name: Compile with log
        shell: bash
        run: |
          set -o pipefail
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            zaksabeast/devkitarm-rust make \
            2>&1 | tee v108_compile.log

      - name: Upload plugin
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rowlet-v10-8-dry-test
          path: out/default.3gx
          if-no-files-found: error

      - name: Upload compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rowlet-v10-8-compile-log
          path: v108_compile.log
          if-no-files-found: warn
