
name: Build Rowlet V10.6 V6 Input Bridge DRY RUN

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Rowlet Watch V5
        run: python3 patch/apply_patch.py .

      - name: Apply original V6 virtual A test
        run: python3 patch/apply_input_test.py .

      - name: Combine V6 input with short D-pad and A test
        shell: bash
        run: |
          cat > /tmp/v106.py <<'PY'
          from pathlib import Path

          main = Path('3gx/sources/main.c')
          hid = Path('3gx/sources/hid.c')
          header = Path('3gx/includes/hid.h')
          m = main.read_text()
          h = hid.read_text()
          d = header.read_text()

          def once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected 1 anchor, found {count}')
              return source.replace(old, new, 1)

          # Reuse the V6 virtual input method.
          # No background HID thread or automatic resets.
          h = once(h, '#include "common.h"',
                   '#include "common.h"\n#include "csvc.h"', 'csvc header')
          h += r'''
          // V10.6: V6-style single-frame button injection.
          // Experimental: a successful write is not proof
          // that Ultra Sun or rehid received a button.
          bool rowlet_v106_inject(u32 bits)
          {
              if (!g_key_addr) return false;
              bits &= (KEY_A | KEY_DUP);
              if (!bits) return false;
              volatile u32 *base = g_key_addr - (0x28 / 4);
              u32 index = base[0x10 / 4];
              if (index >= 8) return false;
              volatile u32 *sample = base + (0x28 / 4) + index * (0x10 / 4);
              u32 sample_pa = svcConvertVAToPA((const void *)sample, false);
              u32 current_pa = svcConvertVAToPA(
                  (const void *)(base + (0x1c / 4)), false);
              if (!sample_pa || !current_pa) return false;
              volatile u32 *s = (volatile u32 *)(sample_pa | 0x80000000u);
              volatile u32 *cur = (volatile u32 *)(current_pa | 0x80000000u);
              s[0] |= bits;
              s[1] |= bits;
              *cur |= bits;
              return true;
          }
          '''
          d += '\nbool rowlet_v106_inject(u32 bits);\n'

          controller = r'''
          // V10.6 manual, one-cycle dry run.
          // 0 READY, 1 RELEASE, 2 UP, 3 A, 4 DONE, 5 STOP.
          static unsigned v106_state = 0;
          static unsigned v106_frames = 0;
          static unsigned v106_idle = 0;
          static unsigned v106_up_calls = 0;
          static unsigned v106_a_calls = 0;
          static const char *v106_error = "";
          #define V106_TITLE 0x00040000001B5000ULL

          static void v106_set(unsigned state)
          {
              v106_state = state;
              v106_frames = 0;
          }

          static void rowlet_v106_tick(void)
          {
              if (get_title_id() != V106_TITLE) return;
              const u32 keys = get_current_keys();
              const u32 start = KEY_L | KEY_X | KEY_Y;

              if (v106_state == 0) {
                  if (keys == start) {
                      v106_up_calls = 0;
                      v106_a_calls = 0;
                      v106_idle = 0;
                      v106_set(1);
                  }
                  return;
              }

              // Physical B is the emergency stop.
              if (keys & KEY_B) {
                  v106_error = "MANUAL STOP";
                  v106_set(5);
                  return;
              }

              if (v106_state >= 4) return;

              if (v106_state == 1) {
                  v106_idle = (keys == 0) ? v106_idle + 1 : 0;
                  if (v106_idle >= 15) v106_set(2);
                  if (++v106_frames > 600) {
                      v106_error = "RELEASE TIMEOUT";
                      v106_set(5);
                  }
                  return;
              }

              // Ignore residual virtual A and D-pad Up.
              if ((keys & ~(KEY_DUP | KEY_A)) != 0) {
                  v106_error = "OTHER KEY PRESSED";
                  v106_set(5);
                  return;
              }

              if (v106_state == 2) {
                  // Attempt D-pad Up for 120 rendered frames.
                  if (v106_frames < 120) {
                      if (!rowlet_v106_inject(KEY_DUP)) {
                          v106_error = "UP INJECT FAILED";
                          v106_set(5);
                          return;
                      }
                      ++v106_up_calls;
                  } else {
                      v106_set(3);
                      return;
                  }
              } else if (v106_state == 3) {
                  // 10 short A pulses, no continuous loop.
                  if (v106_frames < 350) {
                      if ((v106_frames % 35) < 6) {
                          if (!rowlet_v106_inject(KEY_A)) {
                              v106_error = "A INJECT FAILED";
                              v106_set(5);
                              return;
                          }
                          ++v106_a_calls;
                      }
                  } else {
                      v106_set(4);
                      return;
                  }
              }

              ++v106_frames;
          }

          static void rowlet_v106_overlay(void)
          {
              if (get_title_id() != V106_TITLE) return;

              const char *state = "READY L+X+Y";
              if (v106_state == 1) state = "RELEASE BUTTONS";
              if (v106_state == 2) state = "UP INJECTION ATTEMPT";
              if (v106_state == 3) state = "A INJECTION ATTEMPT";
              if (v106_state == 4) state = "DRY RUN FINISHED";
              if (v106_state == 5) state = v106_error;

              char buf[128];
              snprintf(buf, sizeof(buf),
                       "V10.6 DRY / NO RESET: %s", state);
              host_print((u32)buf, strlen(buf), 0x00ffff);

              snprintf(buf, sizeof(buf),
                       "UP frames: %u  A frames: %u",
                       v106_up_calls, v106_a_calls);
              host_print((u32)buf, strlen(buf), 0x00ffff);

              host_print(
                  (u32)"B: STOP / INPUT NOT VERIFIED",
                  28, 0x00ffff
              );
          }
          '''

          m = once(
              m, 'void run_hook(',
              controller + '\nvoid run_hook(',
              'controller location'
          )

          # Replace the original V6 diagnostic block.
          # Show all status information on the main popup.
          hook_start = (
              '        scan_input();\n'
              '        rowlet_a_test_tick();\n'
              '        run_frame();'
          )
          hook_end = (
              '        draw_to_screen(screenId, fb_a, stride, format);'
          )

          if m.count(hook_start) != 1 or m.count(hook_end) != 1:
              raise RuntimeError('Expected unique V6 overlay hook not found')

          a = m.index(hook_start)
          b = m.index(hook_end, a) + len(hook_end)
          m = (
              m[:a]
              + '        scan_input();\n'
              + '        rowlet_v106_tick();\n'
              + '        run_frame();\n'
              + '        rowlet_v106_overlay();\n'
              + hook_end
              + m[b:]
          )

          main.write_text(m)
          hid.write_text(h)
          header.write_text(d)

          print('V10.6 V6-style input bridge patched')
          print('Dry run: no automatic resets')
          PY

          python3 /tmp/v106.py

      - name: Fix libctru 2.4.1 compatibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ld = Path('3gx/3gx.ld')
          code = ld.read_text()

          if '__tdata_align' not in code:
              needle = 'SORT(CONSTRUCTORS)\n\t\t. = ALIGN(4);'
              assert needle in code

              code = code.replace(
                  needle,
                  needle
                  + '\n\t\t__tdata_align = .;'
                  + '\n\t\tLONG (ALIGNOF(.tdata));'
                  + '\n\t\t. = ALIGN(4);',
                  1
              )

          needle = (
              '\t\t__tls_start = .;\n'
              '\t\t. += + SIZEOF(.tdata) + SIZEOF(.tbss);'
          )

          if needle in code:
              code = code.replace(
                  needle,
                  '\t\t. = 8 + ABSOLUTE(ALIGN('
                  'ABSOLUTE(. - 8), MAX(4, ALIGNOF(.tdata))));\n'
                  '\t\t__tls_start = .;\n'
                  '\t\t. += SIZEOF(.tdata) + SIZEOF(.tbss);',
                  1
              )

          ld.write_text(code)

          src = Path('3gx/sources/main.c')
          code = src.read_text()

          if '__system_runflags' not in code or '__apt_appid' not in code:
              needle = 'u32 __ctru_linear_heap_size = 0;'
              assert needle in code

              code = code.replace(
                  needle,
                  needle
                  + '\n\nu32 __system_runflags = 0;'
                  + '\nu32 __apt_appid = 0;',
                  1
              )

          src.write_text(code)
          PY

      - name: Compile with log
        shell: bash
        run: |
          set -o pipefail
          docker run --rm -v "$PWD:/work" -w /work \
            zaksabeast/devkitarm-rust make 2>&1 | tee v106_compile.log

      - name: Upload plugin
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rowlet-v10-6-dry-test
          path: out/default.3gx
          if-no-files-found: error

      - name: Upload compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rowlet-v10-6-compile-log
          path: v106_compile.log
          if-no-files-found: warn
