/**
 * Spear matching the provided photo, with a 90° pivoting head.
 * Compatible with https://jscad.app and OpenJSCAD v2.
 *
 * Use the "Pivot Angle" parameter to toggle the head between
 * aligned (0°) and folded (90°). The hinge is designed for
 * 3D printing + a short pin (or M3 bolt).
 *
 * Units: mm. Overall length ~ 480 mm (scale as needed).
 */

const jscad = require('@jscad/modeling')
const { cylinder, cuboid, polygon, roundedCuboid } = jscad.primitives
const { extrudeLinear } = jscad.extrusions
const { union, subtract, intersect } = jscad.booleans
const { translate, rotate, rotateX, rotateY, rotateZ, scale, mirror } = jscad.transforms
const { degToRad } = jscad.utils
const { colorize } = jscad.colors

// ---------------------------------------------------------------------------
// Parameters (shown as controls in the JSCAD UI)
// ---------------------------------------------------------------------------
const getParameterDefinitions = () => [
  { name: 'pivotAngle', type: 'number', initial: 0, min: 0, max: 90, step: 1, caption: 'Pivot Angle (°)' },
  { name: 'scale', type: 'number', initial: 1.0, min: 0.3, max: 2.0, step: 0.05, caption: 'Overall Scale' },
  { name: 'showPin', type: 'choice', caption: 'Show Pin', values: [0, 1], captions: ['No', 'Yes'], initial: 1 },
  { name: 'separateParts', type: 'choice', caption: 'Layout for Printing', values: [0, 1], captions: ['Assembled', 'Separated'], initial: 0 }
]

// ---------------------------------------------------------------------------
// Tunable dimensions (mm) – proportions matched to the photo
// ---------------------------------------------------------------------------
const DIM = {
  // Shaft
  shaftLength: 340,
  shaftRadius: 4.2,

  // Handle / grip wrap
  handleLength: 85,
  handleTopRadius: 11,
  handleBottomRadius: 16,

  // Head / blade
  headLength: 78,
  headThickness: 3.2,
  holeRadius: 3.8,          // the circular hole visible in the photo

  // Hinge
  hingePinRadius: 1.6,      // ~M3
  hingeClearance: 0.25,     // FDM-friendly
  hingeEarThickness: 3.5,
  hingeEarSpacing: 7.5,     // distance between the two outer ears
  hingeTabThickness: 3.0
}

// ---------------------------------------------------------------------------
// Helper: create the distinctive blade profile (matches photo silhouette)
// ---------------------------------------------------------------------------
const createBladeProfile = () => {
  // 2-D outline of the spearhead (XZ plane later).  
  // Points ordered clockwise, looking from +Y.
  // The left side has the longer downward barb that appears in the photo.
  const points = [
    [0, 0],                 // tip
    [6, 18],
    [11, 32],
    [13, 42],               // widest upper section
    [12, 52],
    [9, 58],
    [4, 62],
    // lower left barb (the characteristic wing visible in photo)
    [8, 68],
    [14, 74],
    [7, 78],
    [0, 72],
    // right side of lower section
    [-3, 68],
    [-6, 58],
    [-10, 48],
    [-12, 38],
    [-11, 28],
    [-7, 16],
    [-3, 6]
  ]
  return polygon({ points })
}

// ---------------------------------------------------------------------------
// Spear head (blade + hinge tab)
// ---------------------------------------------------------------------------
const createHead = (params) => {
  const t = DIM.headThickness
  const blade = extrudeLinear({ height: t }, createBladeProfile())

  // Center the blade on its thickness and move so base sits near origin
  let head = translate([0, -t / 2, -DIM.headLength], blade)

  // Circular hole (visible in photo)
  const hole = translate([0, 0, -42], 
    rotateX(degToRad(90), cylinder({ radius: DIM.holeRadius, height: t + 2, segments: 24 }))
  )
  head = subtract(head, hole)

  // Hinge tab that fits between the shaft ears
  const tabW = DIM.hingeEarSpacing - 2 * DIM.hingeClearance
  const tab = translate(
    [0, -DIM.hingeTabThickness / 2, 0],
    cuboid({
      size: [18, DIM.hingeTabThickness, 14],
      center: [0, 0, 7]
    })
  )
  // Pin hole in the tab
  const tabHole = translate([0, 0, 7],
    rotateX(degToRad(90), cylinder({
      radius: DIM.hingePinRadius + DIM.hingeClearance,
      height: DIM.hingeTabThickness + 2,
      segments: 20
    }))
  )
  const tabWithHole = subtract(tab, tabHole)

  head = union(head, tabWithHole)
  return head
}

// ---------------------------------------------------------------------------
// Shaft + handle + hinge ears
// ---------------------------------------------------------------------------
const createShaft = () => {
  // Main thin shaft
  const shaft = cylinder({
    radius: DIM.shaftRadius,
    height: DIM.shaftLength,
    center: [0, 0, DIM.shaftLength / 2],
    segments: 24
  })

  // Tapered handle (suggests the wrapped grip)
  const handle = translate([0, 0, -DIM.handleLength / 2],
    cylinder({
      radius: DIM.handleBottomRadius,
      height: DIM.handleLength,
      center: [0, 0, 0],
      segments: 28
    })
  )
  // Slight taper by intersecting with a cone-like shape is overkill;
  // we approximate with a second overlapping cylinder for a stepped look
  const handleTop = translate([0, 0, -8],
    cylinder({
      radius: DIM.handleTopRadius,
      height: 20,
      center: [0, 0, 0],
      segments: 28
    })
  )

  // Decorative rings that suggest wrapping
  const rings = []
  for (let i = 0; i < 6; i++) {
    const z = -12 - i * 12
    rings.push(
      translate([0, 0, z],
        cylinder({
          radius: DIM.handleBottomRadius + 0.8 - i * 0.15,
          height: 3.5,
          center: [0, 0, 0],
          segments: 28
        })
      )
    )
  }

  // Hinge ears at the top of the shaft
  const earHeight = 16
  const ear = cuboid({
    size: [16, DIM.hingeEarThickness, earHeight],
    center: [0, 0, earHeight / 2]
  })
  // Pin holes in ears
  const earHole = translate([0, 0, 7],
    rotateX(degToRad(90), cylinder({
      radius: DIM.hingePinRadius + DIM.hingeClearance * 0.6,
      height: DIM.hingeEarThickness + 2,
      segments: 20
    }))
  )
  const earWithHole = subtract(ear, earHole)

  const leftEar = translate([0, -DIM.hingeEarSpacing / 2, DIM.shaftLength], earWithHole)
  const rightEar = translate([0,  DIM.hingeEarSpacing / 2, DIM.shaftLength], earWithHole)

  // Small reinforcing collar under the ears
  const collar = translate([0, 0, DIM.shaftLength - 3],
    cylinder({
      radius: DIM.shaftRadius + 1.8,
      height: 8,
      center: [0, 0, 0],
      segments: 24
    })
  )

  return union(shaft, handle, handleTop, ...rings, leftEar, rightEar, collar)
}

// ---------------------------------------------------------------------------
// Simple pin
// ---------------------------------------------------------------------------
const createPin = () => {
  const pinLen = DIM.hingeEarSpacing + 2 * DIM.hingeEarThickness + 4
  return cylinder({
    radius: DIM.hingePinRadius,
    height: pinLen,
    center: [0, 0, 0],
    segments: 16
  })
}

// ---------------------------------------------------------------------------
// Main
// ---------------------------------------------------------------------------
const main = (params) => {
  const angle = degToRad(params.pivotAngle || 0)
  const sc = params.scale || 1.0

  let head = createHead(params)
  let shaft = createShaft()
  let pin = createPin()

  // Position the head so its hinge hole is at the pivot point
  // Pivot is at the top of the shaft, offset in Z by 7 mm into the ears
  const pivotZ = DIM.shaftLength + 7

  // Rotate head around the Y axis (the pin axis)
  head = translate([0, 0, -7], head)          // move hinge hole to origin
  head = rotateY(angle, head)
  head = translate([0, 0, pivotZ], head)

  // Position pin
  pin = rotateX(degToRad(90), pin)
  pin = translate([0, 0, pivotZ], pin)

  // Layout for printing
  if (params.separateParts) {
    // Lay everything flat and spaced for easy slicing
    head = translate([60, 0, 0], rotateX(degToRad(-90), translate([0, 0, -pivotZ], head)))
    shaft = rotateX(degToRad(-90), shaft)
    pin = translate([-40, 0, 0], pin)
  }

  // Apply overall scale
  const parts = [head, shaft]
  if (params.showPin) parts.push(pin)

  const scaled = parts.map(p => scale([sc, sc, sc], p))

  // Optional subtle coloring for the UI (does not affect STL)
  return [
    colorize([0.35, 0.28, 0.22], scaled[0]),   // head – darker
    colorize([0.40, 0.32, 0.25], scaled[1]),   // shaft
    ...(scaled[2] ? [colorize([0.55, 0.55, 0.55], scaled[2])] : [])
  ]
}

module.exports = { main, getParameterDefinitions }
