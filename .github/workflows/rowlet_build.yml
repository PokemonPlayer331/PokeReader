
name: Build Rowlet V10.4 InputRedirection Dry Run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply stable Rowlet Watch patch
        run: python3 patch/apply_patch.py .

      - name: Label V10.4 dry run on Rowlet Watch screen
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('reader_core/src/gen7/frame.rs')
          s = p.read_text()

          a = 'pnp::println!("ROWLET WATCH v5");'
          b = 'pnp::println!("Reset buttons: OFF");'

          assert s.count(a) == 1, 'Rowlet Watch V5 heading not found'
          assert s.count(b) == 1, 'Rowlet Watch reset status not found'

          s = s.replace(
              a,
              'pnp::println!("ROWLET V10.4 REMOTE");',
              1
          )

          s = s.replace(
              b,
              'pnp::println!("MODE: DRY RUN");\n'
              '            pnp::println!("Input: PC over WiFi");\n'
              '            pnp::println!("Reset: DISABLED");',
              1
          )

          p.write_text(s)
          print('V10.4 overlay labeled; no memory injection')
          PY

      - name: Fix libctru 2.4.1 compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ld = Path('3gx/3gx.ld')
          code = ld.read_text()

          if '__tdata_align' not in code:
              needle = 'SORT(CONSTRUCTORS)\n\t\t. = ALIGN(4);'
              assert needle in code

              code = code.replace(
                  needle,
                  needle +
                  '\n\t\t__tdata_align = .;'
                  '\n\t\tLONG (ALIGNOF(.tdata));'
                  '\n\t\t. = ALIGN(4);',
                  1
              )

          needle = (
              '\t\t__tls_start = .;\n'
              '\t\t. += + SIZEOF(.tdata) + SIZEOF(.tbss);'
          )

          if needle in code:
              code = code.replace(
                  needle,
                  '\t\t. = 8 + ABSOLUTE(ALIGN('
                  'ABSOLUTE(. - 8), MAX(4, '
                  'ALIGNOF(.tdata))));\n'
                  '\t\t__tls_start = .;\n'
                  '\t\t. += SIZEOF(.tdata) + SIZEOF(.tbss);',
                  1
              )

          ld.write_text(code)

          src = Path('3gx/sources/main.c')
          code = src.read_text()

          if (
              '__system_runflags' not in code or
              '__apt_appid' not in code
          ):
              needle = 'u32 __ctru_linear_heap_size = 0;'
              assert needle in code

              code = code.replace(
                  needle,
                  needle +
                  '\n\nu32 __system_runflags = 0;'
                  '\nu32 __apt_appid = 0;',
                  1
              )

          src.write_text(code)
          PY

      - name: Build plugin and save log
        shell: bash
        run: |
          set -o pipefail
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            zaksabeast/devkitarm-rust make 2>&1 | tee v104_compile.log

      - name: Upload plugin
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rowlet-v10-4-dry-run-plugin
          path: out/default.3gx
          if-no-files-found: error

      - name: Upload compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rowlet-v10-4-compile-log
          path: v104_compile.log
          if-no-files-found: warn
