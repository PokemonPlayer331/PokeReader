
name: Build Rowlet V13.8.1 Gmail POST Fix

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover V13.7 from Git history
        shell: bash
        env:
          ROWLET_NOTIFY_URL: ${{ secrets.ROWLET_NOTIFY_URL }}
          ROWLET_NOTIFY_TOKEN: ${{ secrets.ROWLET_NOTIFY_TOKEN }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import subprocess
          import yaml

          path = ".github/workflows/rowlet_v13_5_gmail_counter.yml"

          if not os.environ.get("ROWLET_NOTIFY_URL"):
              raise SystemExit("Missing ROWLET_NOTIFY_URL secret")

          if not os.environ.get("ROWLET_NOTIFY_TOKEN"):
              raise SystemExit("Missing ROWLET_NOTIFY_TOKEN secret")

          history = subprocess.check_output(
              ["git", "log", "--all", "--format=%H", "--", path],
              text=True
          ).splitlines()

          old_workflow = None

          for commit in history:
              result = subprocess.run(
                  ["git", "show", f"{commit}:{path}"],
                  capture_output=True,
                  text=True
              )

              if result.returncode != 0:
                  continue

              try:
                  candidate = yaml.safe_load(result.stdout)
              except Exception:
                  continue

              if not isinstance(candidate, dict):
                  continue

              if candidate.get("name") != (
                  "Build Rowlet V13.7 Gmail Network Diagnostics"
              ):
                  continue

              old_workflow = candidate
              print("Found original V13.7 commit:", commit[:12])
              break

          if old_workflow is None:
              raise SystemExit(
                  "Cannot find the V13.7 workflow in Git history. "
                  "No source changes were made."
              )

          steps = old_workflow["jobs"]["build"]["steps"]

          required = [
              "Restore working V13.2 hunting code",
              "Install V13.7 counter and Gmail diagnostics",
          ]

          for name in required:
              matches = [
                  step for step in steps
                  if step.get("name") == name
              ]

              if len(matches) != 1:
                  raise SystemExit(
                      "Missing original V13.7 step: " + name
                  )

              print("Applying:", name, flush=True)

              subprocess.run(
                  [
                      "bash",
                      "-e",
                      "-o",
                      "pipefail",
                      "-c",
                      matches[0]["run"]
                  ],
                  env=os.environ.copy(),
                  check=True
              )

          print("V13.7 source restored successfully")
          PY

      - name: Fix Gmail HTTP buffer and form data
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/v1381_fix.py <<'PY'
          from pathlib import Path

          path = Path("3gx/sources/main.c")
          source = path.read_text()

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{label}: expected 1 match, found {count}"
                  )
              return text.replace(old, new, 1)

          # Allocate a real HTTP shared-memory buffer.
          source = replace_once(
              source,
              "Result rc = httpcInit(0);",
              "Result rc = httpcInit(0x1000);",
              "HTTP buffer"
          )

          # Specify URL-encoded form data before posting.
          old = '''v137_net_stage = 3u;

              rc = httpcAddPostDataAscii(
                  &ctx,
                  "token",
                  ROWLET_GMAIL_TOKEN
              );'''

          new = '''v137_net_stage = 3u;

              rc = httpcAddRequestHeaderField(
                  &ctx,
                  "Content-Type",
                  "application/x-www-form-urlencoded"
              );

              if (R_SUCCEEDED(rc)) {
                  rc = httpcAddPostDataAscii(
                      &ctx,
                      "token",
                      ROWLET_GMAIL_TOKEN
                  );
              }'''

          source = replace_once(
              source, old, new, "POST form setup"
          )

          if "if (v13_phase == 4)" not in source:
              raise SystemExit("Non-shiny reset gate missing")

          if "rowlet_v137_notify_tick" not in source:
              raise SystemExit("Gmail diagnostic code missing")

          path.write_text(source)

          print("V13.8.1 HTTP fixes installed")
          PY

          python3 /tmp/v1381_fix.py

      - name: Verify source code
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq 'httpcInit(0x1000)' 3gx/sources/main.c
          grep -Fq 'application/x-www-form-urlencoded' 3gx/sources/main.c
          grep -Fq 'rowlet_v137_send_mail' 3gx/sources/main.c
          grep -Fq 'rowlet_v137_notify_tick' 3gx/sources/main.c
          grep -Fq 'rowlet_v13_reset_sent' reader_core/src/gen7/frame.rs
          grep -Fq 'ROWLET: SHINY!' reader_core/src/gen7/frame.rs
          grep -Fq 'NET:{} ERR:{:08X}' reader_core/src/gen7/frame.rs

          echo "V13.8.1 source verification passed"

      - name: Build PokeReader plugin
        shell: bash
        run: |
          set -o pipefail

          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            zaksabeast/devkitarm-rust make \
            2>&1 | tee rowlet_v13_8_1_compile.log

      - name: Upload plugin
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rowlet-v13-8-1-gmail-fixed
          path: out/default.3gx
          if-no-files-found: error

      - name: Upload compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rowlet-v13-8-1-compile-log
          path: rowlet_v13_8_1_compile.log
          if-no-files-found: warn
