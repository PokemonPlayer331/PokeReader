
name: Build Rowlet V13.5.2 Gmail Counter Anchor Fix

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Apply original working V13.2 patches
      shell: bash
      run: |
        set -euo pipefail
        python3 -m pip install --user PyYAML
        python3 - <<'PY'
        import subprocess, yaml
        from pathlib import Path

        previous = Path('.github/workflows/rowlet_build.yml')
        assert previous.exists(), 'Working V13.2 workflow must remain at .github/workflows/rowlet_build.yml'

        doc = yaml.safe_load(previous.read_text())
        steps = doc['jobs']['build']['steps']
        desired = [
            'Apply V5 decoded Rowlet watcher',
            'Apply V6 working A-input bridge',
            'Replace V6 test with V12.1 A pulses and shiny-only status',
            'Install V13.1 reset loop',
            'V13.2 nickname keyboard START then A workaround',
            'Fix toolchain linker compatibility',
        ]

        for name in desired:
            matches = [step for step in steps if step.get('name') == name]
            if len(matches) != 1:
                raise SystemExit(f'Expected 1 V13.2 step {name}, got {len(matches)}')
            print(f'Applying {name}', flush=True)
            subprocess.run(
                ['bash', '-e', '-o', 'pipefail', '-c', matches[0]['run']],
                check=True
            )
        PY

    - name: Add V13.3 live counter and reason codes
      shell: bash
      run: |
        cat > /tmp/v13_3.py <<'PY'
        from pathlib import Path
        import re

        main = Path('3gx/sources/main.c')
        frame = Path('reader_core/src/gen7/frame.rs')
        m = main.read_text()
        f = frame.read_text()

        def replace_once(text, old, new, label):
            n = text.count(old)
            if n != 1:
                raise SystemExit(f'{label}: expected one exact anchor, got {n}')
            return text.replace(old, new, 1)

        needle = 'static u32 v13_resets = 0;'
        m = replace_once(m, needle, needle + '''
        // V13.3 stop reason codes:
        // 0 running, 1 B, 2 shiny, 3 error,
        // 4 input failure, 5 trigger timeout,
        // 6 encounter timeout, 7 reload timeout.
        static volatile u32 v13_stop_reason = 0;

        u32 rowlet_v13_count(void) { return v13_resets; }
        u32 rowlet_v13_stop_reason(void) { return v13_stop_reason; }
        u32 rowlet_v13_mode(void) { return v13_mode; }
        ''', 'counter declaration')

        m = replace_once(
            m,
            'if (keys & KEY_B) { rowlet_v13_halt(); return; }',
            'if (keys & KEY_B) { v13_stop_reason=1; rowlet_v13_halt(); return; }',
            'B stop reason'
        )

        def annotate_stop(text, condition, reason, label):
            expr = (
                r'(if \(' + re.escape(condition) +
                r'\)\s*\{[^{}]*?)(rowlet_v13_halt\(\);)'
            )
            updated, n = re.subn(
                expr,
                lambda match: match.group(1) +
                'v13_stop_reason=' + str(reason) + '; ' +
                match.group(2),
                text,
                count=1,
                flags=re.S
            )
            if n != 1:
                raise SystemExit(f'{label}: stop branch not found')
            return updated

        m = annotate_stop(
            m,
            'v13_phase == 5 || v13_phase == 6',
            '(v13_phase == 5 ? 2u : 3u)',
            'shiny/error reason'
        )

        m = replace_once(
            m,
            'if (++v13_missing_hid > 600) rowlet_v13_halt();',
            'if (++v13_missing_hid > 600) { v13_stop_reason=4; rowlet_v13_halt(); }',
            'missing HID reason'
        )

        m = replace_once(
            m,
            'if (++v13_frame > 600) rowlet_v13_halt();',
            'if (++v13_frame > 600) { v13_stop_reason=5; rowlet_v13_halt(); }',
            'trigger timeout reason'
        )

        m = annotate_stop(
            m, 'v13_frame > (60u * 240u)',
            6, 'encounter timeout'
        )

        m = annotate_stop(
            m, '!ok && v13_reset_ok_frames < 8u',
            4, 'reset input failure'
        )

        m = annotate_stop(
            m, 'v13_frame > (60u * 100u)',
            7, 'reload timeout'
        )

        old = 'pnp::println!("{}", label);'
        new = '''pnp::println!("{}", label);
                extern "C" {
                    fn rowlet_v13_count() -> u32;
                    fn rowlet_v13_stop_reason() -> u32;
                    fn rowlet_v13_mode() -> u32;
                }

                let (n, stop, mode) = unsafe {
                    (
                        rowlet_v13_count(),
                        rowlet_v13_stop_reason(),
                        rowlet_v13_mode()
                    )
                };

                pnp::println!("Resets this session: {}", n);

                if mode == 5 {
                    let why = match stop {
                        1 => "MANUAL B",
                        2 => "SHINY",
                        3 => "DATA ERROR",
                        4 => "INPUT FAILURE",
                        5 => "TRIGGER TIMEOUT",
                        6 => "ENCOUNTER TIMEOUT",
                        7 => "RELOAD TIMEOUT",
                        _ => "UNKNOWN",
                    };
                    pnp::println!("STOP: {}", why);
                } else {
                    pnp::println!("AUTO: RUNNING");
                }
                '''

        f = replace_once(f, old, new, 'Rust status display')

        assert 'if (v13_phase == 4)' in m
        assert 'rowlet_try_nickname_start_frame(true)' in m
        assert 'rowlet_v13_reset_sent' in f

        main.write_text(m)
        frame.write_text(f)

        print('V13.3 diagnostic counter and stop reasons installed')
        PY
        python3 /tmp/v13_3.py

    - name: Add experimental Gmail sender from GitHub secrets
      shell: bash
      env:
        ROWLET_NOTIFY_URL: ${{ secrets.ROWLET_NOTIFY_URL }}
        ROWLET_NOTIFY_TOKEN: ${{ secrets.ROWLET_NOTIFY_TOKEN }}
      run: |
        set -euo pipefail

        if [ -z "$ROWLET_NOTIFY_URL" ] || [ -z "$ROWLET_NOTIFY_TOKEN" ]; then
          echo "Missing Actions secrets ROWLET_NOTIFY_URL and ROWLET_NOTIFY_TOKEN" >&2
          exit 1
        fi

        cat > /tmp/rowlet_gmail.py <<'PY'
        from pathlib import Path
        import json
        import os

        main = Path('3gx/sources/main.c')
        frame = Path('reader_core/src/gen7/frame.rs')

        m = main.read_text()
        f = frame.read_text()

        url = os.environ['ROWLET_NOTIFY_URL'].strip()
        token = os.environ['ROWLET_NOTIFY_TOKEN'].strip()

        if not (
            url.startswith('https://script.google.com/macros/s/')
            and url.endswith('/exec')
        ):
            raise SystemExit('Invalid Apps Script URL')

        if not (
            20 <= len(token) <= 200
            and all(33 <= ord(c) < 127 for c in token)
        ):
            raise SystemExit('Invalid notification token')

        def once(s, before, after, label):
            count = s.count(before)
            if count != 1:
                raise SystemExit(
                    f'{label}: expected one anchor, found {count}'
                )
            return s.replace(before, after, 1)

        notifier = r'''
        // V13.4 experimental Gmail HTTPS notification.
        #define ROWLET_NOTIFY_URL @@URL@@
        #define ROWLET_NOTIFY_TOKEN @@TOKEN@@

        static volatile u32 rowlet_mail_pending = 0;
        static volatile u32 rowlet_mail_sending = 0;
        static volatile u32 rowlet_mail_sent = 0;
        static volatile u32 rowlet_mail_frames = 3600;
        static volatile u32 rowlet_mail_tries = 0;

        u32 rowlet_notify_status(void)
        {
            if (rowlet_mail_sent) return 3u;
            if (rowlet_mail_sending) return 2u;
            if (rowlet_mail_pending && rowlet_mail_tries) return 4u;
            if (rowlet_mail_pending) return 1u;
            return 0u;
        }

        static void rowlet_notify_worker(void *arg)
        {
            (void)arg;
            bool success = false;

            if (R_SUCCEEDED(httpcInit(0))) {
                httpcContext ctx;
                Result rc = httpcOpenContext(
                    &ctx,
                    HTTPC_METHOD_POST,
                    ROWLET_NOTIFY_URL,
                    1
                );

                if (R_SUCCEEDED(rc)) {
                    rc = httpcAddPostDataAscii(
                        &ctx,
                        "token",
                        ROWLET_NOTIFY_TOKEN
                    );

                    if (R_SUCCEEDED(rc)) {
                        rc = httpcBeginRequest(&ctx);

                        if (R_SUCCEEDED(rc)) {
                            u32 status = 0;
                            rc = httpcGetResponseStatusCode(
                                &ctx,
                                &status
                            );

                            if (
                                R_SUCCEEDED(rc) &&
                                (status == 200 ||
                                 status == 302 ||
                                 status == 303)
                            ) {
                                success = true;
                            }
                        }
                    }

                    httpcCloseContext(&ctx);
                }

                httpcExit();
            }

            if (success)
                rowlet_mail_sent = 1;

            rowlet_mail_sending = 0;
        }

        static void rowlet_notify_tick(void)
        {
            if (v13_phase == 5u)
                rowlet_mail_pending = 1;

            if (!rowlet_mail_pending ||
                rowlet_mail_sent ||
                rowlet_mail_sending)
                return;

            if (rowlet_mail_frames < 3600u) {
                ++rowlet_mail_frames;
                return;
            }

            rowlet_mail_frames = 0;
            rowlet_mail_sending = 1;
            ++rowlet_mail_tries;

            Thread t = threadCreate(
                rowlet_notify_worker,
                NULL,
                0x8000,
                0x30,
                -2,
                true
            );

            if (!t)
                rowlet_mail_sending = 0;
        }
        '''

        notifier = notifier.replace(
            '@@URL@@', json.dumps(url)
        ).replace(
            '@@TOKEN@@', json.dumps(token)
        )

        m = once(
            m,
            'static void rowlet_v13_tick(void)',
            notifier + 'static void rowlet_v13_tick(void)',
            'Gmail worker'
        )

        m = once(
            m,
            'const u32 trigger = KEY_L | KEY_R | KEY_Y; // X is NEVER injected',
            'const u32 trigger = KEY_L | KEY_R | KEY_Y; // X is NEVER injected\n              rowlet_notify_tick();',
            'Gmail trigger'
        )

        needle = 'pnp::println!("Resets this session: {}", n);'

        addition = '''pnp::println!("Resets this session: {}", n);
                          extern "C" {
                              fn rowlet_notify_status() -> u32;
                          }

                          let mail_status = unsafe {
                              rowlet_notify_status()
                          };

                          let mail_label = match mail_status {
                              0 => "MAIL: WAITING",
                              1 => "MAIL: PENDING",
                              2 => "MAIL: SENDING",
                              3 => "MAIL: REQUEST SENT",
                              _ => "MAIL: RETRYING / WIFI OFF",
                          };

                          pnp::println!("{}", mail_label);'''

        f = once(f, needle, addition, 'Gmail display')

        assert 'if (v13_phase == 4)' in m
        assert 'if (v13_phase == 5 || v13_phase == 6)' in m

        main.write_text(m)
        frame.write_text(f)

        print('Experimental Gmail sender installed')
        PY

        python3 /tmp/rowlet_gmail.py

    - name: V13.5 compact overlay and test email shortcut
      shell: bash
      run: |
        set -euo pipefail

        cat > /tmp/rowlet135_patch.py <<'PY'
        from pathlib import Path
        import re

        m_path = Path('3gx/sources/main.c')
        f_path = Path('reader_core/src/gen7/frame.rs')

        m = m_path.read_text()
        f = f_path.read_text()

        def once(text, old, new, label):
            n = text.count(old)
            if n != 1:
                raise SystemExit(
                    f'{label}: expected one anchor, found {n}'
                )
            return text.replace(old, new, 1)

        start = '        pnp::println!("Resets this session: {}", n);'

        end = '''        } else {
                    pnp::println!("AUTO: RUNNING");
                }
        '''

        if f.count(start) != 1 or f.count(end) != 1:
            raise SystemExit('Display anchors changed')

        a = f.index(start)
        b = f.index(end, a) + len(end)

        replacement = '''        extern "C" {
                    fn rowlet_notify_status() -> u32;
                }

                let mail = unsafe {
                    rowlet_notify_status()
                };

                if mode == 5 {
                    let why = match stop {
                        1 => "B",
                        2 => "SHINY",
                        3 => "DATA",
                        4 => "INPUT",
                        5 => "TRIGGER",
                        6 => "ENCOUNTER",
                        7 => "RELOAD",
                        _ => "UNKNOWN",
                    };

                    pnp::println!(
                        "STOP:{} R:{} M:{}", why, n, mail
                    );
                } else {
                    pnp::println!("R:{} MAIL:{}", n, mail);
                }
        '''

        f = f[:a] + replacement + f[b:]

        m = once(
            m,
            'static volatile u32 rowlet_mail_tries = 0;',
            'static volatile u32 rowlet_mail_tries = 0;\n'
            'static u32 rowlet_mail_test_held = 0;',
            'test variable'
        )

        # Insert the test at the beginning of the notification
        # function instead of matching the old shiny-check line.
        pattern = r'(static void rowlet_notify_tick\(void\)\s*\{)'

        test_code = '''
            // SELECT + Y sends a manual notification test.
            u32 physical = get_current_keys();

            u32 test_down = (
                (physical & (KEY_SELECT | KEY_Y)) ==
                (KEY_SELECT | KEY_Y)
            );

            if (test_down &&
                !rowlet_mail_test_held &&
                !rowlet_mail_sent) {
                rowlet_mail_pending = 1;
                rowlet_mail_frames = 3600u;
            }

            rowlet_mail_test_held = test_down;
        '''

        m, count = re.subn(
            pattern,
            lambda match: match.group(1) + test_code,
            m,
            count=1
        )

        if count != 1:
            raise SystemExit(
                'V13.5 notification function not found'
            )

        assert 'if (v13_phase == 4)' in m
        assert 'if (v13_phase == 5 || v13_phase == 6)' in m

        m_path.write_text(m)
        f_path.write_text(f)

        print('V13.5.2 Gmail test and compact UI installed')
        PY

        python3 /tmp/rowlet135_patch.py

    - name: Verify V13.5.2
      shell: bash
      run: |
        set -euo pipefail

        grep -Fq 'rowlet_v13_count' 3gx/sources/main.c
        grep -Fq 'STOP:{} R:{} M:{}' reader_core/src/gen7/frame.rs
        grep -Fq 'R:{} MAIL:{}' reader_core/src/gen7/frame.rs
        grep -Fq 'if (v13_phase == 4)' 3gx/sources/main.c
        grep -Fq 'if (v13_phase == 5 || v13_phase == 6)' 3gx/sources/main.c
        grep -Fq 'rowlet_notify_tick();' 3gx/sources/main.c
        grep -Fq 'rowlet_mail_test_held' 3gx/sources/main.c

    - name: Build PokeReader plugin
      shell: bash
      run: |
        set -o pipefail

        docker run --rm \
          -v "$PWD:/work" \
          -w /work \
          zaksabeast/devkitarm-rust make \
          2>&1 | tee rowlet_v13_5_compile.log

    - name: Upload 3GX
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: rowlet-v13-5-2-gmail-counter
        path: out/default.3gx
        if-no-files-found: error

    - name: Upload compile log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: rowlet-v13-5-2-compile-log
        path: rowlet_v13_5_compile.log
        if-no-files-found: warn
