
name: Build Rowlet V13.8 Gmail POST Fix

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore V13.7 working hunter and diagnostics
        shell: bash
        env:
          ROWLET_NOTIFY_URL: ${{ secrets.ROWLET_NOTIFY_URL }}
          ROWLET_NOTIFY_TOKEN: ${{ secrets.ROWLET_NOTIFY_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          import subprocess
          import yaml

          if not os.environ.get('ROWLET_NOTIFY_URL') or not os.environ.get('ROWLET_NOTIFY_TOKEN'):
              raise SystemExit('GitHub secrets ROWLET_NOTIFY_URL and ROWLET_NOTIFY_TOKEN are required')

          source = Path('.github/workflows/rowlet_v13_5_gmail_counter.yml')
          if not source.is_file():
              raise SystemExit('V13.7 workflow is missing. Keep rowlet_v13_5_gmail_counter.yml unchanged.')

          steps = yaml.safe_load(source.read_text())['jobs']['build']['steps']
          names = [
              'Restore working V13.2 hunting code',
              'Install V13.7 counter and Gmail diagnostics',
          ]

          for name in names:
              matches = [step for step in steps if step.get('name') == name]
              if len(matches) != 1:
                  raise SystemExit('Expected a V13.7 step, not another version: ' + name)
              print('Applying:', name, flush=True)
              subprocess.run(
                  ['bash', '-e', '-o', 'pipefail', '-c', matches[0]['run']],
                  check=True,
                  env=os.environ.copy()
              )
          PY

      - name: Fix missing POST buffer and form content type
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/rowlet_v138_fix.py <<'PY'
          from pathlib import Path
          import re

          path = Path('3gx/sources/main.c')
          source = path.read_text()

          old_init = 'Result rc = httpcInit(0);'
          if source.count(old_init) != 1:
              raise SystemExit('Expected one V13.7 HTTP initialization call')

          source = source.replace(
              old_init,
              'Result rc = httpcInit(0x1000);',
              1
          )

          # Allocate a 4 KiB shared buffer for POST form data.
          # Add the required form Content-Type before posting.

          pattern = r'(?m)^([ \t]*)rc = httpcAddPostDataAscii\('

          def insert_header(match):
              indent = match.group(1)
              return (
                  indent + 'rc = httpcAddRequestHeaderField(\n' +
                  indent + '    &ctx, "Content-Type", "application/x-www-form-urlencoded");\n' +
                  indent + 'if (R_SUCCEEDED(rc))\n' +
                  indent + '    rc = httpcAddPostDataAscii('
              )

          source, found = re.subn(
              pattern,
              insert_header,
              source,
              count=1
          )

          if found != 1:
              raise SystemExit('Expected one V13.7 POST field call')

          if (
              'if (v13_phase == 4)' not in source
              or 'rowlet_v137_notify_tick' not in source
          ):
              raise SystemExit('Hunting/shiny safety anchors missing')

          path.write_text(source)
          print('Fixed HTTP 4 KiB POST buffer and Content-Type header')
          PY
          python3 /tmp/rowlet_v138_fix.py

      - name: Verify patched V13.8 code
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'httpcInit(0x1000);' 3gx/sources/main.c
          grep -Fq 'application/x-www-form-urlencoded' 3gx/sources/main.c
          grep -Fq 'rowlet_v137_notify_tick' 3gx/sources/main.c
          grep -Fq 'rowlet_v13_reset_sent' reader_core/src/gen7/frame.rs
          grep -Fq 'ROWLET: SHINY!' reader_core/src/gen7/frame.rs
          grep -Fq 'NET:{} ERR:{:08X}' reader_core/src/gen7/frame.rs
          echo 'V13.8 patched source verification passed'

      - name: Build PokeReader plugin
        shell: bash
        run: |
          set -o pipefail
          docker run --rm -v "$PWD:/work" -w /work \
            zaksabeast/devkitarm-rust make 2>&1 | tee rowlet_v13_8_compile.log

      - name: Upload plugin
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rowlet-v13-8-gmail-post-buffer-fix
          path: out/default.3gx
          if-no-files-found: error

      - name: Upload compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rowlet-v13-8-compile-log
          path: rowlet_v13_8_compile.log
          if-no-files-found: warn
