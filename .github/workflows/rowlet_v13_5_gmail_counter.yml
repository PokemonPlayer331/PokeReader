
name: Build Rowlet V13.6 Gmail Counter

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install original working V13.2
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import subprocess
          import yaml
          from pathlib import Path

          path = Path(".github/workflows/rowlet_build.yml")

          if not path.exists():
              raise SystemExit("Original V13.2 workflow missing")

          doc = yaml.safe_load(path.read_text())
          steps = doc["jobs"]["build"]["steps"]

          names = [
              "Apply V5 decoded Rowlet watcher",
              "Apply V6 working A-input bridge",
              "Replace V6 test with V12.1 A pulses and shiny-only status",
              "Install V13.1 reset loop",
              "V13.2 nickname keyboard START then A workaround",
              "Fix toolchain linker compatibility",
          ]

          for name in names:
              matching = [
                  step for step in steps
                  if step.get("name") == name
              ]

              if len(matching) != 1:
                  raise SystemExit(
                      "Missing V13.2 step: " + name
                  )

              print("Applying:", name, flush=True)

              subprocess.run(
                  [
                      "bash",
                      "-e",
                      "-o",
                      "pipefail",
                      "-c",
                      matching[0]["run"]
                  ],
                  check=True
              )

          print("Original V13.2 installed")
          PY

      - name: Install V13.6 counter and Gmail
        shell: bash
        env:
          ROWLET_NOTIFY_URL: ${{ secrets.ROWLET_NOTIFY_URL }}
          ROWLET_NOTIFY_TOKEN: ${{ secrets.ROWLET_NOTIFY_TOKEN }}

        run: |
          set -euo pipefail

          if [ -z "$ROWLET_NOTIFY_URL" ]; then
            echo "Missing ROWLET_NOTIFY_URL secret"
            exit 1
          fi

          if [ -z "$ROWLET_NOTIFY_TOKEN" ]; then
            echo "Missing ROWLET_NOTIFY_TOKEN secret"
            exit 1
          fi

          cat > /tmp/rowlet136.py <<'PY'
          from pathlib import Path
          import json
          import os

          main = Path("3gx/sources/main.c")
          frame = Path("reader_core/src/gen7/frame.rs")

          m = main.read_text()
          f = frame.read_text()

          url = os.environ["ROWLET_NOTIFY_URL"].strip()
          token = os.environ["ROWLET_NOTIFY_TOKEN"].strip()

          if not (
              url.startswith(
                  "https://script.google.com/macros/s/"
              )
              and url.endswith("/exec")
          ):
              raise SystemExit("Invalid Apps Script URL")

          if len(token) < 20:
              raise SystemExit("Notification token too short")

          def replace_once(source, old, new, label):
              count = source.count(old)

              if count != 1:
                  raise SystemExit(
                      label + ": expected one anchor, found " +
                      str(count)
                  )

              return source.replace(old, new, 1)

          # -----------------------------
          # Counter and stop diagnostics
          # -----------------------------

          m = replace_once(
              m,
              "static u32 v13_resets = 0;",
              """static u32 v13_resets = 0;

          static volatile u32 v136_reason = 0;

          u32 rowlet_v136_count(void)
          {
              return v13_resets;
          }

          u32 rowlet_v136_reason(void)
          {
              return v136_reason;
          }

          u32 rowlet_v136_mode(void)
          {
              return v13_mode;
          }
          """,
              "Counter insertion"
          )

          m = replace_once(
              m,
              "if (keys & KEY_B) { rowlet_v13_halt(); return; }",
              """if (keys & KEY_B) {
                  v136_reason = 1;
                  rowlet_v13_halt();
                  return;
              }""",
              "Manual halt"
          )

          m = replace_once(
              m,
              """if (v13_phase == 5 || v13_phase == 6) { // SHINY or ERROR
                  rowlet_v13_halt();
                  return;
              }""",
              """if (v13_phase == 5 || v13_phase == 6) {
                  v136_reason = (v13_phase == 5) ? 2 : 3;
                  rowlet_v13_halt();
                  rowlet_v136_notify_tick(keys);
                  return;
              }""",
              "Shiny protection"
          )

          m = replace_once(
              m,
              "if (++v13_missing_hid > 600) rowlet_v13_halt();",
              """if (++v13_missing_hid > 600) {
                  v136_reason = 4;
                  rowlet_v13_halt();
              }""",
              "Input timeout"
          )

          m = replace_once(
              m,
              "if (++v13_frame > 600) rowlet_v13_halt();",
              """if (++v13_frame > 600) {
                      v136_reason = 5;
                      rowlet_v13_halt();
                  }""",
              "Trigger timeout"
          )

          m = replace_once(
              m,
              """if (v13_frame > (60u * 240u)) { // 4-minute encounter timeout
                      rowlet_v13_halt();""",
              """if (v13_frame > (60u * 240u)) {
                      v136_reason = 6;
                      rowlet_v13_halt();""",
              "Encounter timeout"
          )

          m = replace_once(
              m,
              """if (v13_frame > (60u * 100u)) { // reload failed; no more resets
                      rowlet_v13_halt();""",
              """if (v13_frame > (60u * 100u)) {
                      v136_reason = 7;
                      rowlet_v13_halt();""",
              "Reload timeout"
          )

          # -----------------------------
          # Gmail notification subsystem
          # No background worker threads
          # -----------------------------

          notifier = r'''
          #define ROWLET_GMAIL_URL @@URL@@
          #define ROWLET_GMAIL_TOKEN @@TOKEN@@

          static volatile u32 v136_mail = 0;
          static u32 v136_mail_frames = 3600;
          static u32 v136_mail_attempts = 0;
          static u32 v136_test_held = 0;

          // Mail states:
          // 0 idle
          // 1 pending
          // 2 sending
          // 3 HTTP request accepted
          // 4 failed, waiting to retry

          u32 rowlet_v136_mail_status(void)
          {
              return v136_mail;
          }

          static bool rowlet_v136_send_mail(void)
          {
              bool success = false;

              Result init = httpcInit(0);

              if (R_FAILED(init))
                  return false;

              httpcContext ctx;

              Result rc = httpcOpenContext(
                  &ctx,
                  HTTPC_METHOD_POST,
                  ROWLET_GMAIL_URL,
                  1
              );

              if (R_SUCCEEDED(rc)) {

                  rc = httpcAddPostDataAscii(
                      &ctx,
                      "token",
                      ROWLET_GMAIL_TOKEN
                  );

                  if (R_SUCCEEDED(rc))
                      rc = httpcBeginRequest(&ctx);

                  if (R_SUCCEEDED(rc)) {

                      u32 status = 0;

                      rc = httpcGetResponseStatusCode(
                          &ctx,
                          &status
                      );

                      if (R_SUCCEEDED(rc)) {

                          if (status == 200 ||
                              status == 302 ||
                              status == 303) {

                              success = true;
                          }
                      }
                  }

                  httpcCloseContext(&ctx);
              }

              httpcExit();

              return success;
          }

          static void rowlet_v136_notify_tick(u32 keys)
          {
              // Only process networking after hunting stops.
              // The verified shiny always takes priority.

              if (v13_phase == 5u) {
                  if (v136_mail != 3u &&
                      v136_mail != 2u) {
                      v136_mail = 1u;
                  }
              }

              u32 test_down =
                  ((keys & (KEY_SELECT | KEY_Y)) ==
                   (KEY_SELECT | KEY_Y));

              if (test_down && !v136_test_held) {
                  v136_mail = 1u;
                  v136_mail_frames = 3600u;
              }

              v136_test_held = test_down;

              if (v136_mail != 1u &&
                  v136_mail != 4u)
                  return;

              if (v136_mail_frames < 3600u) {
                  ++v136_mail_frames;
                  return;
              }

              v136_mail_frames = 0;

              v136_mail = 2u;
              ++v136_mail_attempts;

              bool ok = rowlet_v136_send_mail();

              v136_mail = ok ? 3u : 4u;
          }

          '''

          notifier = notifier.replace(
              "@@URL@@", json.dumps(url)
          ).replace(
              "@@TOKEN@@", json.dumps(token)
          )

          m = replace_once(
              m,
              "static void rowlet_v13_tick(void)",
              notifier + "static void rowlet_v13_tick(void)",
              "Notification code"
          )

          # Allow manual email tests only after the bot is
          # halted using B. This avoids interrupting hunting.
          m = replace_once(
              m,
              "if (v13_mode == 5) return;",
              """if (v13_mode == 5) {
                  rowlet_v136_notify_tick(keys);
                  return;
              }""",
              "Stopped-mode Gmail handler"
          )

          # -----------------------------
          # Display
          # -----------------------------

          status = '''pnp::println!("{}", label);

                  extern "C" {
                      fn rowlet_v136_count() -> u32;
                      fn rowlet_v136_reason() -> u32;
                      fn rowlet_v136_mode() -> u32;
                      fn rowlet_v136_mail_status() -> u32;
                  }

                  let (count, reason, mode, mail) =
                      unsafe {
                          (
                              rowlet_v136_count(),
                              rowlet_v136_reason(),
                              rowlet_v136_mode(),
                              rowlet_v136_mail_status(),
                          )
                      };

                  pnp::println!("RESETS: {}", count);

                  if mode == 5 {
                      let why = match reason {
                          1 => "B BUTTON",
                          2 => "SHINY!",
                          3 => "DATA ERROR",
                          4 => "INPUT FAIL",
                          5 => "TRIGGER TIMEOUT",
                          6 => "ENCOUNTER TIMEOUT",
                          7 => "RELOAD TIMEOUT",
                          _ => "STOPPED",
                      };

                      pnp::println!("STOP: {}", why);
                  }

                  let mail_text = match mail {
                      0 => "MAIL: IDLE",
                      1 => "MAIL: PENDING",
                      2 => "MAIL: SENDING",
                      3 => "MAIL: REQUEST SENT",
                      _ => "MAIL: RETRYING",
                  };

                  pnp::println!("{}", mail_text);
          '''

          f = replace_once(
              f,
              'pnp::println!("{}", label);',
              status,
              "Overlay"
          )

          # Verify critical safety logic survived.
          assert "if (v13_phase == 4)" in m
          assert "rowlet_v13_halt();" in m
          assert "rowlet_v13_reset_sent" in f
          assert "rowlet_try_nickname_start_frame" in m
          assert "rowlet_v136_notify_tick" in m

          main.write_text(m)
          frame.write_text(f)

          print("V13.6 code installed")
          PY

          python3 /tmp/rowlet136.py

      - name: Verify V13.6
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq 'rowlet_v136_count' 3gx/sources/main.c
          grep -Fq 'rowlet_v136_notify_tick' 3gx/sources/main.c
          grep -Fq 'rowlet_v136_send_mail' 3gx/sources/main.c
          grep -Fq 'rowlet_try_nickname_start_frame' 3gx/sources/main.c
          grep -Fq 'ROWLET: SHINY!' reader_core/src/gen7/frame.rs
          grep -Fq 'RESETS: {}' reader_core/src/gen7/frame.rs
          grep -Fq 'MAIL: REQUEST SENT' reader_core/src/gen7/frame.rs

          echo "V13.6 source checks passed"

      - name: Build PokeReader plugin
        shell: bash
        run: |
          set -o pipefail

          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            zaksabeast/devkitarm-rust make \
            2>&1 | tee rowlet_v13_6_compile.log

      - name: Upload plugin
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rowlet-v13-6-gmail-counter
          path: out/default.3gx
          if-no-files-found: error

      - name: Upload compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rowlet-v13-6-compile-log
          path: rowlet_v13_6_compile.log
          if-no-files-found: warn
